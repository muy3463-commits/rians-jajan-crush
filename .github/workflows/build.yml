                  Paint woodPlank=new Paint(Paint.ANTI_ALIAS_FLAG); woodPlank.setColor(Color.parseColor("#6D4C41"));
                  Paint woodBorder=new Paint(Paint.ANTI_ALIAS_FLAG); woodBorder.setColor(Color.parseColor("#5D4037")); woodBorder.setStyle(Paint.Style.STROKE); woodBorder.setStrokeWidth(1f);
                  Paint selGold=new Paint(Paint.ANTI_ALIAS_FLAG); selGold.setColor(Color.parseColor("#FFEB3B")); selGold.setStyle(Paint.Style.STROKE); selGold.setStrokeWidth(4);
                  Paint jack=new Paint(Paint.ANTI_ALIAS_FLAG); jack.setColor(Color.YELLOW); jack.setStyle(Paint.Style.STROKE); jack.setStrokeWidth(5);
                  for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                    float x=gridX+cc*cellW, y=gridY+r*cellH;
                    RectF rf=new RectF(x+1,y+1,x+cellW-1,y+cellH-1);
                    canvas.drawRoundRect(rf,5,5,woodPlank);
                    canvas.drawRoundRect(rf,5,5,woodBorder);
                    if(!isGameOver && r==selR && cc==selC) canvas.drawRoundRect(new RectF(x,y,x+cellW,y+cellH),7,7,selGold);
                    if(!isGameOver && jackpotReady && r==jackpotR && cc==jackpotC){ jack.setAlpha(110+(jackpotAnim%145)); jackpotAnim+=9; canvas.drawRoundRect(new RectF(x-1,y-1,x+cellW+1,y+cellH+1),7,7,jack); }
                    if(grid[r][cc]>=0 && grid[r][cc]<6 && jajanBmp[grid[r][cc]]!=null){
                      canvas.drawBitmap(jajanBmp[grid[r][cc]], null, new RectF(x+3,y+3,x+cellW-3,y+cellH-3), null);
                    }
                  }
                  Paint pp=new Paint(Paint.ANTI_ALIAS_FLAG);
                  for(int i=parts.size()-1;i>=0;i--){ Particle p=parts.get(i); p.x+=p.vx; p.y+=p.vy; p.vy+=0.45f; p.vx*=0.98f; p.alpha-=8; p.rot+=p.vr; if(p.alpha<=0) parts.remove(i); else { pp.setColor(p.col); pp.setAlpha((int)p.alpha); canvas.save(); canvas.translate(p.x,p.y); canvas.rotate(p.rot); canvas.drawCircle(0,0,p.r,pp); canvas.drawRect(-p.r,-p.r/2,p.r,p.r/2,pp); canvas.restore(); } }
                  Paint ftPaint=new Paint(Paint.ANTI_ALIAS_FLAG); ftPaint.setFakeBoldText(true); ftPaint.setTextAlign(Paint.Align.CENTER); ftPaint.setShadowLayer(6,0,0,Color.BLACK);
                  for(int i=floatTexts.size()-1;i>=0;i--){ FloatText ft=floatTexts.get(i); ft.y+=ft.vy; ft.vy+=0.08f; ft.alpha-=4; ft.scale+=0.01f; if(ft.alpha<=0) floatTexts.remove(i); else { ftPaint.setColor(ft.col); ftPaint.setAlpha((int)ft.alpha); ftPaint.setTextSize(w*0.04f*ft.scale); canvas.drawText(ft.txt, ft.x, ft.y, ftPaint); } }
                  if(parts.size()>0 || floatTexts.size()>0 || jackpotReady) postInvalidateDelayed(16);
                  if(showLevelUp){ Paint lu=new Paint(Paint.ANTI_ALIAS_FLAG); lu.setColor(Color.YELLOW); lu.setTextSize(w*0.11f); lu.setFakeBoldText(true); lu.setTextAlign(Paint.Align.CENTER); lu.setShadowLayer(12,0,0,Color.BLACK); float sc=1f+(float)Math.sin(levelUpTimer*0.22f)*0.18f; canvas.save(); canvas.scale(sc,sc,w/2,h/2); canvas.drawText("LEVEL "+level+"!", w/2, h/2, lu); canvas.restore(); levelUpTimer++; if(levelUpTimer>70){ showLevelUp=false; } postInvalidateDelayed(30); }
                  if(showJackpot){ Paint jTx=new Paint(Paint.ANTI_ALIAS_FLAG); jTx.setColor(Color.YELLOW); jTx.setTextSize(w*0.12f); jTx.setFakeBoldText(true); jTx.setTextAlign(Paint.Align.CENTER); jTx.setShadowLayer(14,0,0,Color.BLACK); float sc=1f+(float)Math.sin(jackpotPopup*0.3f)*0.25f; canvas.save(); canvas.scale(sc,sc,w/2,h/2); canvas.drawText("JACKPOT +500!", w/2, h/2, jTx); canvas.restore(); jackpotPopup++; if(jackpotPopup>65) showJackpot=false; postInvalidateDelayed(30); }
                  if(isGameOver){ Paint overBg=new Paint(Paint.ANTI_ALIAS_FLAG); overBg.setColor(Color.parseColor("#CC000000")); canvas.drawRect(0,0,w,h,overBg); Paint title=new Paint(Paint.ANTI_ALIAS_FLAG); title.setColor(Color.parseColor("#FF5252")); title.setTextSize(w*0.13f); title.setFakeBoldText(true); title.setTextAlign(Paint.Align.CENTER); title.setShadowLayer(10,0,0,Color.BLACK); Paint reason=new Paint(Paint.ANTI_ALIAS_FLAG); reason.setColor(Color.WHITE); reason.setTextSize(w*0.045f); reason.setFakeBoldText(true); reason.setTextAlign(Paint.Align.CENTER); Paint info=new Paint(Paint.ANTI_ALIAS_FLAG); info.setColor(Color.parseColor("#FFCA28")); info.setTextSize(w*0.038f); info.setTextAlign(Paint.Align.CENTER); float sc=1f+(float)Math.sin(overAnim*0.15f)*0.05f; canvas.save(); canvas.scale(sc,sc,w/2,h*0.42f); canvas.drawText("GAME OVER", w/2, h*0.42f, title); canvas.restore(); canvas.drawText(overReason, w/2, h*0.47f, reason); canvas.drawText("LEVEL "+level+" - SCORE "+score+"/"+target, w/2, h*0.52f, info); Paint btnBg=new Paint(Paint.ANTI_ALIAS_FLAG); btnBg.setColor(Color.parseColor("#FFCA28")); Paint btnTx=new Paint(Paint.ANTI_ALIAS_FLAG); btnTx.setColor(Color.parseColor("#3E2723")); btnTx.setTextSize(w*0.05f); btnTx.setFakeBoldText(true); btnTx.setTextAlign(Paint.Align.CENTER); canvas.drawRoundRect(btnRestart,12,12,btnBg); canvas.drawText("ULANGI LEVEL "+level, btnRestart.centerX(), btnRestart.centerY()+w*0.015f, btnTx); overAnim++; postInvalidateDelayed(30); }
                }catch(Exception e){}
              }
              public boolean onTouchEvent(MotionEvent e){ if(isGameOver && e.getAction()==MotionEvent.ACTION_UP){ float x=e.getX(), y=e.getY(); if(btnRestart!=null && btnRestart.contains(x,y)){ initGridSameLevel(); invalidate(); return true; } return true; } if(isGameOver) return true; if(e.getAction()==MotionEvent.ACTION_DOWN){ float x=e.getX(), y=e.getY(); if(boxMute!=null && boxMute.contains(x,y)){ toggleMute(); invalidate(); return true; } downX=x; downY=y; downR=(int)((y-gridY)/cellH); downC=(int)((x-gridX)/cellW); if(downR>=0&&downR<ROWS&&downC>=0&&downC<COLS){ selR=downR; selC=downC; invalidate(); } } if(e.getAction()==MotionEvent.ACTION_UP){ float x=e.getX(), y=e.getY(); float dx=x-downX, dy=y-downY; int r=downR, c=downC; if(r<0||r>=ROWS||c<0||c>=COLS){ selR=-1; selC=-1; invalidate(); return true; } if(Math.abs(dx)<10 && Math.abs(dy)<10) return true; if(Math.abs(dx)>Math.abs(dy)){ int nc=c+(dx>0?1:-1); if(nc>=0&&nc<COLS){ int tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; } else { moves--; saveGame(); if(moves<=0 && score<target) setGameOver("MOVES HABIS!"); } } } else { int nr=r+(dy>0?1:-1); if(nr>=0&&nr<ROWS){ int tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; } else { moves--; saveGame(); if(moves<=0 && score<target) setGameOver("MOVES HABIS!"); } } } selR=-1; selC=-1; invalidate(); } return true; }
            }
          }
