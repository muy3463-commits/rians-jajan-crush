name: Build V6.5 Fix Touch Rapih

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build V6.5 Rapih Bisa Sentuh
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          cp bg_desa.png app/src/main/res/drawable/
          cp jajan01.png app/src/main/res/drawable/
          cp jajan02.png app/src/main/res/drawable/
          cp jajan03.png app/src/main/res/drawable/
          cp jajan04.png app/src/main/res/drawable/
          cp jajan05.png app/src/main/res/drawable/
          cp jajan06.png app/src/main/res/drawable/
          cp icon.png app/src/main/res/drawable/ic_launcher.png
          cp music.mp3 app/src/main/res/raw/music.mp3
          cp music.mp3 app/src/main/res/raw/jackpot.mp3

          cat > settings.gradle << 'SET'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          SET
          cat > build.gradle << 'ROOT'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          ROOT
          cat > app/build.gradle << 'APP'
          plugins { id 'com.android.application' }
          android { namespace 'com.rians.jajancrush'; compileSdk 34; defaultConfig { applicationId "com.rians.jajancrush"; minSdk 21; targetSdk 34; versionCode 65; versionName "V6.5-Fix" } }
          APP
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Rian's Jajan Crush" android:icon="@drawable/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          MAN

          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVA'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.widget.*; import android.view.*; import android.graphics.*; import android.graphics.drawable.GradientDrawable; import android.media.MediaPlayer; import java.util.Random;

          public class MainActivity extends Activity {
              int level=6, score=0, target=1250, moves=18, rows=6, cols=5;
              int[][] board; ImageView[][] grid; int[] jajans; Random rand=new Random();
              TextView tvLevel, tvScore, tvMoves; LinearLayout boardLayout;
              MediaPlayer bgMusic, jackpotSound;

              @Override
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  jajans=new int[]{R.drawable.jajan01,R.drawable.jajan02,R.drawable.jajan03,R.drawable.jajan04,R.drawable.jajan05,R.drawable.jajan06};

                  FrameLayout root=new FrameLayout(this);
                  ImageView bg=new ImageView(this); bg.setImageResource(R.drawable.bg_desa); bg.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  root.addView(bg, new FrameLayout.LayoutParams(-1,-1));

                  // --- TOP UI - HANYA 380dp TINGGINYA BIAR GAK NUTUPIN JAJAN ---
                  RelativeLayout top=new RelativeLayout(this);
                  FrameLayout.LayoutParams topLp = new FrameLayout.LayoutParams(-1, dp(380));
                  top.setLayoutParams(topLp);

                  LinearLayout boxLevel = createBox("LEVEL", String.valueOf(level));
                  LinearLayout boxScore = createBox("SCORE", score+"/"+target);
                  LinearLayout boxMoves = createBox("MOVES", String.valueOf(moves));
                  tvLevel = (TextView) boxLevel.getChildAt(1);
                  tvScore = (TextView) boxScore.getChildAt(1);
                  tvMoves = (TextView) boxMoves.getChildAt(1);

                  RelativeLayout.LayoutParams pLevel = new RelativeLayout.LayoutParams(dp(130), dp(62));
                  pLevel.setMargins(dp(10), dp(10), 0, 0);
                  RelativeLayout.LayoutParams pScore = new RelativeLayout.LayoutParams(dp(130), dp(62));
                  pScore.addRule(RelativeLayout.ALIGN_PARENT_RIGHT);
                  pScore.setMargins(0, dp(10), dp(10), 0);
                  RelativeLayout.LayoutParams pMoves = new RelativeLayout.LayoutParams(dp(130), dp(62));
                  pMoves.setMargins(dp(10), dp(84), 0, 0);
                  RelativeLayout.LayoutParams pMusic = new RelativeLayout.LayoutParams(dp(62), dp(62));
                  pMusic.addRule(RelativeLayout.ALIGN_PARENT_RIGHT);
                  pMusic.setMargins(0, dp(84), dp(24), 0);

                  TextView btnMusic = createMusicBtn();
                  top.addView(boxLevel, pLevel); top.addView(boxScore, pScore);
                  top.addView(boxMoves, pMoves); top.addView(btnMusic, pMusic);
                  root.addView(top);

                  // --- BOARD - POSISI PERSIS DI BAWAH PAPAN NAMA ---
                  LinearLayout container = new LinearLayout(this);
                  container.setOrientation(LinearLayout.VERTICAL);
                  container.setGravity(Gravity.CENTER_HORIZONTAL);
                  FrameLayout.LayoutParams contLp = new FrameLayout.LayoutParams(-1,-1);
                  contLp.topMargin = dp(345);
                  container.setLayoutParams(contLp);
                  container.setPadding(dp(10), dp(4), dp(10), dp(10));

                  boardLayout = new LinearLayout(this);
                  boardLayout.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable boardBg = new GradientDrawable();
                  boardBg.setColor(Color.parseColor("#6D4C41")); // coklat solid kayak V5!
                  boardBg.setCornerRadius(dp(6));
                  boardBg.setStroke(2, Color.parseColor("#4E342E"));
                  boardLayout.setBackground(boardBg);

                  container.addView(boardLayout, new LinearLayout.LayoutParams(-1,-2));
                  root.addView(container);

                  setContentView(root);

                  try{ bgMusic=MediaPlayer.create(this,R.raw.music); bgMusic.setLooping(true); bgMusic.setVolume(0.4f,0.4f); bgMusic.start(); }catch(Exception e){}
                  try{ jackpotSound=MediaPlayer.create(this,R.raw.jackpot); }catch(Exception e){}
                  btnMusic.setOnClickListener(v->{ if(bgMusic!=null){ if(bgMusic.isPlaying()){bgMusic.pause(); v.setAlpha(0.5f);} else {bgMusic.start(); v.setAlpha(1f);} } });

                  initBoard(); drawBoard();
              }

              LinearLayout createBox(String title, String value){
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor("#3E2723")); // SOLID gelap kayak V5, bukan transparan!
                  gd.setCornerRadius(dp(6));
                  gd.setStroke(2, Color.parseColor("#FFD700"));
                  LinearLayout ll = new LinearLayout(this);
                  ll.setOrientation(LinearLayout.VERTICAL);
                  ll.setGravity(Gravity.CENTER);
                  ll.setBackground(gd);
                  ll.setPadding(dp(2),dp(4),dp(2),dp(4));
                  TextView tTitle = new TextView(this);
                  tTitle.setText(title); tTitle.setTextColor(Color.parseColor("#FFC107"));
                  tTitle.setTextSize(10); tTitle.setGravity(Gravity.CENTER); tTitle.setTypeface(null, Typeface.BOLD);
                  TextView tVal = new TextView(this);
                  tVal.setText(value); tVal.setTextColor(Color.WHITE);
                  tVal.setTextSize(16); tVal.setGravity(Gravity.CENTER); tVal.setTypeface(null, Typeface.BOLD);
                  ll.addView(tTitle); ll.addView(tVal);
                  return ll;
              }

              TextView createMusicBtn(){
                  GradientDrawable gd = new GradientDrawable();
                  gd.setShape(GradientDrawable.OVAL);
                  gd.setColor(Color.parseColor("#3E2723"));
                  gd.setStroke(2, Color.parseColor("#FFD700"));
                  TextView tv = new TextView(this);
                  tv.setText("♪"); tv.setTextSize(20); tv.setTextColor(Color.parseColor("#FFD700"));
                  tv.setGravity(Gravity.CENTER); tv.setBackground(gd);
                  return tv;
              }

              int dp(int d){ return (int)(d * getResources().getDisplayMetrics().density); }

              void initBoard(){ board=new int[rows][cols]; for(int r=0;r<rows;r++) for(int c=0;c<cols;c++) board[r][c]=rand.nextInt(6); }

              void drawBoard(){
                  boardLayout.removeAllViews(); grid=new ImageView[rows][cols];
                  int size = (getResources().getDisplayMetrics().widthPixels - dp(24)) / 5;
                  for(int r=0;r<rows;r++){
                      LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                      for(int c=0;c<cols;c++){
                          final int rr=r, cc=c;
                          FrameLayout cell = new FrameLayout(this);
                          cell.setBackgroundColor(Color.parseColor("#5D4037"));
                          GradientDrawable cellBg = new GradientDrawable();
                          cellBg.setColor(Color.parseColor("#8D6E63"));
                          cellBg.setStroke(1, Color.parseColor("#4E342E"));
                          cell.setBackground(cellBg);
                          ImageView iv = new ImageView(this);
                          iv.setImageResource(jajans[board[r][c]]);
                          iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                          iv.setPadding(dp(6),dp(6),dp(6),dp(6));
                          cell.addView(iv, new FrameLayout.LayoutParams(-1,-1));
                          iv.setOnClickListener(v->onClick(rr,cc));
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(size, size);
                          lp.setMargins(1,1,1,1);
                          row.addView(cell, lp);
                          grid[r][c]=iv;
                      }
                      boardLayout.addView(row);
                  }
                  updateUI();
              }

              int selR=-1, selC=-1;
              void onClick(int r,int c){
                  if(selR==-1){ selR=r; selC=c; grid[r][c].setBackgroundColor(Color.YELLOW); }
                  else {
                      if(Math.abs(selR-r)+Math.abs(selC-c)==1){
                          int tmp=board[selR][selC]; board[selR][selC]=board[r][c]; board[r][c]=tmp;
                          moves--; score+=50; checkWin();
                      }
                      if(selR>=0) grid[selR][selC].setBackgroundColor(Color.TRANSPARENT);
                      selR=-1; selC=-1; drawBoard();
                  }
              }

              void checkWin(){
                  if(score>=target){
                      level++; target+=250; score=0; moves=18;
                      try{ if(jackpotSound!=null){ jackpotSound.seekTo(0); jackpotSound.start(); } }catch(Exception e){}
                      Toast.makeText(this,"🎰 JACKPOT! LEVEL "+level+" ♾️",Toast.LENGTH_LONG).show();
                      initBoard();
                  }
                  if(moves<=0){ Toast.makeText(this,"Game Over! Ulang Level "+level,Toast.LENGTH_SHORT).show(); score=0; moves=18; initBoard(); }
              }

              void updateUI(){
                  if(tvLevel!=null) tvLevel.setText(String.valueOf(level));
                  if(tvScore!=null) tvScore.setText(score+"/"+target);
                  if(tvMoves!=null) tvMoves.setText(String.valueOf(moves));
              }
              protected void onPause(){ super.onPause(); if(bgMusic!=null) bgMusic.pause(); }
              protected void onResume(){ super.onResume(); if(bgMusic!=null) bgMusic.start(); }
              protected void onDestroy(){ super.onDestroy(); if(bgMusic!=null) bgMusic.release(); if(jackpotSound!=null) jackpotSound.release(); }
          }
          JAVA

          cd /tmp && wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip && unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JajanCrush-V6.5-Rapih-BisaSentuh
          path: app/build/outputs/apk/debug/app-debug.apk
