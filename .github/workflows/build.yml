name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Project
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/java/com/rians/jajancrush
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan01.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan02.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan03.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan04.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan05.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan06.png app/src/main/res/drawable/ 2>/dev/null || true
          if [ -f music.mp3 ]; then cp music.mp3 app/src/main/res/raw/music.mp3; fi
          if [ -f icon.png ]; then cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png; fi
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.*;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.*;
          import java.util.ArrayList;
          public class MainActivity extends Activity{
            SharedPreferences prefs; MediaPlayer bgMusic; boolean isMuted=false;
            protected void onCreate(Bundle b){ super.onCreate(b); prefs=getSharedPreferences("jajan",0); isMuted=prefs.getBoolean("mute",false); try{ int mid=getResources().getIdentifier("music","raw",getPackageName()); if(mid!=0){ bgMusic=MediaPlayer.create(this,mid); bgMusic.setLooping(true); if(!isMuted) bgMusic.start(); } }catch(Exception e){} setContentView(new GameView(this)); }
            protected void onPause(){ super.onPause(); try{ if(bgMusic!=null) bgMusic.pause(); }catch(Exception e){} }
            protected void onResume(){ super.onResume(); if(!isMuted) try{ if(bgMusic!=null) bgMusic.start(); }catch(Exception e){} }
            class Particle{ float x,y,vx,vy,r,alpha; }
            class GameView extends View{
              int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS];
              float cellW, cellH, gridX, gridY;
              RectF boxLevel, boxScore, boxMoves, boxMute;
              int level=1, score=340, moves=28;
              float downX, downY; int downR, downC; int selR=-1, selC=-1;
              Bitmap[] jajanBmp=new Bitmap[6]; Bitmap bg;
              ArrayList<Particle> parts=new ArrayList<>();
              int jackpotR=-1, jackpotC=-1; boolean jackpotReady=false; int jackpotAnim=0; int failCount=0; boolean showJackpot=false; int jackpotPopup=0;
              Bitmap safe(int id){ try{ return BitmapFactory.decodeResource(getResources(),id); }catch(Exception e){ return null; } }
              public GameView(Context c){
                super(c);
                try{
                  int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName());
                  if(bgId!=0) bg=safe(bgId);
                  for(int i=0;i<6;i++){
                    int id=getResources().getIdentifier("jajan0"+(i+1),"drawable",getPackageName());
                    if(id!=0) jajanBmp[i]=safe(id);
                  }
                }catch(Exception e){}
              }
              void toggleMute(){
                isMuted=!isMuted;
                try{ prefs.edit().putBoolean("mute",isMuted).apply(); }catch(Exception e){}
                try{
                  if(isMuted){ if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.pause(); }
                  else { if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.start(); }
                }catch(Exception e){}
              }
              void initGrid(){
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                  int v;
                  do{
                    v=(int)(Math.random()*6);
                    grid[r][cc]=v;
                  } while( (r>=2 && grid[r][cc]==grid[r-1][cc] && grid[r][cc]==grid[r-2][cc]) || (cc>=2 && grid[r][cc]==grid[r][cc-1] && grid[r][cc]==grid[r][cc-2]) );
                }
                failCount=0; jackpotReady=false; selR=-1; selC=-1;
              }
              void spawn(float x,float y){ for(int i=0;i<18;i++){ Particle p=new Particle(); p.x=x; p.y=y; p.vx=(float)(Math.random()*12-6); p.vy=(float)(Math.random()*-10-2); p.r=(float)(Math.random()*8+4); p.alpha=255; parts.add(p); } }
              boolean checkMatch(){
                boolean[][] del=new boolean[ROWS][COLS]; boolean found=false;
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                  if(r<ROWS-2 && grid[r][cc]==grid[r+1][cc] && grid[r][cc]==grid[r+2][cc]){ del[r][cc]=del[r+1][cc]=del[r+2][cc]=true; found=true; }
                  if(cc<COLS-2 && grid[r][cc]==grid[r][cc+1] && grid[r][cc]==grid[r][cc+2]){ del[r][cc]=del[r][cc+1]=del[r][cc+2]=true; found=true; }
                }
                if(found && jackpotReady && del[jackpotR][jackpotC]){ score+=500; showJackpot=true; jackpotPopup=0; spawn(gridX+jackpotC*cellW+cellW/2, gridY+jackpotR*cellH+cellH/2); jackpotReady=false; failCount=0; }
                if(found){
                  for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(del[r][cc]){ score+=20; grid[r][cc]=-1; }
                  for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=(int)(Math.random()*6); }
                  return true;
                }
                failCount++; if(failCount>12 &&!jackpotReady){ if(Math.random()>0.4){ jackpotReady=true; jackpotR=(int)(Math.random()*ROWS); jackpotC=(int)(Math.random()*COLS); } }
                return false;
              }
              protected void onDraw(Canvas canvas){
                int w=getWidth(), h=getHeight(); if(w==0||h==0) return;
                if(cellW==0){
                  gridX=w*0.032f; gridY=h*0.412f; cellW=(w-gridX*2)/COLS; cellH=cellW*0.99f;
                  float bw=w*0.26f, bh=h*0.058f; float muteS=w*0.13f;
                  boxLevel=new RectF(w*0.032f, h*0.082f, w*0.032f+bw, h*0.082f+bh);
                  boxMoves=new RectF(w*0.032f, h*0.168f, w*0.032f+bw, h*0.168f+bh);
                  boxScore=new RectF(w*0.708f, h*0.082f, w*0.708f+bw, h*0.082f+bh);
                  boxMute=new RectF(w*0.708f+bw/2-muteS/2, h*0.168f, w*0.708f+bw/2+muteS/2, h*0.168f+muteS);
                  initGrid();
                }
                if(bg!=null) canvas.drawBitmap(bg,null,new Rect(0,0,w,h),null); else canvas.drawColor(Color.parseColor("#5D4037"));
                Paint boxBg=new Paint(Paint.ANTI_ALIAS_FLAG); boxBg.setColor(Color.parseColor("#4A2A1A"));
                Paint boxBorder=new Paint(Paint.ANTI_ALIAS_FLAG); boxBorder.setColor(Color.parseColor("#FFD700")); boxBorder.setStyle(Paint.Style.STROKE); boxBorder.setStrokeWidth(3);
                Paint label=new Paint(Paint.ANTI_ALIAS_FLAG); label.setColor(Color.parseColor("#FFD54F")); label.setTextAlign(Paint.Align.CENTER); label.setTextSize(w*0.029f); label.setFakeBoldText(true);
                Paint value=new Paint(Paint.ANTI_ALIAS_FLAG); value.setColor(Color.WHITE); value.setTextAlign(Paint.Align.CENTER); value.setFakeBoldText(true);
                if(boxLevel!=null){ canvas.drawRoundRect(boxLevel,12,12,boxBg); canvas.drawRoundRect(boxLevel,12,12,boxBorder); label.setTextSize(w*0.031f); canvas.drawText("LEVEL", boxLevel.centerX(), boxLevel.top+w*0.038f, label); value.setTextSize(w*0.055f); canvas.drawText(String.valueOf(level), boxLevel.centerX(), boxLevel.centerY()+w*0.045f, value); }
                if(boxMoves!=null){ canvas.drawRoundRect(boxMoves,12,12,boxBg); canvas.drawRoundRect(boxMoves,12,12,boxBorder); canvas.drawText("MOVES", boxMoves.centerX(), boxMoves.top+w*0.038f, label); value.setTextSize(w*0.055f); canvas.drawText(String.valueOf(moves), boxMoves.centerX(), boxMoves.centerY()+w*0.045f, value); }
                if(boxScore!=null){ canvas.drawRoundRect(boxScore,12,12,boxBg); canvas.drawRoundRect(boxScore,12,12,boxBorder); canvas.drawText("SCORE", boxScore.centerX(), boxScore.top+w*0.038f, label); value.setTextSize(w*0.038f); canvas.drawText(score+"/500", boxScore.centerX(), boxScore.centerY()+w*0.04f, value); }
                if(boxMute!=null){
                  Paint muteBg=new Paint(Paint.ANTI_ALIAS_FLAG); muteBg.setColor(Color.parseColor("#4A2A1A"));
                  Paint muteBd=new Paint(Paint.ANTI_ALIAS_FLAG); muteBd.setColor(Color.parseColor("#FFD700")); muteBd.setStyle(Paint.Style.STROKE); muteBd.setStrokeWidth(3);
                  canvas.drawCircle(boxMute.centerX(), boxMute.centerY(), boxMute.width()/2, muteBg);
                  canvas.drawCircle(boxMute.centerX(), boxMute.centerY(), boxMute.width()/2, muteBd);
                  Paint icon=new Paint(Paint.ANTI_ALIAS_FLAG); icon.setColor(Color.parseColor("#FFD700")); icon.setTextSize(w*0.07f); icon.setTextAlign(Paint.Align.CENTER);
                  canvas.drawText(isMuted?"🔇":"🔊", boxMute.centerX(), boxMute.centerY()+w*0.025f, icon);
                }
                Paint cream=new Paint(Paint.ANTI_ALIAS_FLAG); cream.setColor(Color.parseColor("#FFFEF8E8"));
                Paint sel=new Paint(Paint.ANTI_ALIAS_FLAG); sel.setColor(Color.parseColor("#FFEB3B")); sel.setStyle(Paint.Style.STROKE); sel.setStrokeWidth(6);
                Paint jack=new Paint(Paint.ANTI_ALIAS_FLAG); jack.setColor(Color.YELLOW); jack.setStyle(Paint.Style.STROKE); jack.setStrokeWidth(7);
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                  float x=gridX+cc*cellW, y=gridY+r*cellH;
                  RectF rf=new RectF(x+2,y+2,x+cellW-2,y+cellH-2);
                  canvas.drawRoundRect(rf,14,14,cream);
                  if(r==selR && cc==selC) canvas.drawRoundRect(new RectF(x,y,x+cellW,y+cellH),16,16,sel);
                  if(jackpotReady && r==jackpotR && cc==jackpotC){ jack.setAlpha(120+(jackpotAnim%135)); jackpotAnim+=7; canvas.drawRoundRect(new RectF(x-1,y-1,x+cellW+1,y+cellH+1),16,16,jack); }
                  if(grid[r][cc]>=0 && grid[r][cc]<6 && jajanBmp[grid[r][cc]]!=null){
                    canvas.drawBitmap(jajanBmp[grid[r][cc]], null, new RectF(x+4,y+4,x+cellW-4,y+cellH-4), null);
                  }
                }
                Paint pp=new Paint(Paint.ANTI_ALIAS_FLAG); pp.setColor(Color.YELLOW);
                for(int i=parts.size()-1;i>=0;i--){ Particle p=parts.get(i); p.x+=p.vx; p.y+=p.vy; p.vy+=0.5f; p.alpha-=9; if(p.alpha<=0) parts.remove(i); else { pp.setAlpha((int)p.alpha); canvas.drawCircle(p.x,p.y,p.r,pp); } }
                if(parts.size()>0 || jackpotReady) postInvalidateDelayed(35);
                if(showJackpot){
                  Paint jTx=new Paint(Paint.ANTI_ALIAS_FLAG); jTx.setColor(Color.YELLOW); jTx.setTextSize(w*0.11f); jTx.setFakeBoldText(true); jTx.setTextAlign(Paint.Align.CENTER); jTx.setShadowLayer(12,0,0,Color.BLACK);
                  float sc=1f+ (float)Math.sin(jackpotPopup*0.3f)*0.2f; canvas.save(); canvas.scale(sc,sc,w/2,h/2); canvas.drawText("JACKPOT +500!", w/2, h/2, jTx); canvas.restore(); jackpotPopup++; if(jackpotPopup>50) showJackpot=false; postInvalidateDelayed(30);
                }
              }
              public boolean onTouchEvent(MotionEvent e){
                if(e.getAction()==MotionEvent.ACTION_DOWN){
                  float x=e.getX(), y=e.getY();
                  if(boxMute!=null && boxMute.contains(x,y)){ toggleMute(); invalidate(); return true; }
                  downX=x; downY=y; downR=(int)((y-gridY)/cellH); downC=(int)((x-gridX)/cellW);
                  if(downR>=0&&downR<ROWS&&downC>=0&&downC<COLS){ selR=downR; selC=downC; invalidate(); }
                }
                if(e.getAction()==MotionEvent.ACTION_UP){
                  float x=e.getX(), y=e.getY(); float dx=x-downX, dy=y-downY; int r=downR, c=downC;
                  if(r<0||r>=ROWS||c<0||c>=COLS){ selR=-1; selC=-1; invalidate(); return true; }
                  if(Math.abs(dx)<10 && Math.abs(dy)<10) return true;
                  if(Math.abs(dx)>Math.abs(dy)){
                    int nc=c+(dx>0?1:-1); if(nc>=0&&nc<COLS){
                      int tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp;
                      if(!checkMatch()){ tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; } else { moves--; }
                    }
                  } else {
                    int nr=r+(dy>0?1:-1); if(nr>=0&&nr<ROWS){
                      int tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp;
                      if(!checkMatch()){ tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; } else { moves--; }
                    }
                  }
                  selR=-1; selC=-1; invalidate();
                }
                return true;
              }
            }
          }
          JAVAEOF
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rians.jajancrush'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rians.jajancrush"
                  minSdk 21
                  targetSdk 34
                  versionCode 8
                  versionName "6.0 Perfect Foto2 + Jackpot"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {}
          GRADLE
          cat > build.gradle << 'B'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          B
          cat > settings.gradle << 'SET'
          include ':app'
          SET
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush V5" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANIFEST
      - name: Build APK
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jajan-crush-v6-perfect-foto2-jackpot
          path: app/build/outputs/apk/debug/app-debug.apk
