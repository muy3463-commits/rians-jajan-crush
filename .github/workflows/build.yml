name: Build V9 Clone V5 Infinite

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build V9 Clone V5
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          cp bg_desa.png app/src/main/res/drawable/
          cp jajan01.png app/src/main/res/drawable/
          cp jajan02.png app/src/main/res/drawable/
          cp jajan03.png app/src/main/res/drawable/
          cp jajan04.png app/src/main/res/drawable/
          cp jajan05.png app/src/main/res/drawable/
          cp jajan06.png app/src/main/res/drawable/
          cp icon.png app/src/main/res/drawable/ic_launcher.png
          cp music.mp3 app/src/main/res/raw/music.mp3
          cp music.mp3 app/src/main/res/raw/jackpot.mp3

          cat > settings.gradle << 'SET'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          SET
          cat > build.gradle << 'ROOT'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          ROOT
          cat > app/build.gradle << 'APP'
          plugins { id 'com.android.application' }
          android { namespace 'com.rians.jajancrush'; compileSdk 34; defaultConfig { applicationId "com.rians.jajancrush"; minSdk 21; targetSdk 34; versionCode 90; versionName "V9-CloneV5" } }
          APP
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Rian's Jajan Crush" android:icon="@drawable/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          MAN

          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVA'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.widget.*; import android.view.*; import android.graphics.*; import android.graphics.drawable.GradientDrawable; import android.media.MediaPlayer; import java.util.Random;

          public class MainActivity extends Activity {
              int level=1, score=0, target=500, moves=18, rows=6, cols=5;
              int[][] board; ImageView[][] icons; int[] jajans; Random rand=new Random();
              TextView tvLevelVal, tvScoreVal, tvMovesVal; LinearLayout boardLayout;
              MediaPlayer bgMusic, jackpotSound; int selR=-1, selC=-1;

              @Override
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  jajans=new int[]{R.drawable.jajan01,R.drawable.jajan02,R.drawable.jajan03,R.drawable.jajan04,R.drawable.jajan05,R.drawable.jajan06};

                  FrameLayout root=new FrameLayout(this);
                  // BACKGROUND FULL - BORDER BATIK KELIATAN SEMUA - PAKE FIT_XY BIAR GAK KE-CROP!
                  ImageView bg=new ImageView(this); bg.setImageResource(R.drawable.bg_desa); bg.setScaleType(ImageView.ScaleType.FIT_XY);
                  root.addView(bg, new FrameLayout.LayoutParams(-1,-1));

                  // TOP UI - PERSIS V5 - KOTAK KECIL DI POJOK
                  RelativeLayout top=new RelativeLayout(this);
                  top.setLayoutParams(new FrameLayout.LayoutParams(-1, dp(170)));

                  // BUAT KOTAK
                  LinearLayout boxLevel = makeBox("LEVEL", "1");
                  LinearLayout boxScore = makeBox("SCORE", "0/500");
                  LinearLayout boxMoves = makeBox("MOVES", "18");
                  tvLevelVal = (TextView)boxLevel.getChildAt(1);
                  tvScoreVal = (TextView)boxScore.getChildAt(1);
                  tvMovesVal = (TextView)boxMoves.getChildAt(1);

                  RelativeLayout.LayoutParams pLevel = new RelativeLayout.LayoutParams(dp(132), dp(56));
                  pLevel.setMargins(dp(10), dp(10), 0, 0);
                  RelativeLayout.LayoutParams pScore = new RelativeLayout.LayoutParams(dp(132), dp(56));
                  pScore.addRule(RelativeLayout.ALIGN_PARENT_RIGHT);
                  pScore.setMargins(0, dp(10), dp(10), 0);
                  RelativeLayout.LayoutParams pMoves = new RelativeLayout.LayoutParams(dp(132), dp(56));
                  pMoves.setMargins(dp(10), dp(76), 0, 0);
                  RelativeLayout.LayoutParams pMusic = new RelativeLayout.LayoutParams(dp(56), dp(56));
                  pMusic.addRule(RelativeLayout.ALIGN_PARENT_RIGHT);
                  pMusic.setMargins(0, dp(76), dp(24), 0);

                  TextView btnMusic = makeMusicCircle();

                  top.addView(boxLevel, pLevel);
                  top.addView(boxScore, pScore);
                  top.addView(boxMoves, pMoves);
                  top.addView(btnMusic, pMusic);
                  root.addView(top);

                  // BOARD - DI BAWAH PAPAN NAMA - PERSIS V5
                  LinearLayout container = new LinearLayout(this);
                  container.setOrientation(LinearLayout.VERTICAL);
                  container.setGravity(Gravity.CENTER_HORIZONTAL);
                  FrameLayout.LayoutParams clp = new FrameLayout.LayoutParams(-1,-1);
                  clp.topMargin = dp(298);
                  container.setLayoutParams(clp);
                  container.setPadding(dp(10),0,dp(10),dp(10));

                  boardLayout = new LinearLayout(this);
                  boardLayout.setOrientation(LinearLayout.VERTICAL);
                  boardLayout.setBackgroundColor(Color.parseColor("#6B5B53"));
                  container.addView(boardLayout);
                  root.addView(container);

                  setContentView(root);

                  try{ bgMusic=MediaPlayer.create(this,R.raw.music); bgMusic.setLooping(true); bgMusic.setVolume(0.4f,0.4f); bgMusic.start(); }catch(Exception e){}
                  try{ jackpotSound=MediaPlayer.create(this,R.raw.jackpot); }catch(Exception e){}
                  btnMusic.setOnClickListener(v->{ if(bgMusic!=null){ if(bgMusic.isPlaying()){bgMusic.pause(); v.setAlpha(0.5f);} else {bgMusic.start(); v.setAlpha(1f);} } });

                  initBoard(); drawBoard();
              }

              LinearLayout makeBox(String title, String value){
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor("#3E2723"));
                  gd.setCornerRadius(dp(6));
                  gd.setStroke(2, Color.parseColor("#FFD700"));
                  LinearLayout ll = new LinearLayout(this);
                  ll.setOrientation(LinearLayout.VERTICAL);
                  ll.setGravity(Gravity.CENTER);
                  ll.setBackground(gd);
                  TextView t1 = new TextView(this); t1.setText(title); t1.setTextColor(Color.parseColor("#FFC107")); t1.setTextSize(10); t1.setGravity(Gravity.CENTER); t1.setTypeface(null, Typeface.BOLD);
                  TextView t2 = new TextView(this); t2.setText(value); t2.setTextColor(Color.WHITE); t2.setTextSize(18); t2.setGravity(Gravity.CENTER); t2.setTypeface(null, Typeface.BOLD);
                  ll.addView(t1); ll.addView(t2);
                  return ll;
              }

              TextView makeMusicCircle(){
                  GradientDrawable gd = new GradientDrawable(); gd.setShape(GradientDrawable.OVAL); gd.setColor(Color.parseColor("#3E2723")); gd.setStroke(2, Color.parseColor("#FFD700"));
                  TextView tv = new TextView(this); tv.setText("♪"); tv.setTextSize(20); tv.setTextColor(Color.parseColor("#FFD700")); tv.setGravity(Gravity.CENTER); tv.setBackground(gd); return tv;
              }

              int dp(int d){ return (int)(d*getResources().getDisplayMetrics().density); }
              void initBoard(){ board=new int[rows][cols]; for(int r=0;r<rows;r++) for(int c=0;c<cols;c++) board[r][c]=rand.nextInt(6); }

              void drawBoard(){
                  boardLayout.removeAllViews(); icons=new ImageView[rows][cols];
                  int size = (getResources().getDisplayMetrics().widthPixels - dp(22)) / 5;
                  for(int r=0;r<rows;r++){
                      LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                      for(int c=0;c<cols;c++){
                          final int rr=r, cc=c;
                          FrameLayout cell = new FrameLayout(this);
                          GradientDrawable cellBg = new GradientDrawable(); cellBg.setColor(Color.parseColor("#7A6A62")); cellBg.setStroke(1, Color.parseColor("#5D4037")); cell.setBackground(cellBg);
                          ImageView iv = new ImageView(this); iv.setImageResource(jajans[board[r][c]]); iv.setScaleType(ImageView.ScaleType.FIT_CENTER); iv.setPadding(dp(8),dp(8),dp(8),dp(8));
                          if(selR==r && selC==c) iv.setAlpha(0.5f);
                          cell.addView(iv, new FrameLayout.LayoutParams(-1,-1));
                          View.OnClickListener cl = v -> {
                              if(selR==-1){ selR=rr; selC=cc; drawBoard(); }
                              else{
                                  if(selR==rr && selC==cc){ selR=-1; selC=-1; drawBoard(); return; }
                                  if(Math.abs(selR-rr)+Math.abs(selC-cc)==1){
                                      int tmp=board[selR][selC]; board[selR][selC]=board[rr][cc]; board[rr][cc]=tmp;
                                      moves--; score+=100;
                                      if(score>=target){
                                          level++; target+=250; score=0; moves=18;
                                          try{ if(jackpotSound!=null){ jackpotSound.seekTo(0); jackpotSound.start(); } }catch(Exception e){}
                                          Toast.makeText(this,"🎰 JACKPOT LEVEL "+level+" ♾️",Toast.LENGTH_SHORT).show();
                                      }
                                      if(moves<=0){ Toast.makeText(this,"Game Over Level "+level,Toast.LENGTH_SHORT).show(); score=0; moves=18; }
                                      selR=-1; selC=-1; drawBoard();
                                  } else { selR=rr; selC=cc; drawBoard(); }
                              }
                          };
                          cell.setOnClickListener(cl); iv.setOnClickListener(cl);
                          row.addView(cell, new LinearLayout.LayoutParams(size,size));
                          icons[r][c]=iv;
                      }
                      boardLayout.addView(row);
                  }
                  tvLevelVal.setText(String.valueOf(level));
                  tvScoreVal.setText(score+"/"+target);
                  tvMovesVal.setText(String.valueOf(moves));
              }

              protected void onPause(){ super.onPause(); if(bgMusic!=null) bgMusic.pause(); }
              protected void onResume(){ super.onResume(); if(bgMusic!=null) bgMusic.start(); }
          }
          JAVA

          cd /tmp && wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip && unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JajanCrush-V9-Clone-V5-Infinite
          path: app/build/outputs/apk/debug/app-debug.apk
