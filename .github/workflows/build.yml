name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Project
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/java/com/rians/jajancrush
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan01.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan02.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan03.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan04.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan05.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan06.png app/src/main/res/drawable/ 2>/dev/null || true
          if [ -f music.mp3 ]; then cp music.mp3 app/src/main/res/raw/music.mp3; fi
          if [ -f icon.png ]; then cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png; fi
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.*;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.*;
          import java.util.ArrayList;
          public class MainActivity extends Activity{
            SharedPreferences prefs; MediaPlayer bgMusic; boolean isMuted=false;
            protected void onCreate(Bundle b){ super.onCreate(b); prefs=getSharedPreferences("jajan",0); isMuted=prefs.getBoolean("mute",false); try{ int mid=getResources().getIdentifier("music","raw",getPackageName()); if(mid!=0){ bgMusic=MediaPlayer.create(this,mid); bgMusic.setLooping(true); if(!isMuted) bgMusic.start(); } }catch(Exception e){} setContentView(new GameView(this)); }
            protected void onPause(){ super.onPause(); try{ if(bgMusic!=null) bgMusic.pause(); }catch(Exception e){} }
            protected void onResume(){ super.onResume(); if(!isMuted) try{ if(bgMusic!=null) bgMusic.start(); }catch(Exception e){} }
            class Particle{ float x,y,vx,vy,r,alpha; int color; }
            class GameView extends View{
              int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS];
              float cellW, cellH, gridX, gridY;
              RectF btnLevel, btnScore, btnMoves, btnMute;
              int level=1, score=0, moves=0;
              float downX, downY; int downR, downC;
              Bitmap[] jajanBmp=new Bitmap[6]; Bitmap bg;
              ArrayList<Particle> parts=new ArrayList<>();
              int complexity=0; boolean jackpotReady=false; int jackpotR=-1, jackpotC=-1; int jackpotAnim=0; boolean showJackpotPopup=false; int jackpotPopupAnim=0;
              int getTarget(){ if(level==1) return 1000; if(level==2) return 2500; return 4000; }
              int getMovesForLevel(int lvl){ if(lvl==1) return 20; if(lvl==2) return 25; return 30; }
              void saveProgress(){ try{ SharedPreferences.Editor ed=prefs.edit(); ed.putInt("level",level); ed.apply(); }catch(Exception e){} }
              void loadProgress(){ try{ level=prefs.getInt("level",1); }catch(Exception e){} }
              Bitmap safe(int id){ try{ return BitmapFactory.decodeResource(getResources(),id); }catch(Exception e){ return null; } }
              public GameView(Context c){ super(c); loadProgress(); moves=getMovesForLevel(level); try{ int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(bgId!=0) bg=safe(bgId); for(int i=0;i<6;i++){ int id=getResources().getIdentifier("jajan0"+(i+1),"drawable",getPackageName()); if(id!=0) jajanBmp[i]=safe(id); } }catch(Exception e){} }
              void toggleMute(){ try{ isMuted=!isMuted; prefs.edit().putBoolean("mute",isMuted).apply(); if(isMuted){ if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.pause(); } else { if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.start(); } }catch(Exception e){} }
              void spawnParticles(float cx,float cy){ for(int i=0;i<15;i++){ Particle p=new Particle(); p.x=cx; p.y=cy; p.vx=(float)(Math.random()*10-5); p.vy=(float)(Math.random()*-10-2); p.r=(float)(Math.random()*8+4); p.alpha=255; p.color=Color.YELLOW; parts.add(p); } }
              void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) grid[r][cc]=(int)(Math.random()*6); complexity=0; }
              boolean check(){
                boolean matched=false; boolean[][] del=new boolean[ROWS][COLS];
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ if(r<ROWS-2 && grid[r][cc]==grid[r+1][cc] && grid[r][cc]==grid[r+2][cc]){ del[r][cc]=del[r+1][cc]=del[r+2][cc]=true; matched=true; } if(cc<COLS-2 && grid[r][cc]==grid[r][cc+1] && grid[r][cc]==grid[r][cc+2]){ del[r][cc]=del[r][cc+1]=del[r][cc+2]=true; matched=true; } }
                if(matched && jackpotReady){ if(del[jackpotR][jackpotC]){ score+=500; showJackpotPopup=true; jackpotPopupAnim=0; spawnParticles(gridX+jackpotC*cellW+cellW/2, gridY+jackpotR*cellH+cellH/2); jackpotReady=false; complexity=0; } }
                if(matched){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(del[r][cc]){ score+=100; grid[r][cc]=-1; } for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=(int)(Math.random()*6); } }
                if(matched) return true;
                complexity++; if(complexity>8 &&!jackpotReady){ if(Math.random()>0.4){ jackpotReady=true; jackpotR=(int)(Math.random()*ROWS); jackpotC=(int)(Math.random()*COLS); } }
                return false;
              }
              protected void onDraw(Canvas canvas){
                if(cellW==0){ int w=getWidth(), h=getHeight(); if(w==0||h==0) return; gridX=w*0.06f; gridY=h*0.30f; cellW=(w-gridX*2)/COLS; cellH=cellW; float bw=w*0.28f, bh=h*0.065f; float bwSmall=w*0.22f, bhSmall=h*0.055f; float muteSize=w*0.11f; btnLevel=new RectF(w*0.06f, h*0.04f, w*0.06f+bw, h*0.04f+bh); btnScore=new RectF(w*0.94f-bw, h*0.04f, w*0.94f, h*0.04f+bh); btnMoves=new RectF(w*0.06f, h*0.125f, w*0.06f+bwSmall, h*0.125f+bhSmall); btnMute=new RectF(w*0.94f-muteSize-w*0.06f, h*0.125f, w*0.94f-w*0.06f, h*0.125f+muteSize); initGrid(); }
                if(bg!=null) canvas.drawBitmap(bg,null,new Rect(0,0,getWidth(),getHeight()),null); else { canvas.drawColor(Color.parseColor("#FFF8E1")); }
                Paint btnBg=new Paint(Paint.ANTI_ALIAS_FLAG); btnBg.setColor(Color.parseColor("#FF9800")); Paint btnBd=new Paint(Paint.ANTI_ALIAS_FLAG); btnBd.setStyle(Paint.Style.STROKE); btnBd.setStrokeWidth(3); btnBd.setColor(Color.WHITE);
                Paint val=new Paint(Paint.ANTI_ALIAS_FLAG); val.setColor(Color.WHITE); val.setFakeBoldText(true); val.setTextAlign(Paint.Align.CENTER); Paint lab=new Paint(Paint.ANTI_ALIAS_FLAG); lab.setColor(Color.WHITE); lab.setTextAlign(Paint.Align.CENTER); lab.setFakeBoldText(true);
                RectF[] btns={btnLevel, btnMoves, btnScore}; String[] labs={"LEVEL","MOVES","SCORE"}; int[] vals={level,moves,score};
                for(int i=0;i<3;i++){ RectF b=btns[i]; if(b==null) continue; canvas.drawRoundRect(b,20,20,btnBg); canvas.drawRoundRect(b,20,20,btnBd); val.setTextSize(i==1?36:44); canvas.drawText(String.valueOf(vals[i]), b.centerX(), b.centerY()+12, val); lab.setTextSize(18); canvas.drawText(labs[i], b.centerX(), b.top-10, lab); }
                if(btnMute!=null){ Paint mBg=new Paint(Paint.ANTI_ALIAS_FLAG); mBg.setColor(isMuted?Color.GRAY:Color.parseColor("#4CAF50")); canvas.drawRoundRect(btnMute,18,18,mBg); lab.setTextSize(28); canvas.drawText(isMuted?"🔇":"🔊", btnMute.centerX(), btnMute.centerY()+10, lab); }
                Paint cellBg=new Paint(Paint.ANTI_ALIAS_FLAG); cellBg.setColor(Color.parseColor("#FFFFFFCC")); Paint cellBd=new Paint(Paint.ANTI_ALIAS_FLAG); cellBd.setStyle(Paint.Style.STROKE); cellBd.setColor(Color.WHITE);
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ float x=gridX+cc*cellW, y=gridY+r*cellH; RectF rf=new RectF(x+2,y+2,x+cellW-2,y+cellH-2); canvas.drawRoundRect(rf,16,16,cellBg); canvas.drawRoundRect(rf,16,16,cellBd); if(jackpotReady && r==jackpotR && cc==jackpotC){ Paint gold=new Paint(Paint.ANTI_ALIAS_FLAG); gold.setColor(Color.YELLOW); gold.setAlpha(120+ (jackpotAnim%80)); jackpotAnim+=4; canvas.drawCircle(x+cellW/2, y+cellH/2, cellW*0.55f, gold); Paint qp=new Paint(); qp.setColor(Color.BLACK); qp.setTextSize(36); qp.setTextAlign(Paint.Align.CENTER); qp.setFakeBoldText(true); canvas.drawText("?", x+cellW/2, y+cellH/2+12, qp); } if(grid[r][cc]>=0 && grid[r][cc]<6 && jajanBmp[grid[r][cc]]!=null){ canvas.drawBitmap(jajanBmp[grid[r][cc]], null, rf, null); } }
                Paint pPart=new Paint(Paint.ANTI_ALIAS_FLAG); for(int i=parts.size()-1;i>=0;i--){ Particle p=parts.get(i); p.x+=p.vx; p.y+=p.vy; p.vy+=0.5f; p.alpha-=8; if(p.alpha<=0) parts.remove(i); else { pPart.setColor(p.color); pPart.setAlpha((int)p.alpha); canvas.drawCircle(p.x,p.y,p.r,pPart); } }
                if(parts.size()>0 || jackpotReady) postInvalidateDelayed(50);
                if(moves<=0 && score < getTarget()){ Paint over=new Paint(); over.setColor(Color.parseColor("#CC000000")); canvas.drawRect(0,0,getWidth(),getHeight(),over); val.setTextSize(44); val.setColor(Color.WHITE); canvas.drawText("GAME OVER", getWidth()/2, getHeight()/2-20, val); lab.setTextSize(20); canvas.drawText("Tap untuk ulang", getWidth()/2, getHeight()/2+30, lab); }
                else if(score >= getTarget()){ Paint over=new Paint(); over.setColor(Color.parseColor("#CC4CAF50")); canvas.drawRect(0,0,getWidth(),getHeight(),over); val.setTextSize(42); val.setColor(Color.WHITE); canvas.drawText("LEVEL "+level+" CLEAR!", getWidth()/2, getHeight()/2-20, val); lab.setTextSize(18); canvas.drawText("Tap untuk lanjut", getWidth()/2, getHeight()/2+30, lab); }
                if(showJackpotPopup){ Paint jTx=new Paint(); jTx.setColor(Color.BLACK); jTx.setTextSize(60); jTx.setFakeBoldText(true); jTx.setTextAlign(Paint.Align.CENTER); float sc=1f+ (float)Math.sin(jackpotPopupAnim*0.2)*0.2f; canvas.save(); canvas.scale(sc,sc,getWidth()/2, getHeight()/2); canvas.drawText("JACKPOT +500!", getWidth()/2, getHeight()/2, jTx); canvas.restore(); jackpotPopupAnim++; if(jackpotPopupAnim>40) showJackpotPopup=false; postInvalidateDelayed(50); }
              }
              public boolean onTouchEvent(MotionEvent e){
                if(e.getAction()==MotionEvent.ACTION_DOWN){ float x=e.getX(), y=e.getY(); if(btnMute!=null && btnMute.contains(x,y)){ toggleMute(); invalidate(); return true; } if(score >= getTarget()){ level++; moves=getMovesForLevel(level); score=0; initGrid(); saveProgress(); invalidate(); return true; } if(moves<=0 && score < getTarget()){ moves=getMovesForLevel(level); score=0; initGrid(); invalidate(); return true; } downX=x; downY=y; downR=(int)((y-gridY)/cellH); downC=(int)((x-gridX)/cellW); }
                if(e.getAction()==MotionEvent.ACTION_UP){ float x=e.getX(), y=e.getY(); float dx=x-downX, dy=y-downY; int r=downR, c=downC; if(r<0||r>=ROWS||c<0||c>=COLS) return true; if(Math.abs(dx)>Math.abs(dy)){ int nc=c+ (dx>0?1:-1); if(nc<0||nc>=COLS) return true; int tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; } else { moves--; } } else { int nr=r+ (dy>0?1:-1); if(nr<0||nr>=ROWS) return true; int tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; } else { moves--; } } invalidate(); }
                return true;
              }
            }
          }
          JAVAEOF
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android { namespace 'com.rians.jajancrush'; compileSdk 34; defaultConfig { applicationId "com.rians.jajancrush"; minSdk 21; targetSdk 34; versionCode 5; versionName "5.0 Jackpot Rumit" } buildTypes { release { minifyEnabled false } } }
          dependencies {}
          GRADLE
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush V5" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANIFEST
          cat > settings.gradle << 'SET'
          include ':app'
          SET
          cat > build.gradle << 'B'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } } allprojects { repositories { google(); mavenCentral() } }
          B
      - name: Build APK - FIX NO GRADLEW
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jajan-crush-v5-jackpot-rumit
          path: app/build/outputs/apk/debug/app-debug.apk
