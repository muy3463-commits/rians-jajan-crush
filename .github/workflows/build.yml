name: Build Jajan Crush V6 Infinite

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK V6 Infinite No Geter
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          mkdir -p app/src/main/res/drawable

          cp bg_desa.png app/src/main/res/drawable/
          cp jajan01.png app/src/main/res/drawable/
          cp jajan02.png app/src/main/res/drawable/
          cp jajan03.png app/src/main/res/drawable/
          cp jajan04.png app/src/main/res/drawable/
          cp jajan05.png app/src/main/res/drawable/
          cp jajan06.png app/src/main/res/drawable/
          cp icon.png app/src/main/res/drawable/ic_launcher.png

          cat > settings.gradle << 'SET'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          SET

          cat > build.gradle << 'ROOT'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          ROOT

          cat > app/build.gradle << 'APP'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.rians.jajancrush'
            compileSdk 34
            defaultConfig { applicationId "com.rians.jajancrush"; minSdk 21; targetSdk 34; versionCode 6; versionName "V6-Infinite" }
          }
          APP

          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Rian's Jajan Crush" android:icon="@drawable/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          MAN

          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVA'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.widget.*; import android.view.*; import android.graphics.*; import java.util.*;
          public class MainActivity extends Activity {
            int level=1, score=0, target=500, moves=18, rows=6, cols=6; int[][] board; ImageView[][] grid; int[] jajans;
            TextView tvLevel, tvScore, tvTarget, tvMoves; LinearLayout boardLayout; Random rand=new Random();
            protected void onCreate(Bundle b){ super.onCreate(b);
              jajans=new int[]{R.drawable.jajan01,R.drawable.jajan02,R.drawable.jajan03,R.drawable.jajan04,R.drawable.jajan05,R.drawable.jajan06};
              LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setBackgroundResource(R.drawable.bg_desa); root.setGravity(Gravity.CENTER);
              tvLevel=new TextView(this); tvLevel.setText("Rian's Jajan Crush - Level "+level); tvLevel.setTextSize(22); tvLevel.setTextColor(Color.WHITE); tvLevel.setGravity(17); tvLevel.setTypeface(null,1); root.addView(tvLevel);
              LinearLayout info=new LinearLayout(this); info.setGravity(17);
              tvScore=infoText(" Score: 0 "); tvTarget=infoText(" Target: "+target+" "); tvMoves=infoText(" Moves: "+moves+" ");
              info.addView(tvScore); info.addView(tvTarget); info.addView(tvMoves); root.addView(info);
              boardLayout=new LinearLayout(this); boardLayout.setOrientation(1); boardLayout.setGravity(17); root.addView(boardLayout);
              setContentView(root); initBoard(); drawBoard();
            }
            TextView infoText(String s){ TextView tv=new TextView(this); tv.setText(s); tv.setTextColor(Color.WHITE); tv.setPadding(15,5,15,5); tv.setBackgroundColor(Color.argb(150,0,0,0)); return tv; }
            void initBoard(){ board=new int[rows][cols]; for(int r=0;r<rows;r++) for(int c=0;c<cols;c++) board[r][c]=rand.nextInt(6); }
            void drawBoard(){ boardLayout.removeAllViews(); grid=new ImageView[rows][cols];
              for(int r=0;r<rows;r++){ LinearLayout row=new LinearLayout(this); row.setGravity(17);
                for(int c=0;c<cols;c++){ final int rr=r,cc=c; ImageView iv=new ImageView(this); iv.setImageResource(jajans[board[r][c]]); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(110,110); lp.setMargins(4,4,4,4); iv.setLayoutParams(lp); iv.setOnClickListener(v->onClick(rr,cc)); row.addView(iv); grid[r][c]=iv; } boardLayout.addView(row); } updateUI(); }
            int selR=-1,selC=-1;
            void onClick(int r,int c){ if(selR==-1){ selR=r; selC=c; grid[r][c].setBackgroundColor(Color.YELLOW); } else {
                if(Math.abs(selR-r)+Math.abs(selC-c)==1){ int tmp=board[selR][selC]; board[selR][selC]=board[r][c]; board[r][c]=tmp; moves--; score+=50; checkWin(); }
                if(selR>=0) grid[selR][selC].setBackgroundColor(0); selR=-1; selC=-1; drawBoard(); } }
            void checkWin(){ if(score>=target){ level++; target=500+(level-1)*250; score=0; moves=18; Toast.makeText(this,"LEVEL "+level+"! Gak ada tamatnya lur! ♾️",1).show(); initBoard(); } if(moves<=0){ Toast.makeText(this,"Game Over! Ulang Level "+level,1).show(); score=0; moves=18; initBoard(); } }
            void updateUI(){ tvLevel.setText("Rian's Jajan Crush - Level "+level+" ♾️"); tvScore.setText(" Score: "+score+" "); tvTarget.setText(" Target: "+target+" "); tvMoves.setText(" Moves: "+moves+" "); }
          }
          JAVA

          cd /tmp && wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip && unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JajanCrush-V6-Infinite
          path: app/build/outputs/apk/debug/app-debug.apk
