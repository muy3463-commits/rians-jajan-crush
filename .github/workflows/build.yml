name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Project
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/java/com/rians/jajancrush
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan01.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan02.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan03.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan04.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan05.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan06.png app/src/main/res/drawable/ 2>/dev/null || true
          if [ -f music.mp3 ]; then cp music.mp3 app/src/main/res/raw/music.mp3; fi
          if [ -f icon.png ]; then cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png; fi
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.*;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.*;
          import java.util.ArrayList;
          public class MainActivity extends Activity{
            SharedPreferences prefs; MediaPlayer bgMusic; boolean isMuted=false;
            protected void onCreate(Bundle b){ super.onCreate(b); prefs=getSharedPreferences("jajan",0); isMuted=prefs.getBoolean("mute",false); try{ int mid=getResources().getIdentifier("music","raw",getPackageName()); if(mid!=0){ bgMusic=MediaPlayer.create(this,mid); bgMusic.setLooping(true); if(!isMuted) bgMusic.start(); } }catch(Exception e){} setContentView(new GameView(this)); }
            protected void onPause(){ super.onPause(); try{ if(bgMusic!=null) bgMusic.pause(); }catch(Exception e){} }
            protected void onResume(){ super.onResume(); if(!isMuted) try{ if(bgMusic!=null) bgMusic.start(); }catch(Exception e){} }
            class Particle{ float x,y,vx,vy,r,alpha; }
            class GameView extends View{
              int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS];
              float cellW, cellH, gridX, gridY;
              RectF boxLevel, boxScore, boxMoves, boxMute;
              int level=1, score=0, moves=28, target=500;
              float downX, downY; int downR, downC; int selR=-1, selC=-1;
              Bitmap[] jajanBmp=new Bitmap[6]; Bitmap bg;
              ArrayList<Particle> parts=new ArrayList<>();
              int levelUpTimer=0; boolean showLevelUp=false;
              int jackpotR=-1, jackpotC=-1; boolean jackpotReady=false; int jackpotAnim=0; int failCount=0; boolean showJackpot=false; int jackpotPopup=0;
              public GameView(Context c){
                super(c);
                try{
                  int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName());
                  if(bgId!=0) bg=BitmapFactory.decodeResource(getResources(),bgId);
                  for(int i=0;i<6;i++){
                    int id=getResources().getIdentifier("jajan0"+(i+1),"drawable",getPackageName());
                    if(id!=0) jajanBmp[i]=BitmapFactory.decodeResource(getResources(),id);
                  }
                }catch(Exception e){}
              }
              void saveGame(){
                try{
                  SharedPreferences.Editor ed=prefs.edit();
                  ed.putInt("level",level); ed.putInt("score",score); ed.putInt("moves",moves); ed.putInt("target",target); ed.putInt("fail",failCount);
                  StringBuilder sb=new StringBuilder();
                  for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) sb.append(grid[r][cc]).append(",");
                  ed.putString("grid",sb.toString());
                  ed.apply();
                }catch(Exception e){}
              }
              boolean loadGame(){
                try{
                  if(!prefs.contains("grid")) return false;
                  level=prefs.getInt("level",1); score=prefs.getInt("score",0); moves=prefs.getInt("moves",28); target=prefs.getInt("target",500); failCount=prefs.getInt("fail",0);
                  String s=prefs.getString("grid",""); if(s.length()<10) return false;
                  String[] ar=s.split(","); int idx=0;
                  for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ if(idx<ar.length) grid[r][cc]=Integer.parseInt(ar[idx]); idx++; }
                  if(level>1) return true;
                }catch(Exception e){}
                return false;
              }
              void toggleMute(){ isMuted=!isMuted; try{ prefs.edit().putBoolean("mute",isMuted).apply(); }catch(Exception e){} try{ if(isMuted){ if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.pause(); } else { if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.start(); } }catch(Exception e){} }
              void initGrid(){
                int types = Math.min(5 + level/2, 6);
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                  int v; do{ v=(int)(Math.random()*types); grid[r][cc]=v; } while( (r>=2 && grid[r][cc]==grid[r-1][cc] && grid[r][cc]==grid[r-2][cc]) || (cc>=2 && grid[r][cc]==grid[r][cc-1] && grid[r][cc]==grid[r][cc-2]) );
                }
                failCount=0; jackpotReady=false; selR=-1; selC=-1;
                target = 500 + (level-1)*150;
                moves = Math.max(28 - (level-1)*2, 12);
                saveGame();
              }
              void spawn(float x,float y){ for(int i=0;i<20;i++){ Particle p=new Particle(); p.x=x; p.y=y; p.vx=(float)(Math.random()*14-7); p.vy=(float)(Math.random()*-14-3); p.r=(float)(Math.random()*8+4); p.alpha=255; parts.add(p); } }
              boolean check(){
                boolean[][] del=new boolean[ROWS][COLS]; boolean found=false;
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                  if(r<ROWS-2 && grid[r][cc]==grid[r+1][cc] && grid[r][cc]==grid[r+2][cc]){ del[r][cc]=del[r+1][cc]=del[r+2][cc]=true; found=true; }
                  if(cc<COLS-2 && grid[r][cc]==grid[r][cc+1] && grid[r][cc]==grid[r][cc+2]){ del[r][cc]=del[r][cc+1]=del[r][cc+2]=true; found=true; }
                }
                if(found){
                  if(jackpotReady && del[jackpotR][jackpotC]){ score+=500; showJackpot=true; jackpotPopup=0; spawn(gridX+jackpotC*cellW+cellW/2, gridY+jackpotR*cellH+cellH/2); jackpotReady=false; failCount=0; }
                  for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(del[r][cc]){ spawn(gridX+cc*cellW+cellW/2, gridY+r*cellH+cellH/2); score+=20; grid[r][cc]=-1; }
                  for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=(int)(Math.random()*Math.min(5+level/2,6)); }
                  if(score>=target){ level++; showLevelUp=true; levelUpTimer=0; score=0; target=500+(level-1)*150; moves=Math.max(28-(level-1)*2,12); }
                  saveGame();
                  return true;
                }
                failCount++; if(failCount>10 &&!jackpotReady){ if(Math.random()>0.35){ jackpotReady=true; jackpotR=(int)(Math.random()*ROWS); jackpotC=(int)(Math.random()*COLS); } }
                saveGame();
                return false;
              }
              protected void onDraw(Canvas canvas){
                try{
                  int w=getWidth(), h=getHeight(); if(w==0||h==0) return;
                  if(cellW==0){
                    gridX=w*0.032f; gridY=h*0.392f; cellW=(w-gridX*2)/COLS; cellH=cellW*0.98f;
                    float bw=w*0.225f, bh=h*0.05f; float muteS=w*0.11f;
                    boxLevel=new RectF(w*0.032f, h*0.035f, w*0.032f+bw, h*0.035f+bh);
                    boxScore=new RectF(w*0.968f-bw, h*0.035f, w*0.968f, h*0.035f+bh);
                    boxMoves=new RectF(w*0.032f, h*0.108f, w*0.032f+bw, h*0.108f+bh);
                    boxMute=new RectF(w*0.968f-bw/2-muteS/2, h*0.108f, w*0.968f-bw/2+muteS/2, h*0.108f+muteS);
                    if(!loadGame()){ initGrid(); }
                  }
                  if(bg!=null) canvas.drawBitmap(bg,null,new Rect(0,0,w,h),null); else canvas.drawColor(Color.parseColor("#5D4037"));
                  Paint boxBg=new Paint(Paint.ANTI_ALIAS_FLAG); boxBg.setColor(Color.parseColor("#3E2723"));
                  Paint boxBd=new Paint(Paint.ANTI_ALIAS_FLAG); boxBd.setColor(Color.parseColor("#FFCA28")); boxBd.setStyle(Paint.Style.STROKE); boxBd.setStrokeWidth(2);
                  Paint lbl=new Paint(Paint.ANTI_ALIAS_FLAG); lbl.setColor(Color.parseColor("#FFCA28")); lbl.setTextAlign(Paint.Align.CENTER); lbl.setTextSize(w*0.025f); lbl.setFakeBoldText(true);
                  Paint val=new Paint(Paint.ANTI_ALIAS_FLAG); val.setColor(Color.WHITE); val.setTextAlign(Paint.Align.CENTER); val.setFakeBoldText(true);
                  if(boxLevel!=null){ canvas.drawRoundRect(boxLevel,8,8,boxBg); canvas.drawRoundRect(boxLevel,8,8,boxBd); canvas.drawText("LEVEL", boxLevel.centerX(), boxLevel.top+w*0.03f, lbl); val.setTextSize(w*0.045f); canvas.drawText(String.valueOf(level), boxLevel.centerX(), boxLevel.centerY()+w*0.03f, val); }
                  if(boxMoves!=null){ canvas.drawRoundRect(boxMoves,8,8,boxBg); canvas.drawRoundRect(boxMoves,8,8,boxBd); canvas.drawText("MOVES", boxMoves.centerX(), boxMoves.top+w*0.03f, lbl); val.setTextSize(w*0.045f); canvas.drawText(String.valueOf(moves), boxMoves.centerX(), boxMoves.centerY()+w*0.03f, val); }
                  if(boxScore!=null){ canvas.drawRoundRect(boxScore,8,8,boxBg); canvas.drawRoundRect(boxScore,8,8,boxBd); canvas.drawText("SCORE", boxScore.centerX(), boxScore.top+w*0.03f, lbl); val.setTextSize(w*0.032f); canvas.drawText(score+"/"+target, boxScore.centerX(), boxScore.centerY()+w*0.028f, val); }
                  if(boxMute!=null){
                    Paint mBg=new Paint(Paint.ANTI_ALIAS_FLAG); mBg.setColor(Color.parseColor("#3E2723"));
                    Paint mBd=new Paint(Paint.ANTI_ALIAS_FLAG); mBd.setColor(Color.parseColor("#FFCA28")); mBd.setStyle(Paint.Style.STROKE); mBd.setStrokeWidth(2);
                    canvas.drawCircle(boxMute.centerX(), boxMute.centerY(), boxMute.width()/2, mBg);
                    canvas.drawCircle(boxMute.centerX(), boxMute.centerY(), boxMute.width()/2, mBd);
                    Paint ic=new Paint(Paint.ANTI_ALIAS_FLAG); ic.setColor(Color.parseColor("#FFCA28")); ic.setTextAlign(Paint.Align.CENTER); ic.setTextSize(w*0.05f);
                    canvas.drawText(isMuted?"X":"♪", boxMute.centerX(), boxMute.centerY()+w*0.018f, ic);
                  }
                  Paint blackCell=new Paint(Paint.ANTI_ALIAS_FLAG); blackCell.setColor(Color.parseColor("#000000"));
                  Paint borderLine=new Paint(Paint.ANTI_ALIAS_FLAG); borderLine.setColor(Color.parseColor("#1A1A1A")); borderLine.setStyle(Paint.Style.STROKE); borderLine.setStrokeWidth(1.5f);
                  Paint selGold=new Paint(Paint.ANTI_ALIAS_FLAG); selGold.setColor(Color.parseColor("#FFEB3B")); selGold.setStyle(Paint.Style.STROKE); selGold.setStrokeWidth(5);
                  Paint jack=new Paint(Paint.ANTI_ALIAS_FLAG); jack.setColor(Color.YELLOW); jack.setStyle(Paint.Style.STROKE); jack.setStrokeWidth(6);
                  for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                    float x=gridX+cc*cellW, y=gridY+r*cellH;
                    RectF rf=new RectF(x+1,y+1,x+cellW-1,y+cellH-1);
                    canvas.drawRect(rf,blackCell);
                    canvas.drawRect(rf,borderLine);
                    if(r==selR && cc==selC) canvas.drawRect(new RectF(x,y,x+cellW,y+cellH),selGold);
                    if(jackpotReady && r==jackpotR && cc==jackpotC){ jack.setAlpha(100+(jackpotAnim%155)); jackpotAnim+=8; canvas.drawRect(new RectF(x-1,y-1,x+cellW+1,y+cellH+1),jack); }
                    if(grid[r][cc]>=0 && grid[r][cc]<6 && jajanBmp[grid[r][cc]]!=null){
                      canvas.drawBitmap(jajanBmp[grid[r][cc]], null, new RectF(x+2,y+2,x+cellW-2,y+cellH-2), null);
                    }
                  }
                  Paint pp=new Paint(Paint.ANTI_ALIAS_FLAG); pp.setColor(Color.YELLOW);
                  for(int i=parts.size()-1;i>=0;i--){ Particle p=parts.get(i); p.x+=p.vx; p.y+=p.vy; p.vy+=0.5f; p.alpha-=12; if(p.alpha<=0) parts.remove(i); else { pp.setAlpha((int)p.alpha); canvas.drawCircle(p.x,p.y,p.r,pp); } }
                  if(parts.size()>0 || jackpotReady) postInvalidateDelayed(16);
                  if(showLevelUp){
                    Paint lu=new Paint(Paint.ANTI_ALIAS_FLAG); lu.setColor(Color.YELLOW); lu.setTextSize(w*0.11f); lu.setFakeBoldText(true); lu.setTextAlign(Paint.Align.CENTER); lu.setShadowLayer(12,0,0,Color.BLACK);
                    float sc=1f+(float)Math.sin(levelUpTimer*0.22f)*0.18f; canvas.save(); canvas.scale(sc,sc,w/2,h/2); canvas.drawText("LEVEL "+level+"!", w/2, h/2, lu); canvas.restore();
                    levelUpTimer++; if(levelUpTimer>70){ showLevelUp=false; }
                    postInvalidateDelayed(30);
                  }
                  if(showJackpot){
                    Paint jTx=new Paint(Paint.ANTI_ALIAS_FLAG); jTx.setColor(Color.YELLOW); jTx.setTextSize(w*0.10f); jTx.setFakeBoldText(true); jTx.setTextAlign(Paint.Align.CENTER); jTx.setShadowLayer(12,0,0,Color.BLACK);
                    float sc=1f+(float)Math.sin(jackpotPopup*0.3f)*0.2f; canvas.save(); canvas.scale(sc,sc,w/2,h/2); canvas.drawText("JACKPOT +500!", w/2, h/2, jTx); canvas.restore(); jackpotPopup++; if(jackpotPopup>55) showJackpot=false; postInvalidateDelayed(30);
                  }
                }catch(Exception e){}
              }
              public boolean onTouchEvent(MotionEvent e){
                if(e.getAction()==MotionEvent.ACTION_DOWN){
                  float x=e.getX(), y=e.getY();
                  if(boxMute!=null && boxMute.contains(x,y)){ toggleMute(); invalidate(); return true; }
                  downX=x; downY=y; downR=(int)((y-gridY)/cellH); downC=(int)((x-gridX)/cellW);
                  if(downR>=0&&downR<ROWS&&downC>=0&&downC<COLS){ selR=downR; selC=downC; invalidate(); }
                }
                if(e.getAction()==MotionEvent.ACTION_UP){
                  float x=e.getX(), y=e.getY(); float dx=x-downX, dy=y-downY; int r=downR, c=downC;
                  if(r<0||r>=ROWS||c<0||c>=COLS){ selR=-1; selC=-1; invalidate(); return true; }
                  if(Math.abs(dx)<10 && Math.abs(dy)<10) return true;
                  if(Math.abs(dx)>Math.abs(dy)){
                    int nc=c+(dx>0?1:-1); if(nc>=0&&nc<COLS){ int tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; } else { moves--; saveGame(); } }
                  } else {
                    int nr=r+(dy>0?1:-1); if(nr>=0&&nr<ROWS){ int tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; } else { moves--; saveGame(); } }
                  }
                  selR=-1; selC=-1; invalidate();
                }
                return true;
              }
            }
          }
          JAVAEOF
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rians.jajancrush'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rians.jajancrush"
                  minSdk 21
                  targetSdk 34
                  versionCode 13
                  versionName "11.0 Level Rumit + Save + Black + Jackpot"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {}
          GRADLE
          cat > build.gradle << 'B'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          B
          cat > settings.gradle << 'SET'
          include ':app'
          SET
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush V5" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANIFEST
      - name: Build APK
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jajan-crush-v11-final-lengkap
          path: app/build/outputs/apk/debug/app-debug.apk
