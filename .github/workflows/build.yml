name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/java/com/rians/jajancrush
          if [ -f icon.png ]; then for D in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do cp icon.png app/src/main/res/$D/ic_launcher.png; cp icon.png app/src/main/res/$D/ic_launcher_round.png; done; fi
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
      - name: Create Files
        run: |
          printf 'include ":app"\n' > settings.gradle
          cat > build.gradle << 'ROOT'
          buildscript {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ROOT
          cat > app/build.gradle << 'APP'
          apply plugin: 'com.android.application'
          repositories { google(); mavenCentral() }
          android {
            namespace 'com.rians.jajancrush'
            compileSdk 34
            compileSdkVersion 34
            defaultConfig {
              applicationId 'com.rians.jajancrush'
              minSdk 21
              targetSdk 34
              versionCode 55
              versionName '55.0'
            }
          }
          APP
          cat > app/src/main/AndroidManifest.xml << 'MANI'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANI
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVA'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.content.Context; import android.graphics.*; import android.view.*; import java.util.*;
          public class MainActivity extends Activity {
          protected void onCreate(Bundle b){ super.onCreate(b); setContentView(new GameView(this)); }
          class GameView extends View {
          int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS]; int score=500, moves=30; Random rnd=new Random();
          float cellW, cellH, gridX, gridY; float downX, downY; Bitmap bgBitmap;
          public GameView(Context c){ super(c); try{ int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(bgId!=0) bgBitmap=BitmapFactory.decodeResource(getResources(), bgId); }catch(Exception e){} initGrid(); }
          void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int t; int tr=0; do{ t=rnd.nextInt(5); grid[r][cc]=t; tr++; }while(isMatch(r,cc)&&tr<20); } }
          boolean isMatch(int r,int c){ int t=grid[r][c]; if(c>=2&&grid[r][c-1]==t&&grid[r][c-2]==t) return true; if(r>=2&&grid[r-1][c]==t&&grid[r-2][c]==t) return true; return false; }
          void ensureBoard(){ if(cellW>0) return; int w=getWidth(); int h=getHeight(); if(w==0||h==0) return;
            gridX=w*0.071f; gridY=h*0.314f; float gridW=w*0.858f; float gridH=h*0.585f; cellW=gridW/COLS; cellH=gridH/ROWS;
          }
          void drawJajanHD(Canvas canvas, int type, float cx, float cy, float sz){
            Paint p=new Paint(Paint.ANTI_ALIAS_FLAG); float r=sz*0.46f;
            if(type==0){ p.setColor(Color.parseColor("#0E5A1E")); canvas.drawOval(new RectF(cx-r*1.06f, cy-r*0.18f, cx+r*1.06f, cy+r*1.16f), p); Paint body=new Paint(Paint.ANTI_ALIAS_FLAG); body.setColor(Color.parseColor("#2ECC71")); canvas.drawOval(new RectF(cx-r, cy-r*0.32f, cx+r, cy+r*0.88f), body); Paint kel=new Paint(Paint.ANTI_ALIAS_FLAG); kel.setColor(Color.WHITE); for(int i=0;i<42;i++){ float ang=i*19.3f; float rr=r*0.84f; float ax=(float)Math.cos(Math.toRadians(ang))*rr*0.62f; float ay=(float)Math.sin(Math.toRadians(ang))*rr*0.42f - r*0.20f; float ssz=sz*0.062f + (i%3)*sz*0.013f; canvas.drawCircle(cx+ax, cy+ay, ssz, kel); } }
            else if(type==1){ float s=sz*0.88f; float l=cx-s/2, t=cy-s/2; float d=s*0.13f; Paint sh=new Paint(Paint.ANTI_ALIAS_FLAG); sh.setColor(Color.parseColor("#3E2723")); canvas.drawRect(l+d, t+d, l+s+d, t+s+d, sh); Paint dark=new Paint(Paint.ANTI_ALIAS_FLAG); dark.setColor(Color.parseColor("#4E342E")); canvas.drawRect(l, t, l+s, t+s*0.20f, dark); Paint mid=new Paint(Paint.ANTI_ALIAS_FLAG); mid.setColor(Color.parseColor("#8D6E63")); canvas.drawRect(l, t+s*0.20f, l+s, t+s*0.40f, mid); Paint light=new Paint(Paint.ANTI_ALIAS_FLAG); light.setColor(Color.parseColor("#BCAAA4")); canvas.drawRect(l, t+s*0.40f, l+s, t+s*0.60f, light); canvas.drawRect(l, t+s*0.60f, l+s, t+s*0.80f, mid); canvas.drawRect(l, t+s*0.80f, l+s, t+s, dark); }
            else if(type==2){ p.setColor(Color.parseColor("#E65100")); canvas.drawOval(new RectF(cx-r*1.03f, cy-r*0.14f, cx+r*1.03f, cy+r*1.06f), p); Paint y=new Paint(Paint.ANTI_ALIAS_FLAG); y.setColor(Color.parseColor("#FBC02D")); canvas.drawOval(new RectF(cx-r*0.96f, cy-r*0.26f, cx+r*0.96f, cy+r*0.88f), y); Paint y2=new Paint(Paint.ANTI_ALIAS_FLAG); y2.setColor(Color.parseColor("#FFF9C4")); canvas.drawOval(new RectF(cx-r*0.58f, cy-r*0.44f, cx+r*0.58f, cy+r*0.28f), y2); Paint wij=new Paint(Paint.ANTI_ALIAS_FLAG); wij.setColor(Color.WHITE); for(int i=0;i<18;i++){ float a=i*21f; float rad=r*0.56f; float ax=(float)Math.cos(Math.toRadians(a))*rad*0.42f; float ay=(float)Math.sin(Math.toRadians(a))*rad*0.42f - r*0.16f; canvas.drawCircle(cx+ax, cy+ay, sz*0.036f, wij); } }
            else if(type==3){ Paint sh=new Paint(Paint.ANTI_ALIAS_FLAG); sh.setColor(Color.parseColor("#7F0000")); canvas.drawOval(new RectF(cx-r*0.92f, cy+r*0.16f, cx+r*0.92f, cy+r*1.09f), sh); Paint bowl=new Paint(Paint.ANTI_ALIAS_FLAG); bowl.setColor(Color.parseColor("#D32F2F")); canvas.drawOval(new RectF(cx-r*0.90f, cy-r*0.18f, cx+r*0.90f, cy+r*0.86f), bowl); Paint inner=new Paint(Paint.ANTI_ALIAS_FLAG); inner.setColor(Color.parseColor("#FF5252")); canvas.drawOval(new RectF(cx-r*0.78f, cy-r*0.10f, cx+r*0.78f, cy+r*0.48f), inner); Paint mie=new Paint(Paint.ANTI_ALIAS_FLAG); mie.setColor(Color.parseColor("#FFEB3B")); mie.setStrokeWidth(sz*0.052f); mie.setStyle(Paint.Style.STROKE); mie.setStrokeCap(Paint.Cap.ROUND); for(int i=0;i<4;i++){ float yy=cy-r*0.06f + i*sz*0.10f; Path path=new Path(); path.moveTo(cx-r*0.50f, yy); path.quadTo(cx, yy+sz*0.04f, cx+r*0.50f, yy); canvas.drawPath(path, mie); } Paint cabe=new Paint(Paint.ANTI_ALIAS_FLAG); cabe.setColor(Color.parseColor("#FF1744")); canvas.drawOval(new RectF(cx+sz*0.04f, cy-sz*0.16f, cx+sz*0.34f, cy+sz*0.04f), cabe); Paint daun=new Paint(Paint.ANTI_ALIAS_FLAG); daun.setColor(Color.parseColor("#388E3C")); canvas.drawOval(new RectF(cx-sz*0.26f, cy-sz*0.06f, cx-sz*0.02f, cy+sz*0.14f), daun); Paint telur=new Paint(Paint.ANTI_ALIAS_FLAG); telur.setColor(Color.WHITE); canvas.drawOval(new RectF(cx-r*0.06f, cy+sz*0.04f, cx+r*0.24f, cy+sz*0.20f), telur); }
            else { p.setColor(Color.parseColor("#0E5A1E")); canvas.drawOval(new RectF(cx-r*1.06f, cy-r*0.18f, cx+r*1.06f, cy+r*1.16f), p); Paint body=new Paint(Paint.ANTI_ALIAS_FLAG); body.setColor(Color.parseColor("#2ECC71")); canvas.drawOval(new RectF(cx-r, cy-r*0.32f, cx+r, cy+r*0.88f), body); Paint kel=new Paint(Paint.ANTI_ALIAS_FLAG); kel.setColor(Color.WHITE); for(int i=0;i<34;i++){ float ang=i*21f; float rr=r*0.76f; float ax=(float)Math.cos(Math.toRadians(ang))*rr*0.58f; float ay=(float)Math.sin(Math.toRadians(ang))*rr*0.38f - r*0.18f; canvas.drawCircle(cx+ax, cy+ay, sz*0.056f, kel); } }
          }
          protected void onDraw(Canvas canvas){
          ensureBoard();
          if(bgBitmap!=null){ canvas.drawBitmap(bgBitmap, null, new Rect(0,0,getWidth(), getHeight()), null); } else { canvas.drawColor(Color.parseColor("#8BC34A")); }
          if(cellW==0) return;
          // CUMA GAMBAR JAJANAN HD DI DALEM KOTAK YANG UDAH ADA DI FOTO - GAK GAMBAR PAPAN LAGI!
          for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){
            float l=gridX + c*cellW + 6, t=gridY + r*cellH + 6, rr=gridX + (c+1)*cellW -6, b=gridY + (r+1)*cellH -6;
            RectF tile=new RectF(l,t,rr,b);
            Paint cover=new Paint(); cover.setColor(Color.parseColor("#E7C08F")); canvas.drawRoundRect(tile,14,14,cover);
            if(grid[r][c]!=-1) drawJajanHD(canvas, grid[r][c], tile.centerX(), tile.centerY(), Math.min(cellW, cellH)*0.88f);
          }
          Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.WHITE); txt.setTextSize(24); txt.setFakeBoldText(true); txt.setTextAlign(Paint.Align.CENTER); txt.setShadowLayer(4,1,1,Color.BLACK);
          canvas.drawText(""+score, getWidth()*0.414f, getHeight()*0.244f, txt);
          canvas.drawText(""+moves, getWidth()*0.846f, getHeight()*0.244f, txt);
          if(moves<=0){ Paint over=new Paint(); over.setColor(Color.BLACK); over.setAlpha(190); canvas.drawRect(0,0,getWidth(),getHeight(),over); txt.setTextSize(44); txt.setColor(Color.YELLOW); canvas.drawText("GAME OVER", getWidth()/2f, getHeight()/2f, txt); }
          }
          public boolean onTouchEvent(MotionEvent e){ if(moves<=0 && e.getAction()==MotionEvent.ACTION_UP){ score=500; moves=30; initGrid(); invalidate(); return true; } if(e.getAction()==MotionEvent.ACTION_DOWN){ downX=e.getX(); downY=e.getY(); return true; } if(e.getAction()==MotionEvent.ACTION_UP){ float upX=e.getX(), upY=e.getY(); float dx=upX-downX, dy=upY-downY; int c=(int)((downX-gridX)/cellW); int r=(int)((downY-gridY)/cellH); if(r<0||r>=ROWS||c<0||c>=COLS) return true; int nr=r,nc=c; if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>cellW*0.20f) nc=c+(dx>0?1:-1); } else { if(Math.abs(dy)>cellH*0.20f) nr=r+(dy>0?1:-1); } if(nr<0||nr>=ROWS||nc<0||nc>=COLS||(nr==r&&nc==c)) return true; int tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; } else { moves--; } invalidate(); return true; } return true; }
          boolean check(){ boolean[][] mark=new boolean[ROWS][COLS]; boolean found=false; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS-2;cc++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r][cc+1]==t&&grid[r][cc+2]==t){ int k=cc; while(k<COLS&&grid[r][k]==t){ mark[r][k]=true; k++; found=true; } } } for(int cc=0;cc<COLS;cc++) for(int r=0;r<ROWS-2;r++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r+1][cc]==t&&grid[r+2][cc]==t){ int k=r; while(k<ROWS&&grid[k][cc]==t){ mark[k][cc]=true; k++; found=true; } } } if(!found) return false; int cnt=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(mark[r][cc]){ grid[r][cc]=-1; cnt++; } score+=cnt*40; drop(); postDelayed(new Runnable(){ public void run(){ if(check()) invalidate(); }}, 240); return true; }
          void drop(){ for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=rnd.nextInt(5); } }
          }
          }
          JAVA
      - name: Build APK
        run: ./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Jajan-Crush-GAK-TEMPEL-PAPAN
          path: app/build/outputs/apk/debug/*.apk
