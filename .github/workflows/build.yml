name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
      - name: Icon Custom
        run: |
          ICON_FILE=""; if [ -f "icon.png" ]; then ICON_FILE="icon.png"; fi; if [ -n "$ICON_FILE" ]; then for D in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do mkdir -p app/src/main/res/$D; cp $ICON_FILE app/src/main/res/$D/ic_launcher.png; cp $ICON_FILE app/src/main/res/$D/ic_launcher_round.png; done; fi
      - name: Make Game SEBLAK
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories { google(); mavenCentral() } }\ninclude ':app'\n" > settings.gradle
          echo " " > build.gradle
          printf "plugins { id 'com.android.application' version '8.1.0' }\nandroid { namespace 'com.rians.jajancrush'\n compileSdk 34\n defaultConfig { applicationId 'com.rians.jajancrush'\n minSdk 21\n targetSdk 34\n versionCode 8\n versionName '8.0-seblak' } }\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.content.Context; import android.graphics.*; import android.view.*; import java.util.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){ super.onCreate(b); setContentView(new GameView(this)); }
              class GameView extends View {
                  int ROWS=8, COLS=8; int[][] grid=new int[ROWS][COLS]; int score=0; Random rnd=new Random();
                  int cell, offX, offY; float downX, downY;
                  Paint scorePaint; Bitmap[] jajanBmp=new Bitmap[6];
                  public GameView(Context c){ super(c);
                      scorePaint=new Paint(); scorePaint.setColor(Color.WHITE); scorePaint.setAntiAlias(true); scorePaint.setFakeBoldText(true); scorePaint.setShadowLayer(3,2,2,Color.BLACK); initGrid();
                  }
                  void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int t; int tries=0; do{ t=rnd.nextInt(6); grid[r][cc]=t; tries++; }while(isMatchAt(r,cc) && tries<20); } score=0; }
                  boolean isMatchAt(int r,int c){ int t=grid[r][c]; if(c>=2&&grid[r][c-1]==t&&grid[r][c-2]==t) return true; if(r>=2&&grid[r-1][c]==t&&grid[r-2][c]==t) return true; return false; }
                  void createBmps(int size){
                      if(jajanBmp[0]!=null) return; int s=size-8;
                      for(int i=0;i<6;i++){ jajanBmp[i]=Bitmap.createBitmap(s,s,Bitmap.Config.ARGB_8888); Canvas cv=new Canvas(jajanBmp[i]); Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                          // 0=KLEPON 1=ONDE 2=DADAR 3=LAPIS 4=SEBLAK 5=LUPIS
                          if(i==0){ p.setColor(Color.parseColor("#2E7D32")); cv.drawCircle(s/2,s/2,s/2.2f,p); p.setColor(Color.WHITE); cv.drawCircle(s/2+4,s/2-4,s/6,p); }
                          else if(i==1){ p.setColor(Color.parseColor("#FBC02D")); cv.drawCircle(s/2,s/2,s/2.2f,p); p.setColor(Color.parseColor("#8D6E63")); for(int k=0;k<8;k++){ float ang=k*45; float rx=(float)(s/2+Math.cos(Math.toRadians(ang))*s/3); float ry=(float)(s/2+Math.sin(Math.toRadians(ang))*s/3); cv.drawCircle(rx,ry,s/18,p); } }
                          else if(i==2){ p.setColor(Color.parseColor("#795548")); cv.drawRoundRect(new RectF(4, s*0.3f, s-4, s*0.7f), s*0.2f, s*0.2f, p); p.setColor(Color.parseColor("#A1887F")); cv.drawRoundRect(new RectF(8, s*0.35f, s-8, s*0.65f), s*0.15f, s*0.15f, p); }
                          else if(i==3){ for(int ly=0;ly<4;ly++){ p.setColor(ly%2==0?Color.parseColor("#F48FB1"):Color.parseColor("#F8BBD0")); cv.drawRect(4, 4+ly*s/4, s-4, 4+(ly+1)*s/4, p); } }
                          else if(i==4){ // SEBLAK ORANGE PEDES
                              p.setColor(Color.parseColor("#FF6F00")); cv.drawRoundRect(new RectF(2,2,s-2,s-2), 16,16, p);
                              p.setColor(Color.parseColor("#FFCC80")); cv.drawCircle(s*0.3f,s*0.4f,s*0.15f,p); cv.drawCircle(s*0.7f,s*0.6f,s*0.18f,p); cv.drawCircle(s*0.5f,s*0.75f,s*0.12f,p);
                              p.setColor(Color.RED); p.setTextSize(s*0.35f); p.setFakeBoldText(true); p.setTextAlign(Paint.Align.CENTER); cv.drawText("🌶", s/2, s*0.65f, p);
                          }
                          else { p.setColor(Color.WHITE); Path path=new Path(); path.moveTo(s/2,4); path.lineTo(4,s-4); path.lineTo(s-4,s-4); path.close(); cv.drawPath(path,p); p.setColor(Color.parseColor("#388E3C")); p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(4); cv.drawPath(path,p); }
                      }
                  }
                  protected void onSizeChanged(int w,int h,int ow,int oh){ cell=Math.min(w/COLS,(h-220)/ROWS); offX=(w-cell*COLS)/2; offY=170; createBmps(cell); }
                  protected void onDraw(Canvas canvas){ canvas.drawColor(Color.parseColor("#4E342E"));
                      scorePaint.setTextSize(52); canvas.drawText("JAJAN CRUSH - SEBLAK!", getWidth()/2,64,scorePaint); scorePaint.setTextSize(36); canvas.drawText("Skor: "+score+" | GESER BUAT PECAH!", getWidth()/2,116,scorePaint);
                      for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int x=offX+cc*cell; int y=offY+r*cell; Paint b=new Paint(); b.setColor(Color.parseColor("#3E2723")); b.setAlpha(180); canvas.drawRoundRect(new RectF(x+2,y+2,x+cell-2,y+cell-2),12,12,b); if(grid[r][cc]!=-1 && jajanBmp[grid[r][cc]]!=null) canvas.drawBitmap(jajanBmp[grid[r][cc]], x+4, y+4, null); } }
                  public boolean onTouchEvent(MotionEvent e){
                      if(e.getAction()==MotionEvent.ACTION_DOWN){ downX=e.getX(); downY=e.getY(); return true; }
                      if(e.getAction()==MotionEvent.ACTION_UP){
                          float upX=e.getX(); float upY=e.getY(); float dx=upX-downX; float dy=upY-downY;
                          int c=(int)((downX-offX)/cell); int r=(int)((downY-offY)/cell);
                          if(r<0||r>=ROWS||c<0||c>=COLS) return true; int nr=r, nc=c;
                          if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>cell*0.3f){ nc=c+(dx>0?1:-1); } } else { if(Math.abs(dy)>cell*0.3f){ nr=r+(dy>0?1:-1); } }
                          if(nr<0||nr>=ROWS||nc<0||nc>=COLS|| (nr==r&&nc==c)) return true;
                          int tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp;
                          if(!checkAndRemove()){ tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; }
                          invalidate(); return true;
                      } return true;
                  }
                  boolean checkAndRemove(){ boolean[][] mark=new boolean[ROWS][COLS]; boolean found=false;
                      for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS-2;cc++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r][cc+1]==t&&grid[r][cc+2]==t){ int k=cc; while(k<COLS&&grid[r][k]==t){ mark[r][k]=true; k++; found=true; } } }
                      for(int cc=0;cc<COLS;cc++) for(int r=0;r<ROWS-2;r++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r+1][cc]==t&&grid[r+2][cc]==t){ int k=r; while(k<ROWS&&grid[k][cc]==t){ mark[k][cc]=true; k++; found=true; } } }
                      if(!found) return false; int cnt=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(mark[r][cc]){ grid[r][cc]=-1; cnt++; } score+=cnt*20; drop(); postDelayed(new Runnable(){ public void run(){ if(checkAndRemove()) invalidate(); }},200); return true; }
                  void drop(){ for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=rnd.nextInt(6); } }
              }
          }
          JAVAEOF
      - name: Build
        run: |
         ./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Jajan-Crush-SEBLAK
          path: app/build/outputs/apk/debug/*.apk
