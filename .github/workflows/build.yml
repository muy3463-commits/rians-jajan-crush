name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/java/com/rians/jajancrush
          if [ -f icon.png ]; then for D in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do cp icon.png app/src/main/res/$D/ic_launcher.png; cp icon.png app/src/main/res/$D/ic_launcher_round.png; done; fi
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
      - name: Create Files
        run: |
          printf 'include ":app"\n' > settings.gradle
          cat > build.gradle << 'ROOT'
          buildscript {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ROOT
          cat > app/build.gradle << 'APP'
          apply plugin: 'com.android.application'
          repositories { google(); mavenCentral() }
          android {
            namespace 'com.rians.jajancrush'
            compileSdk 34
            compileSdkVersion 34
            defaultConfig {
              applicationId 'com.rians.jajancrush'
              minSdk 21
              targetSdk 34
              versionCode 56
              versionName '56.0'
            }
          }
          APP
          cat > app/src/main/AndroidManifest.xml << 'MANI'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANI
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVA'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.content.Context; import android.graphics.*; import android.view.*; import java.util.*;
          public class MainActivity extends Activity {
          protected void onCreate(Bundle b){ super.onCreate(b); setContentView(new GameView(this)); }
          class GameView extends View {
          int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS]; int score=500, moves=30; Random rnd=new Random();
          float cellW, cellH, gridX, gridY; float downX, downY; Bitmap bgBitmap;
          public GameView(Context c){ super(c); try{ int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(bgId!=0) bgBitmap=BitmapFactory.decodeResource(getResources(), bgId); }catch(Exception e){} initGrid(); }
          void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int t; int tr=0; do{ t=rnd.nextInt(5); grid[r][cc]=t; tr++; }while(isMatch(r,cc)&&tr<20); } }
          boolean isMatch(int r,int c){ int t=grid[r][c]; if(c>=2&&grid[r][c-1]==t&&grid[r][c-2]==t) return true; if(r>=2&&grid[r-1][c]==t&&grid[r-2][c]==t) return true; return false; }
          void ensureBoard(){ if(cellW>0) return; int w=getWidth(); int h=getHeight(); if(w==0||h==0) return;
            // PAS 100% SAMA FOTO - UKUR DARI FOTO LU
            gridX=w*0.055f; gridY=h*0.342f; float gridW=w*0.890f; float gridH=h*0.572f; cellW=gridW/COLS; cellH=gridH/ROWS;
          }
          void drawJajanRapih(Canvas canvas, int type, float cx, float cy, float sz){
            Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
            if(type==0){ // KLEPON IJO PUTIH RAPIH
              float r=sz*0.42f; p.setColor(Color.parseColor("#0A7A2A")); canvas.drawCircle(cx, cy+sz*0.08f, r*1.05f, p);
              Paint body=new Paint(Paint.ANTI_ALIAS_FLAG); body.setColor(Color.parseColor("#22C55E")); canvas.drawCircle(cx, cy, r, body);
              Paint kel=new Paint(Paint.ANTI_ALIAS_FLAG); kel.setColor(Color.WHITE); kel.setStyle(Paint.Style.FILL);
              float rr=r*0.48f; for(int i=0;i<24;i++){ float a=i*27f; float ax=(float)Math.cos(Math.toRadians(a))*rr*0.62f; float ay=(float)Math.sin(Math.toRadians(a))*rr*0.42f - r*0.12f; canvas.drawCircle(cx+ax, cy+ay, sz*0.06f, kel); }
            } else if(type==1){ // LAPIS COKLAT RAPIH - GAK ADA BAYANGAN DOBEL
              float s=sz*0.74f; float l=cx-s/2, t=cy-s/2; Paint dark=new Paint(Paint.ANTI_ALIAS_FLAG); dark.setColor(Color.parseColor("#4E342E")); canvas.drawRect(l, t, l+s, t+s*0.22f, dark);
              Paint mid=new Paint(Paint.ANTI_ALIAS_FLAG); mid.setColor(Color.parseColor("#8D6E63")); canvas.drawRect(l, t+s*0.22f, l+s, t+s*0.44f, mid); Paint light=new Paint(Paint.ANTI_ALIAS_FLAG); light.setColor(Color.parseColor("#D7CCC8")); canvas.drawRect(l, t+s*0.44f, l+s, t+s*0.66f, light); canvas.drawRect(l, t+s*0.66f, l+s, t+s, mid);
            } else if(type==2){ // ONDE KUNING
              float r=sz*0.42f; p.setColor(Color.parseColor("#F59E0B")); canvas.drawCircle(cx, cy+sz*0.06f, r*1.02f, p); Paint y=new Paint(Paint.ANTI_ALIAS_FLAG); y.setColor(Color.parseColor("#FBBF24")); canvas.drawCircle(cx, cy, r, y); Paint wij=new Paint(Paint.ANTI_ALIAS_FLAG); wij.setColor(Color.WHITE); for(int i=0;i<12;i++){ float a=i*30f; float rad=r*0.32f; float ax=(float)Math.cos(Math.toRadians(a))*rad; float ay=(float)Math.sin(Math.toRadians(a))*rad - r*0.08f; canvas.drawCircle(cx+ax, cy+ay, sz*0.035f, wij); } }
            else if(type==3){ // MIE MERAH
              float r=sz*0.44f; Paint bowl=new Paint(Paint.ANTI_ALIAS_FLAG); bowl.setColor(Color.parseColor("#DC2626")); canvas.drawCircle(cx, cy+sz*0.06f, r*0.90f, bowl); Paint mie=new Paint(Paint.ANTI_ALIAS_FLAG); mie.setColor(Color.parseColor("#FDE047")); for(int i=0;i<3;i++){ float yy=cy-r*0.12f + i*sz*0.10f; canvas.drawOval(new RectF(cx-r*0.48f, yy, cx+r*0.48f, yy+sz*0.06f), mie); } Paint cabe=new Paint(Paint.ANTI_ALIAS_FLAG); cabe.setColor(Color.parseColor("#EF4444")); canvas.drawOval(new RectF(cx+sz*0.04f, cy-sz*0.10f, cx+sz*0.28f, cy+sz*0.04f), cabe); Paint daun=new Paint(Paint.ANTI_ALIAS_FLAG); daun.setColor(Color.parseColor("#22C55E")); canvas.drawCircle(cx-sz*0.16f, cy-sz*0.02f, sz*0.08f, daun); }
            else { // KLEPON VARIAN KUNING
              float r=sz*0.42f; p.setColor(Color.parseColor("#F59E0B")); canvas.drawCircle(cx, cy+sz*0.06f, r*1.02f, p); Paint y=new Paint(Paint.ANTI_ALIAS_FLAG); y.setColor(Color.parseColor("#FCD34D")); canvas.drawCircle(cx, cy, r, y); Paint ring=new Paint(Paint.ANTI_ALIAS_FLAG); ring.setColor(Color.WHITE); ring.setAlpha(200); ring.setStyle(Paint.Style.STROKE); ring.setStrokeWidth(sz*0.06f); canvas.drawCircle(cx, cy-r*0.10f, r*0.28f, ring); }
          }
          protected void onDraw(Canvas canvas){
          ensureBoard();
          if(bgBitmap!=null){ canvas.drawBitmap(bgBitmap, null, new Rect(0,0,getWidth(), getHeight()), null); } else { canvas.drawColor(Color.parseColor("#8BC34A")); }
          if(cellW==0) return;

          // TUTUP TOTAL KOTAK FOTO YANG LAMA - RAPIH PAS KOTAK
          for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){
            float l=gridX + c*cellW + 2, t=gridY + r*cellH + 2, rr=gridX + (c+1)*cellW -2, b=gridY + (r+1)*cellH -2;
            RectF tile=new RectF(l,t,rr,b);
            Paint bg=new Paint(); bg.setColor(Color.parseColor("#E8C49A")); bg.setStyle(Paint.Style.FILL); canvas.drawRoundRect(tile,14,14,bg);
            if(grid[r][c]!=-1) drawJajanRapih(canvas, grid[r][c], tile.centerX(), tile.centerY(), Math.min(cellW, cellH)*0.78f);
          }

          // TUTUP SCORE LAMA DI FOTO - GAMBAR PILL BARU DI ATASNYA
          Paint pillBg=new Paint(); pillBg.setColor(Color.parseColor("#3E2723"));
          Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.WHITE); txt.setTextSize(18); txt.setFakeBoldText(true); txt.setTextAlign(Paint.Align.CENTER);
          float pillY=getHeight()*0.282f; float pillH=getHeight()*0.042f;
          // Level
          RectF p1=new RectF(getWidth()*0.108f, pillY, getWidth()*0.368f, pillY+pillH); canvas.drawRoundRect(p1,20,20,pillBg); canvas.drawText("Level 1", p1.centerX(), p1.centerY()+6, txt);
          // Score
          RectF p2=new RectF(getWidth()*0.400f, pillY, getWidth()*0.660f, pillY+pillH); canvas.drawRoundRect(p2,20,20,pillBg); canvas.drawText("Score "+score, p2.centerX(), p2.centerY()+6, txt);
          // Moves
          RectF p3=new RectF(getWidth()*0.690f, pillY, getWidth()*0.892f, pillY+pillH); canvas.drawRoundRect(p3,20,20,pillBg); canvas.drawText("Moves "+moves, p3.centerX(), p3.centerY()+6, txt);

          if(moves<=0){ Paint over=new Paint(); over.setColor(Color.BLACK); over.setAlpha(180); canvas.drawRect(0,0,getWidth(),getHeight(),over); txt.setTextSize(42); txt.setColor(Color.YELLOW); canvas.drawText("GAME OVER", getWidth()/2f, getHeight()/2f, txt); }
          }
          public boolean onTouchEvent(MotionEvent e){ if(moves<=0 && e.getAction()==MotionEvent.ACTION_UP){ score=500; moves=30; initGrid(); invalidate(); return true; } if(e.getAction()==MotionEvent.ACTION_DOWN){ downX=e.getX(); downY=e.getY(); return true; } if(e.getAction()==MotionEvent.ACTION_UP){ float upX=e.getX(), upY=e.getY(); float dx=upX-downX, dy=upY-downY; int c=(int)((downX-gridX)/cellW); int r=(int)((downY-gridY)/cellH); if(r<0||r>=ROWS||c<0||c>=COLS) return true; int nr=r,nc=c; if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>cellW*0.25f) nc=c+(dx>0?1:-1); } else { if(Math.abs(dy)>cellH*0.25f) nr=r+(dy>0?1:-1); } if(nr<0||nr>=ROWS||nc<0||nc>=COLS||(nr==r&&nc==c)) return true; int tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; } else { moves--; } invalidate(); return true; } return true; }
          boolean check(){ boolean[][] mark=new boolean[ROWS][COLS]; boolean found=false; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS-2;cc++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r][cc+1]==t&&grid[r][cc+2]==t){ int k=cc; while(k<COLS&&grid[r][k]==t){ mark[r][k]=true; k++; found=true; } } } for(int cc=0;cc<COLS;cc++) for(int r=0;r<ROWS-2;r++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r+1][cc]==t&&grid[r+2][cc]==t){ int k=r; while(k<ROWS&&grid[k][cc]==t){ mark[k][cc]=true; k++; found=true; } } } if(!found) return false; int cnt=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(mark[r][cc]){ grid[r][cc]=-1; cnt++; } score+=cnt*40; drop(); postDelayed(new Runnable(){ public void run(){ if(check()) invalidate(); }}, 250); return true; }
          void drop(){ for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=rnd.nextInt(5); } }
          }
          }
          JAVA
      - name: Build APK
        run: ./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Jajan-Crush-56-RAPIH-BISA-DIMAININ
          path: app/build/outputs/apk/debug/*.apk
