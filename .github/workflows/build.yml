name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
      - name: Prepare All Assets
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          if [ -f "icon.png" ]; then for D in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do cp icon.png app/src/main/res/$D/ic_launcher.png; cp icon.png app/src/main/res/$D/ic_launcher_round.png; done; fi
          for F in bg_desa.png pria_kiri.png pria_kiri_pasmenang.png pria_kiri_paskalah.png wanita_kanan.png wanita_kanan_pasmenang.png wanita_kanan_paskalah.png; do if [ -f "$F" ]; then cp "$F" app/src/main/res/drawable/"$F"; echo "copied $F"; fi; done
          ls -lh app/src/main/res/drawable/
      - name: Make FINAL Game
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories { google(); mavenCentral() } }\ninclude ':app'\n" > settings.gradle
          echo " " > build.gradle
          printf "plugins { id 'com.android.application' version '8.1.0' }\nandroid { namespace 'com.rians.jajancrush'\n compileSdk 34\n defaultConfig { applicationId 'com.rians.jajancrush'\n minSdk 21\n targetSdk 34\n versionCode 12\n versionName '12.0-final-hidup' } }\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.content.Context; import android.graphics.*; import android.view.*; import java.util.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){ super.onCreate(b); setContentView(new GameView(this)); }
              class GameView extends View {
                  int ROWS=5, COLS=5; int[][] grid=new int[ROWS][COLS]; int score=700, moves=21, level=1; Random rnd=new Random();
                  int cell, boardX, boardY, boardSize; float downX, downY;
                  Paint paint, textPaint; Bitmap[] jajanBmp=new Bitmap[4];
                  Bitmap bgBitmap;
                  Bitmap priaNormal, priaMenang, priaKalah, wanitaNormal, wanitaMenang, wanitaKalah;
                  RectF[] tileRects=new RectF[25];
                  int emotion=0; long emotionTime=0;
                  public GameView(Context c){ super(c);
                      paint=new Paint(Paint.ANTI_ALIAS_FLAG); textPaint=new Paint(Paint.ANTI_ALIAS_FLAG); textPaint.setColor(Color.WHITE); textPaint.setFakeBoldText(true);
                      try{
                          int id=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(id!=0){ Bitmap tmp=BitmapFactory.decodeResource(getResources(), id); bgBitmap=Bitmap.createBitmap(tmp,0,0,tmp.getWidth(),(int)(tmp.getHeight()*0.6)); }
                          priaNormal=loadRemoveWhite("pria_kiri"); priaMenang=loadRemoveWhite("pria_kiri_pasmenang"); priaKalah=loadRemoveWhite("pria_kiri_paskalah");
                          wanitaNormal=loadRemoveWhite("wanita_kanan"); wanitaMenang=loadRemoveWhite("wanita_kanan_pasmenang"); wanitaKalah=loadRemoveWhite("wanita_kanan_paskalah");
                      }catch(Exception e){}
                      initGrid();
                  }
                  Bitmap loadRemoveWhite(String name){ try{ int id=getResources().getIdentifier(name,"drawable",getPackageName()); if(id==0) return null; Bitmap src=BitmapFactory.decodeResource(getResources(), id); Bitmap out=src.copy(Bitmap.Config.ARGB_8888,true); int w=out.getWidth(), h=out.getHeight(); for(int y=0;y<h;y++) for(int x=0;x<w;x++){ int col=out.getPixel(x,y); if(Color.red(col)>235 && Color.green(col)>235 && Color.blue(col)>235) out.setPixel(x,y,Color.TRANSPARENT);} return out; }catch(Exception e){ return null; } }
                  void setEmotion(int e){ emotion=e; emotionTime=System.currentTimeMillis(); }
                  void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int t; int tr=0; do{ t=rnd.nextInt(4); grid[r][cc]=t; tr++; }while(isMatchAt(r,cc)&&tr<20); } }
                  boolean isMatchAt(int r,int c){ int t=grid[r][c]; if(c>=2&&grid[r][c-1]==t&&grid[r][c-2]==t) return true; if(r>=2&&grid[r-1][c]==t&&grid[r-2][c]==t) return true; return false; }
                  void createBmps(int size){
                      if(jajanBmp[0]!=null) return; int s=size-10;
                      for(int i=0;i<4;i++){ jajanBmp[i]=Bitmap.createBitmap(s,s,Bitmap.Config.ARGB_8888); Canvas cv=new Canvas(jajanBmp[i]); Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                          if(i==0){ p.setColor(Color.parseColor("#4CAF50")); cv.drawCircle(s/2f,s/2f,s/2.2f,p); p.setColor(Color.WHITE); for(int k=0;k<10;k++){ float ang=k*36; float rx=(float)(s/2f+Math.cos(Math.toRadians(ang))*s/3.2f); float ry=(float)(s/2f+Math.sin(Math.toRadians(ang))*s/3.2f); cv.drawCircle(rx,ry,s/16f,p);} }
                          else if(i==1){ p.setColor(Color.parseColor("#5D4037")); cv.drawRoundRect(new RectF(4,4,s-4,s-4),8,8,p); for(int ly=0;ly<3;ly++){ p.setColor(ly%2==0?Color.parseColor("#8D6E63"):Color.parseColor("#D7CCC8")); cv.drawRect(6, 6+ly*s/3, s-6, 6+(ly+1)*s/3, p);} }
                          else if(i==2){ p.setColor(Color.parseColor("#FBC02D")); cv.drawCircle(s/2f,s/2f,s/2.2f,p); p.setColor(Color.parseColor("#795548")); for(int k=0;k<8;k++){ float ang=k*45; float rx=(float)(s/2f+Math.cos(Math.toRadians(ang))*s/3f); float ry=(float)(s/2f+Math.sin(Math.toRadians(ang))*s/3f); cv.drawCircle(rx,ry,s/22f,p);} }
                          else { p.setColor(Color.parseColor("#D32F2F")); cv.drawRoundRect(new RectF(2,2,s-2,s-2),16,16,p); p.setColor(Color.parseColor("#FFCCBC")); cv.drawCircle(s*0.33f,s*0.45f,s*0.15f,p); cv.drawCircle(s*0.68f,s*0.55f,s*0.17f,p); }
                      }
                  }
                  protected void onSizeChanged(int w,int h,int ow,int oh){
                      boardSize=(int)(Math.min(w*0.86, h*0.55)); cell=boardSize/COLS; boardX=(w-boardSize)/2; boardY=125; createBmps(cell);
                      for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){ int idx=r*COLS+c; tileRects[idx]=new RectF(boardX+c*cell+4, boardY+r*cell+4, boardX+(c+1)*cell-4, boardY+(r+1)*cell-4); }
                  }
                  protected void onDraw(Canvas canvas){
                      canvas.drawColor(Color.parseColor("#3E2723"));
                      if(bgBitmap!=null){ canvas.drawBitmap(bgBitmap, null, new Rect(0,0,getWidth(), getHeight()), null); Paint dim=new Paint(); dim.setColor(Color.BLACK); dim.setAlpha(55); canvas.drawRect(0,0,getWidth(),getHeight(),dim); }
                      // Top
                      Paint wood=new Paint(); wood.setColor(Color.parseColor("#4E342E")); wood.setAlpha(235); RectF topRect=new RectF(8,8,getWidth()-8, 108); canvas.drawRoundRect(topRect, 14,14, wood);
                      Paint border=new Paint(); border.setColor(Color.parseColor("#D7A76F")); border.setStyle(Paint.Style.STROKE); border.setStrokeWidth(3); canvas.drawRoundRect(topRect,14,14,border);
                      textPaint.setTextSize(20); textPaint.setColor(Color.parseColor("#FFD54F")); textPaint.setShadowLayer(3,2,2,Color.BLACK); textPaint.setTextAlign(Paint.Align.CENTER); canvas.drawText("Rian's Jajan Crush", getWidth()/2f, 34, textPaint);
                      textPaint.setTextSize(12); textPaint.setColor(Color.WHITE); textPaint.setShadowLayer(0,0,0,0);
                      int bw=(getWidth()-36)/3; Paint box=new Paint(); box.setColor(Color.parseColor("#3E2723")); Paint boxStroke=new Paint(); boxStroke.setColor(Color.parseColor("#D7A76F")); boxStroke.setStyle(Paint.Style.STROKE); boxStroke.setStrokeWidth(2);
                      for(int i=0;i<3;i++){ RectF r=new RectF(12+i*(bw+6), 46, 12+i*(bw+6)+bw, 94); canvas.drawRoundRect(r,8,8,box); canvas.drawRoundRect(r,8,8,boxStroke); String txt=i==0?"Level "+level : i==1?"Score "+score : "Moves "+moves; canvas.drawText(txt, r.centerX(), r.centerY()+4, textPaint); }
                      // Board
                      Paint boardBg=new Paint(); boardBg.setColor(Color.parseColor("#8D6E63")); boardBg.setAlpha(230); RectF boardFrame=new RectF(boardX-7, boardY-7, boardX+boardSize+7, boardY+boardSize+7); canvas.drawRoundRect(boardFrame, 14,14, boardBg); canvas.drawRoundRect(boardFrame,14,14,border);
                      for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){ int idx=r*COLS+c; Paint tileP=new Paint(); tileP.setColor(Color.parseColor("#FFF8E1")); canvas.drawRoundRect(tileRects[idx], 9,9, tileP); if(grid[r][c]!=-1 && jajanBmp[grid[r][c]]!=null) canvas.drawBitmap(jajanBmp[grid[r][c]], boardX+c*cell+5, boardY+r*cell+5, null); }
                      // Emotion logic
                      long now=System.currentTimeMillis(); float elapsed=(now-emotionTime)/1000f;
                      float scale=1f;
                      Bitmap curPria=priaNormal, curWanita=wanitaNormal;
                      if(emotion==1){ // MENANG - SENANG
                          curPria = priaMenang!=null? priaMenang : priaNormal;
                          curWanita = wanitaMenang!=null? wanitaMenang : wanitaNormal;
                          if(elapsed<1.3f){ scale=1f + (float)Math.sin(elapsed*10)*0.13f; postDelayed(new Runnable(){ public void run(){ invalidate(); }}, 16); } else { emotion=0; }
                      } else if(emotion==2){ // KALAH - SEDIH
                          curPria = priaKalah!=null? priaKalah : priaNormal;
                          curWanita = wanitaKalah!=null? wanitaKalah : wanitaNormal;
                          scale=0.95f;
                      }
                      int charW=(int)(getWidth()*0.26); int charH=(int)(charW*1.9);
                      if(curPria!=null){ int left=2; int top=boardY+boardSize+6; int right=left+(int)(charW*scale); int bottom=top+(int)(charH*scale); canvas.drawBitmap(curPria, null, new Rect(left, top, right, bottom), null); }
                      if(curWanita!=null){ int right=getWidth()-2; int left=right-(int)(charW*scale); int top=boardY+boardSize+6; int bottom=top+(int)(charH*scale); canvas.drawBitmap(curWanita, null, new Rect(left, top, right, bottom), null); }
                      textPaint.setTextSize(12); textPaint.setColor(Color.WHITE); canvas.drawText(emotion==1?"PECAAH! SENANGNYA!": emotion==2?"YAAH KALAH...":"GESER JAJAN BUAT PECAH 3!", getWidth()/2f, boardY+boardSize+24, textPaint);
                      if(moves<=0){ Paint over=new Paint(); over.setColor(Color.BLACK); over.setAlpha(170); canvas.drawRect(0,0,getWidth(),getHeight(),over); textPaint.setTextSize(36); textPaint.setColor(Color.YELLOW); canvas.drawText("GAME OVER", getWidth()/2f, getHeight()/2f-10, textPaint); textPaint.setTextSize(18); textPaint.setColor(Color.WHITE); canvas.drawText("Tap untuk main lagi", getWidth()/2f, getHeight()/2f+24, textPaint); }
                  }
                  public boolean onTouchEvent(MotionEvent e){
                      if(moves<=0 && e.getAction()==MotionEvent.ACTION_UP){ score=700; moves=21; initGrid(); emotion=0; invalidate(); return true; }
                      if(e.getAction()==MotionEvent.ACTION_DOWN){ downX=e.getX(); downY=e.getY(); return true; }
                      if(e.getAction()==MotionEvent.ACTION_UP){
                          float upX=e.getX(), upY=e.getY(); float dx=upX-downX, dy=upY-downY;
                          int c=(int)((downX-boardX)/cell); int r=(int)((downY-boardY)/cell);
                          if(r<0||r>=ROWS||c<0||c>=COLS) return true; int nr=r,nc=c;
                          if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>cell*0.25f) nc=c+(dx>0?1:-1); } else { if(Math.abs(dy)>cell*0.25f) nr=r+(dy>0?1:-1); }
                          if(nr<0||nr>=ROWS||nc<0||nc>=COLS||(nr==r&&nc==c)) return true;
                          int tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp;
                          if(!checkAndRemove()){ tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; } else { moves--; if(moves<=0){ setEmotion(2); } }
                          invalidate(); return true;
                      } return true;
                  }
                  boolean checkAndRemove(){ boolean[][] mark=new boolean[ROWS][COLS]; boolean found=false;
                      for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS-2;cc++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r][cc+1]==t&&grid[r][cc+2]==t){ int k=cc; while(k<COLS&&grid[r][k]==t){ mark[r][k]=true; k++; found=true; } } }
                      for(int cc=0;cc<COLS;cc++) for(int r=0;r<ROWS-2;r++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r+1][cc]==t&&grid[r+2][cc]==t){ int k=r; while(k<ROWS&&grid[k][cc]==t){ mark[k][cc]=true; k++; found=true; } } }
                      if(!found) return false; int cnt=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(mark[r][cc]){ grid[r][cc]=-1; cnt++; } score+=cnt*40; setEmotion(1); drop(); postDelayed(new Runnable(){ public void run(){ if(checkAndRemove()) invalidate(); }}, 220); return true; }
                  void drop(){ for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=rnd.nextInt(4); } }
              }
          }
          JAVAEOF
      - name: Build
        run:./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Jajan-Crush-FINAL-HIDUP
          path: app/build/outputs/apk/debug/*.apk
