name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/java/com/rians/jajancrush
          if [ -f icon.png ]; then for D in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do cp icon.png app/src/main/res/$D/ic_launcher.png; cp icon.png app/src/main/res/$D/ic_launcher_round.png; done; fi
          # FIX nama jajan01-06 jadi jajan0-5
          [ -f jajan01.png ] && cp jajan01.png app/src/main/res/drawable/jajan0.png
          [ -f jajan02.png ] && cp jajan02.png app/src/main/res/drawable/jajan1.png
          [ -f jajan03.png ] && cp jajan03.png app/src/main/res/drawable/jajan2.png
          [ -f jajan04.png ] && cp jajan04.png app/src/main/res/drawable/jajan3.png
          [ -f jajan05.png ] && cp jajan05.png app/src/main/res/drawable/jajan4.png
          [ -f jajan06.png ] && cp jajan06.png app/src/main/res/drawable/jajan5.png
          # Kalau udah bener nama jajan0-5 juga tetep support
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan0.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan1.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan2.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan3.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan4.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan5.png app/src/main/res/drawable/ 2>/dev/null || true
      - name: Create Files
        run: |
          printf 'include ":app"\n' > settings.gradle
          cat > build.gradle << 'ROOT'
          buildscript {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ROOT
          cat > app/build.gradle << 'APP'
          apply plugin: 'com.android.application'
          repositories { google(); mavenCentral() }
          android {
            namespace 'com.rians.jajancrush'
            compileSdk 34
            compileSdkVersion 34
            defaultConfig {
              applicationId 'com.rians.jajancrush'
              minSdk 21
              targetSdk 34
              versionCode 61
              versionName '61.0'
            }
          }
          APP
          cat > app/src/main/AndroidManifest.xml << 'MANI'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANI
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVA'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.content.Context; import android.graphics.*; import android.view.*; import java.util.*;
          public class MainActivity extends Activity {
          protected void onCreate(Bundle b){ super.onCreate(b); setContentView(new GameView(this)); }
          class GameView extends View {
          int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS]; int score=500, moves=30; Random rnd=new Random();
          float cellW, cellH, gridX, gridY; float downX, downY; Bitmap bgBitmap; Bitmap[] jajans=new Bitmap[6];
          public GameView(Context c){ super(c); try{
            int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(bgId!=0) bgBitmap=BitmapFactory.decodeResource(getResources(), bgId);
            for(int i=0;i<6;i++){ int id=getResources().getIdentifier("jajan"+i,"drawable",getPackageName()); if(id!=0) jajans[i]=BitmapFactory.decodeResource(getResources(), id); }
          }catch(Exception e){} initGrid(); }
          void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int t; int tr=0; do{ t=rnd.nextInt(6); grid[r][cc]=t; tr++; }while(isMatch(r,cc)&&tr<30); } }
          boolean isMatch(int r,int c){ int t=grid[r][c]; if(c>=2&&grid[r][c-1]==t&&grid[r][c-2]==t) return true; if(r>=2&&grid[r-1][c]==t&&grid[r-2][c]==t) return true; return false; }
          void ensureBoard(){ if(cellW>0) return; int w=getWidth(); int h=getHeight(); if(w==0||h==0) return;
            gridX=w*0.138f; gridY=h*0.328f; float gridW=w*0.724f; float gridH=h*0.508f; cellW=gridW/COLS; cellH=gridH/ROWS;
          }
          protected void onDraw(Canvas canvas){
          ensureBoard();
          if(bgBitmap!=null){ canvas.drawBitmap(bgBitmap, null, new Rect(0,0,getWidth(), getHeight()), null); } else { canvas.drawColor(Color.parseColor("#87CEEB")); }
          if(cellW==0) return;
          for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){
            float l=gridX + c*cellW + 2, t=gridY + r*cellH + 2, rr=gridX + (c+1)*cellW -2, b=gridY + (r+1)*cellH -2;
            RectF tile=new RectF(l,t,rr,b);
            int type=grid[r][c]; if(type>=0 && type<6 && jajans[type]!=null){ canvas.drawBitmap(jajans[type], null, tile, null); }
          }
          Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.parseColor("#5D4037")); txt.setTextSize(18); txt.setFakeBoldText(true); txt.setTextAlign(Paint.Align.CENTER);
          canvas.drawText("1", getWidth()*0.242f, getHeight()*0.288f, txt);
          canvas.drawText(""+score, getWidth()*0.495f, getHeight()*0.288f, txt);
          canvas.drawText(""+moves, getWidth()*0.738f, getHeight()*0.288f, txt);
          if(moves<=0){ Paint over=new Paint(); over.setColor(Color.BLACK); over.setAlpha(180); canvas.drawRect(0,0,getWidth(),getHeight(),over); txt.setTextSize(44); txt.setColor(Color.YELLOW); canvas.drawText("GAME OVER", getWidth()/2f, getHeight()/2f, txt); }
          }
          public boolean onTouchEvent(MotionEvent e){ if(moves<=0 && e.getAction()==MotionEvent.ACTION_UP){ score=500; moves=30; initGrid(); invalidate(); return true; } if(e.getAction()==MotionEvent.ACTION_DOWN){ downX=e.getX(); downY=e.getY(); return true; } if(e.getAction()==MotionEvent.ACTION_UP){ float upX=e.getX(), upY=e.getY(); float dx=upX-downX, dy=upY-downY; int c=(int)((downX-gridX)/cellW); int r=(int)((downY-gridY)/cellH); if(r<0||r>=ROWS||c<0||c>=COLS) return true; int nr=r,nc=c; if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>cellW*0.26f) nc=c+(dx>0?1:-1); } else { if(Math.abs(dy)>cellH*0.26f) nr=r+(dy>0?1:-1); } if(nr<0||nr>=ROWS||nc<0||nc>=COLS||(nr==r&&nc==c)) return true; int tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; } else { moves--; } invalidate(); return true; } return true; }
          boolean check(){ boolean[][] mark=new boolean[ROWS][COLS]; boolean found=false; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS-2;cc++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r][cc+1]==t&&grid[r][cc+2]==t){ int k=cc; while(k<COLS&&grid[r][k]==t){ mark[r][k]=true; k++; found=true; } } } for(int cc=0;cc<COLS;cc++) for(int r=0;r<ROWS-2;r++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r+1][cc]==t&&grid[r+2][cc]==t){ int k=r; while(k<ROWS&&grid[k][cc]==t){ mark[k][cc]=true; k++; found=true; } } } if(!found) return false; int cnt=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(mark[r][cc]){ grid[r][cc]=-1; cnt++; } score+=cnt*40; drop(); postDelayed(new Runnable(){ public void run(){ if(check()) invalidate(); }}, 250); return true; }
          void drop(){ for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=rnd.nextInt(6); } }
          }
          }
          JAVA
      - name: Build APK
        run:./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Jajan-Crush-61-6-JAJAN-FINAL
          path: app/build/outputs/apk/debug/*.apk
