name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Build Simple APK
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/rian/jajancrush
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          cp *.png app/src/main/res/drawable/ 2>/dev/null || true
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:8.2.2'}}allprojects{repositories{google();mavenCentral()}}" > build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.rian.jajancrush'
            compileSdk 34
            defaultConfig { applicationId "com.rian.jajancrush"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Rian Jajan Crush" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/rian/jajancrush/MainActivity.java << 'EOF'
          package com.rian.jajancrush;
          import android.os.Bundle;
          import android.widget.*;
          import android.view.Gravity;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            int score=0; int state=0;
            ImageView leftImg, rightImg, bg;
            TextView scoreTxt, leftTxt, rightTxt;
            @Override protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(0xFF8D6E63);
              LinearLayout top = new LinearLayout(this); top.setOrientation(LinearLayout.HORIZONTAL); top.setBackgroundColor(0xFF4E342E); top.setPadding(20,20,20,20);
              TextView title = new TextView(this); title.setText("Rian's Jajan Crush"); title.setTextColor(0xFFFFFFFF); title.setTextSize(18);
              scoreTxt = new TextView(this); scoreTxt.setText("Score: 0"); scoreTxt.setTextColor(0xFFFFFF00); scoreTxt.setTextSize(18);
              top.addView(title); top.addView(scoreTxt); ((LinearLayout.LayoutParams)scoreTxt.getLayoutParams()).leftMargin=40;
              LinearLayout mid = new LinearLayout(this); mid.setOrientation(LinearLayout.HORIZONTAL); mid.setGravity(Gravity.CENTER); mid.setPadding(10,20,10,20);
              LinearLayout col1 = new LinearLayout(this); col1.setOrientation(LinearLayout.VERTICAL); col1.setGravity(Gravity.CENTER);
              leftImg = new ImageView(this); leftImg.setImageResource(R.drawable.pria_kiri); leftImg.getLayoutParams(); leftImg.setAdjustViewBounds(true); leftImg.setMaxWidth(300);
              leftTxt = new TextView(this); leftTxt.setText("Rian"); leftTxt.setTextColor(-1); leftTxt.setGravity(Gravity.CENTER);
              col1.addView(leftImg); col1.addView(leftTxt);
              LinearLayout col2 = new LinearLayout(this); col2.setOrientation(LinearLayout.VERTICAL); col2.setGravity(Gravity.CENTER); col2.setBackgroundColor(0xE6FFFFFF); col2.setPadding(10,10,10,10);
              GridLayout grid = new GridLayout(this); grid.setColumnCount(4);
              for(int i=0;i<16;i++){ Button btn=new Button(this); btn.setText(new String[]{"🟢","🌶️","🍡","🟡"}[i%4]); btn.setOnClickListener(v->{ if(Math.random()>0.4){score+=10; state=1; leftImg.setImageResource(R.drawable.pria_kiri_pasmenang); rightImg.setImageResource(R.drawable.wanita_kanan_pasmenang); leftTxt.setText("Mantap!"); rightTxt.setText("Yay!");}else{score=Math.max(0,score-5); state=2; leftImg.setImageResource(R.drawable.pria_kiri_paskalah); rightImg.setImageResource(R.drawable.wanita_kanan_paskalah); leftTxt.setText("Aduh!"); rightTxt.setText("Hmm!");} scoreTxt.setText("Score: "+score); v.postDelayed(()->{leftImg.setImageResource(R.drawable.pria_kiri); rightImg.setImageResource(R.drawable.wanita_kanan); leftTxt.setText("Rian"); rightTxt.setText("Ayang");},1500);}); grid.addView(btn); }
              col2.addView(grid);
              LinearLayout col3 = new LinearLayout(this); col3.setOrientation(LinearLayout.VERTICAL); col3.setGravity(Gravity.CENTER);
              rightImg = new ImageView(this); rightImg.setImageResource(R.drawable.wanita_kanan); rightImg.setAdjustViewBounds(true); rightImg.setMaxWidth(300);
              rightTxt = new TextView(this); rightTxt.setText("Ayang"); rightTxt.setTextColor(-1); rightTxt.setGravity(Gravity.CENTER);
              col3.addView(rightImg); col3.addView(rightTxt);
              mid.addView(col1); mid.addView(col2); mid.addView(col3);
              root.addView(top); root.addView(mid);
              setContentView(root);
            }
          }
          EOF
          gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: APK-Rian-Jajan-Final
          path: app/build/outputs/apk/debug/*.apk
