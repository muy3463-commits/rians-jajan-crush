name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.5'
      - name: Build Project
        run: |
          mkdir -p app/src/main/java/com/rian/jajancrush app/src/main/res/drawable gradle/wrapper
          cp *.png app/src/main/res/drawable/ 2>/dev/null || true
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.rian.jajancrush'; compileSdk 34; defaultConfig { applicationId "com.rian.jajancrush"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; buildTypes { release { minifyEnabled false } }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' }; buildFeatures { compose true }; composeOptions { kotlinCompilerExtensionVersion '1.5.8' } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'; implementation 'androidx.activity:activity-compose:1.8.2'; implementation 'androidx.compose.ui:ui:1.5.8'; implementation 'androidx.compose.material3:material3:1.1.2'; implementation 'androidx.compose.foundation:foundation:1.5.8' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="Rian's Jajan Crush" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/rian/jajancrush/MainActivity.kt << 'EOF'
          package com.rian.jajancrush
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          class MainActivity : ComponentActivity() {
          override fun onCreate(savedInstanceState: Bundle?) {
          super.onCreate(savedInstanceState)
          setContent {
          var score by remember { mutableStateOf(0) }
          var leftState by remember { mutableStateOf("normal") }
          var rightState by remember { mutableStateOf("normal") }
          LaunchedEffect(leftState, rightState) { if (leftState!="normal"||rightState!="normal") { delay(1500); leftState="normal"; rightState="normal" } }
          Box(Modifier.fillMaxSize()) {
          Image(painter=painterResource(id=R.drawable.bg_desa), contentDescription=null, modifier=Modifier.fillMaxSize(), contentScale=ContentScale.Crop)
          Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha=0.3f)))
          Column(Modifier.fillMaxSize().padding(12.dp)) {
          Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(Color(0xFF4E342E)).padding(12.dp), horizontalArrangement=Arrangement.SpaceBetween) { Text("Rian's Jajan Crush", color=Color.White, fontWeight=FontWeight.Bold, fontSize=16.sp); Text("Score: $score", color=Color.Yellow, fontWeight=FontWeight.Bold) }
          Spacer(Modifier.height(10.dp))
          Row(Modifier.fillMaxSize(), verticalAlignment=Alignment.CenterVertically) {
          Column(Modifier.weight(1f), horizontalAlignment=Alignment.CenterHorizontally) { val imgId=when(leftState){"happy"->R.drawable.pria_kiri_pasmenang; "sad"->R.drawable.pria_kiri_paskalah; else->R.drawable.pria_kiri}; Image(painter=painterResource(id=imgId), contentDescription=null, modifier=Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp))); Spacer(Modifier.height(6.dp)); Text(when(leftState){"happy"->"Mantap!"; "sad"->"Aduh!"; else->"Rian"}, color=Color.White, fontWeight=FontWeight.Bold, fontSize=12.sp) }
          Column(Modifier.weight(1.3f).clip(RoundedCornerShape(16.dp)).background(Color.White.copy(alpha=0.92f)).padding(8.dp), horizontalAlignment=Alignment.CenterHorizontally) { repeat(5){ Row{ repeat(5){ var emoji by remember{mutableStateOf(listOf("🟢","🟡","🌶️","🍡").random())}; Box(Modifier.size(46.dp).padding(3.dp).clip(RoundedCornerShape(10.dp)).background(Color(0xFFFFF8E1)).clickable{if((0..1).random()==0){score+=10; leftState="happy"; rightState="happy"}else{score=(score-5).coerceAtLeast(0); leftState="sad"; rightState="sad"}; emoji=listOf("🟢","🟡","🌶️","🍡","🟤").random()}, contentAlignment=Alignment.Center){Text(emoji, fontSize=20.sp)}}}; Spacer(Modifier.height(6.dp)); Text("Tap Jajan!", color=Color(0xFF4E342E), fontSize=12.sp, fontWeight=FontWeight.Bold) }
          Column(Modifier.weight(1f), horizontalAlignment=Alignment.CenterHorizontally) { val imgId2=when(rightState){"happy"->R.drawable.wanita_kanan_pasmenang; "sad"->R.drawable.wanita_kanan_paskalah; else->R.drawable.wanita_kanan}; Image(painter=painterResource(id=imgId2), contentDescription=null, modifier=Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp))); Spacer(Modifier.height(6.dp)); Text(when(rightState){"happy"->"Yay!"; "sad"->"Hmm!"; else->"Ayang"}, color=Color.White, fontWeight=FontWeight.Bold, fontSize=12.sp) }
          } } } } }
          EOF
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Rian-Jajan
          path: app/build/outputs/apk/debug/*.apk
