name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: |
          mkdir -p app/src/main/java/com/rian/jajancrush app/src/main/res/drawable
          cp *.png app/src/main/res/drawable/ 2>/dev/null || true
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:8.2.2';classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'}}allprojects{repositories{google();mavenCentral()}}" > build.gradle
          echo "plugins{id 'com.android.application' id 'org.jetbrains.kotlin.android'} android{namespace 'com.rian.jajancrush';compileSdk 34;defaultConfig{applicationId 'com.rian.jajancrush';minSdk 24;targetSdk 34;versionCode 1;versionName '1.0'};buildTypes{release{minifyEnabled false}};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17};kotlinOptions{jvmTarget='17'};buildFeatures{compose true};composeOptions{kotlinCompilerExtensionVersion '1.5.8'}} dependencies{implementation 'androidx.core:core-ktx:1.12.0';implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0';implementation 'androidx.activity:activity-compose:1.8.2';implementation 'androidx.compose.ui:ui:1.5.8';implementation 'androidx.compose.material3:material3:1.1.2';implementation 'androidx.compose.foundation:foundation:1.5.8'}" > app/build.gradle
          echo "<?xml version='1.0' encoding='utf-8'?><manifest xmlns:android='http://schemas.android.com/apk/res/android'><application android:allowBackup='true' android:label='Jajan Crush' android:theme='@android:style/Theme.NoTitleBar'><activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN'/><category android:name='android.intent.category.LAUNCHER'/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          echo "package com.rian.jajancrush;import android.os.Bundle;import androidx.activity.ComponentActivity;import androidx.activity.compose.setContent;import androidx.compose.foundation.Image;import androidx.compose.foundation.background;import androidx.compose.foundation.clickable;import androidx.compose.foundation.layout.*;import androidx.compose.foundation.shape.RoundedCornerShape;import androidx.compose.material3.Text;import androidx.compose.runtime.*;import androidx.compose.ui.Alignment;import androidx.compose.ui.Modifier;import androidx.compose.ui.draw.clip;import androidx.compose.ui.graphics.Color;import androidx.compose.ui.layout.ContentScale;import androidx.compose.ui.res.painterResource;import androidx.compose.ui.text.font.FontWeight;import androidx.compose.ui.unit.dp;import androidx.compose.ui.unit.sp;import kotlinx.coroutines.delay;class MainActivity:ComponentActivity(){override fun onCreate(b:Bundle?){super.onCreate(b);setContent{var s by remember{mutableStateOf(0)};var l by remember{mutableStateOf(0)};var r by remember{mutableStateOf(0)};LaunchedEffect(l,r){if(l!=0||r!=0){delay(1500);l=0;r=0}};Box(Modifier.fillMaxSize()){Image(painterResource(R.drawable.bg_desa),null,Modifier.fillMaxSize(),contentScale=ContentScale.Crop);Box(Modifier.fillMaxSize().background(Color.Black.copy(0.3f)));Column(Modifier.fillMaxSize().padding(10.dp)){Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(10.dp)).background(Color(0xFF4E342E)).padding(10.dp),Arrangement.SpaceBetween){Text(\"Rian's Jajan Crush\",color=Color.White,fontWeight=FontWeight.Bold);Text(\"Score:$s\",color=Color.Yellow,fontWeight=FontWeight.Bold)};Row(Modifier.fillMaxSize(),verticalAlignment=Alignment.CenterVertically){Column(Modifier.weight(1f),horizontalAlignment=Alignment.CenterHorizontally){val id=when(l){1->R.drawable.pria_kiri_pasmenang;2->R.drawable.pria_kiri_paskalah;else->R.drawable.pria_kiri};Image(painterResource(id),null,Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)));Text(when(l){1->\"Mantap!\";2->\"Aduh!\";else->\"Rian\"},color=Color.White,fontWeight=FontWeight.Bold,fontSize=12.sp)};Column(Modifier.weight(1.3f).clip(RoundedCornerShape(12.dp)).background(Color.White.copy(0.9f)).padding(6.dp),horizontalAlignment=Alignment.CenterHorizontally){repeat(5){Row{repeat(5){var e by remember{mutableStateOf(\"🍡\")};Box(Modifier.size(44.dp).padding(2.dp).clip(RoundedCornerShape(8.dp)).background(Color(0xFFFFF8E1)).clickable{if((0..1).random()==0){s+=10;l=1;r=1}else{s=(s-5).coerceAtLeast(0);l=2;r=2}},contentAlignment=Alignment.Center){Text(e,fontSize=18.sp)}}}};Text(\"Tap Jajan!\",fontSize=11.sp,fontWeight=FontWeight.Bold)};Column(Modifier.weight(1f),horizontalAlignment=Alignment.CenterHorizontally){val id2=when(r){1->R.drawable.wanita_kanan_pasmenang;2->R.drawable.wanita_kanan_paskalah;else->R.drawable.wanita_kanan};Image(painterResource(id2),null,Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)));Text(when(r){1->\"Yay!\";2->\"Hmm!\";else->\"Ayang\"},color=Color.White,fontWeight=FontWeight.Bold,fontSize=12.sp)}}}}}}" > app/src/main/java/com/rian/jajancrush/MainActivity.kt
          gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Rian
          path: app/build/outputs/apk/debug/*.apk
