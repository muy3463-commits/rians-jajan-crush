name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Project
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/java/com/rians/jajancrush
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan01.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan02.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan03.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan04.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan05.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan06.png app/src/main/res/drawable/ 2>/dev/null || true
          if [ -f music.mp3 ]; then cp music.mp3 app/src/main/res/raw/music.mp3; fi
          if [ -f icon.png ]; then cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png; fi
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.*;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.*;
          import java.util.ArrayList;
          public class MainActivity extends Activity{
            SharedPreferences prefs; MediaPlayer bgMusic; boolean isMuted=false;
            protected void onCreate(Bundle b){ super.onCreate(b); prefs=getSharedPreferences("jajan",0); isMuted=prefs.getBoolean("mute",false); try{ int mid=getResources().getIdentifier("music","raw",getPackageName()); if(mid!=0){ bgMusic=MediaPlayer.create(this,mid); bgMusic.setLooping(true); if(!isMuted) bgMusic.start(); } }catch(Exception e){} setContentView(new GameView(this)); }
            protected void onPause(){ super.onPause(); try{ if(bgMusic!=null) bgMusic.pause(); }catch(Exception e){} }
            protected void onResume(){ super.onResume(); if(!isMuted) try{ if(bgMusic!=null) bgMusic.start(); }catch(Exception e){} }
            class Particle{ float x,y,vx,vy,r,alpha; }
            class GameView extends View{
              int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS];
              float cellW, cellH, gridX, gridY;
              RectF rLevel, rScore, rMoves, rMute;
              int level=1, score=0, moves=28;
              float downX, downY; int downR, downC; int selR=-1, selC=-1;
              Bitmap[] jajanBmp=new Bitmap[6]; Bitmap bg;
              ArrayList<Particle> parts=new ArrayList<>();
              int complexity=0; boolean jackpotReady=false; int jackpotR=-1, jackpotC=-1; int jackpotAnim=0; boolean showJackpotPopup=false; int jackpotPopupAnim=0;
              int getTarget(){ return 500; }
              void saveProgress(){ try{ prefs.edit().putInt("level",level).apply(); }catch(Exception e){} }
              void loadProgress(){ try{ level=prefs.getInt("level",1); }catch(Exception e){} }
              Bitmap safe(int id){ try{ return BitmapFactory.decodeResource(getResources(),id); }catch(Exception e){ return null; } }
              public GameView(Context c){ super(c); loadProgress(); try{ int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(bgId!=0) bg=safe(bgId); for(int i=0;i<6;i++){ int id=getResources().getIdentifier("jajan0"+(i+1),"drawable",getPackageName()); if(id!=0) jajanBmp[i]=safe(id); } }catch(Exception e){} }
              void toggleMute(){ try{ isMuted=!isMuted; prefs.edit().putBoolean("mute",isMuted).apply(); if(isMuted){ if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.pause(); } else { if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.start(); } }catch(Exception e){} }
              void spawnParticles(float cx,float cy){ for(int i=0;i<20;i++){ Particle p=new Particle(); p.x=cx; p.y=cy; p.vx=(float)(Math.random()*12-6); p.vy=(float)(Math.random()*-12-3); p.r=(float)(Math.random()*10+5); p.alpha=255; parts.add(p); } }
              void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int v; do{ v=(int)(Math.random()*6); grid[r][cc]=v; } while( (r>=2 && grid[r][cc]==grid[r-1][cc] && grid[r][cc]==grid[r-2][cc]) || (cc>=2 && grid[r][cc]==grid[r][cc-1] && grid[r][cc]==grid[r][cc-2]) ); } complexity=0; jackpotReady=false; selR=-1; selC=-1; }
              boolean check(){
                boolean matched=false; boolean[][] del=new boolean[ROWS][COLS];
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ if(r<ROWS-2 && grid[r][cc]==grid[r+1][cc] && grid[r][cc]==grid[r+2][cc]){ del[r][cc]=del[r+1][cc]=del[r+2][cc]=true; matched=true; } if(cc<COLS-2 && grid[r][cc]==grid[r][cc+1] && grid[r][cc]==grid[r][cc+2]){ del[r][cc]=del[r][cc+1]=del[r][cc+2]=true; matched=true; } }
                if(matched && jackpotReady && del[jackpotR][jackpotC]){ score+=500; showJackpotPopup=true; jackpotPopupAnim=0; spawnParticles(gridX+jackpotC*cellW+cellW/2, gridY+jackpotR*cellH+cellH/2); jackpotReady=false; complexity=0; }
                if(matched){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(del[r][cc]){ score+=20; grid[r][cc]=-1; } for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=(int)(Math.random()*6); } return true; }
                complexity++; if(complexity>12 &&!jackpotReady){ if(Math.random()>0.35){ jackpotReady=true; jackpotR=(int)(Math.random()*ROWS); jackpotC=(int)(Math.random()*COLS); } }
                return false;
              }
              protected void onDraw(Canvas canvas){
                if(cellW==0){ int w=getWidth(), h=getHeight(); if(w==0||h==0) return; gridX=w*0.045f; gridY=h*0.392f; cellW=(w-gridX*2)/COLS; cellH=cellW; float boxW=w*0.23f, boxH=h*0.062f; rLevel=new RectF(w*0.045f, h*0.088f, w*0.045f+boxW, h*0.088f+boxH); rScore=new RectF(w*0.725f, h*0.088f, w*0.725f+boxW, h*0.088f+boxH); rMoves=new RectF(w*0.045f, h*0.175f, w*0.045f+boxW, h*0.175f+boxH); rMute=new RectF(w*0.725f, h*0.175f, w*0.725f+boxW, h*0.175f+boxW); initGrid(); }
                if(bg!=null) canvas.drawBitmap(bg,null,new Rect(0,0,getWidth(),getHeight()),null); else canvas.drawColor(Color.parseColor("#5D4037"));
                Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.WHITE); txt.setTextAlign(Paint.Align.CENTER); txt.setFakeBoldText(true);
                Paint goldLab=new Paint(Paint.ANTI_ALIAS_FLAG); goldLab.setColor(Color.parseColor("#FFD54F")); goldLab.setTextAlign(Paint.Align.CENTER); goldLab.setFakeBoldText(true); goldLab.setTextSize(getWidth()*0.028f);
                txt.setTextSize(getWidth()*0.055f); if(rLevel!=null){ canvas.drawText("1", rLevel.centerX(), rLevel.centerY()+12, txt); canvas.drawText("LEVEL", rLevel.centerX(), rLevel.top-8, goldLab); }
                txt.setTextSize(getWidth()*0.045f); if(rScore!=null){ canvas.drawText(score+"/500", rScore.centerX(), rScore.centerY()+10, txt); canvas.drawText("SCORE", rScore.centerX(), rScore.top-8, goldLab); }
                txt.setTextSize(getWidth()*0.05f); if(rMoves!=null){ canvas.drawText(String.valueOf(moves), rMoves.centerX(), rMoves.centerY()+10, txt); canvas.drawText("MOVES", rMoves.centerX(), rMoves.top-8, goldLab); }
                Paint cellBg=new Paint(Paint.ANTI_ALIAS_FLAG); cellBg.setColor(Color.parseColor("#FFFEF8E8"));
                Paint cellBorder=new Paint(Paint.ANTI_ALIAS_FLAG); cellBorder.setColor(Color.parseColor("#FFE0C8A0")); cellBorder.setStyle(Paint.Style.STROKE); cellBorder.setStrokeWidth(2);
                Paint selPaint=new Paint(Paint.ANTI_ALIAS_FLAG); selPaint.setColor(Color.parseColor("#FFEB3B")); selPaint.setStyle(Paint.Style.STROKE); selPaint.setStrokeWidth(7);
                Paint jackpotPaint=new Paint(Paint.ANTI_ALIAS_FLAG); jackpotPaint.setColor(Color.parseColor("#FFFFEB3B")); jackpotPaint.setStyle(Paint.Style.STROKE); jackpotPaint.setStrokeWidth(6);
                for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){
                  float x=gridX+cc*cellW, y=gridY+r*cellH; RectF rf=new RectF(x+4,y+4,x+cellW-4,y+cellH-4);
                  canvas.drawRoundRect(rf,14,14,cellBg); canvas.drawRoundRect(rf,14,14,cellBorder);
                  if(r==selR && cc==selC) canvas.drawRoundRect(new RectF(x+1,y+1,x+cellW-1,y+cellH-1),16,16,selPaint);
                  if(jackpotReady && r==jackpotR && cc==jackpotC){ jackpotPaint.setAlpha(120+(jackpotAnim%130)); jackpotAnim+=6; canvas.drawRoundRect(new RectF(x,y,x+cellW,y+cellH),18,18,jackpotPaint); }
                  if(grid[r][cc]>=0 && grid[r][cc]<6 && jajanBmp[grid[r][cc]]!=null) canvas.drawBitmap(jajanBmp[grid[r][cc]], null, new RectF(x+8,y+8,x+cellW-8,y+cellH-8), null);
                }
                Paint pPart=new Paint(Paint.ANTI_ALIAS_FLAG); pPart.setColor(Color.YELLOW); for(int i=parts.size()-1;i>=0;i--){ Particle p=parts.get(i); p.x+=p.vx; p.y+=p.vy; p.vy+=0.6f; p.alpha-=10; if(p.alpha<=0) parts.remove(i); else { pPart.setAlpha((int)p.alpha); canvas.drawCircle(p.x,p.y,p.r,pPart); } }
                if(parts.size()>0 || jackpotReady) postInvalidateDelayed(40);
                if(moves<=0){ Paint over=new Paint(); over.setColor(Color.parseColor("#DD000000")); canvas.drawRect(0,0,getWidth(),getHeight(),over); txt.setTextSize(50); canvas.drawText("GAME OVER", getWidth()/2, getHeight()/2, txt); }
                else if(score>=500){ Paint over=new Paint(); over.setColor(Color.parseColor("#CC4CAF50")); canvas.drawRect(0,0,getWidth(),getHeight(),over); txt.setTextSize(48); canvas.drawText("MENANG!", getWidth()/2, getHeight()/2, txt); }
                if(showJackpotPopup){ Paint jTx=new Paint(Paint.ANTI_ALIAS_FLAG); jTx.setColor(Color.YELLOW); jTx.setTextSize(62); jTx.setFakeBoldText(true); jTx.setTextAlign(Paint.Align.CENTER); jTx.setShadowLayer(10,0,0,Color.BLACK); float sc=1f+ (float)Math.sin(jackpotPopupAnim*0.25)*0.2f; canvas.save(); canvas.scale(sc,sc,getWidth()/2, getHeight()/2); canvas.drawText("JACKPOT +500!", getWidth()/2, getHeight()/2, jTx); canvas.restore(); jackpotPopupAnim++; if(jackpotPopupAnim>50) showJackpotPopup=false; postInvalidateDelayed(40); }
              }
              public boolean onTouchEvent(MotionEvent e){
                if(e.getAction()==MotionEvent.ACTION_DOWN){
                  float x=e.getX(), y=e.getY(); if(rMute!=null && rMute.contains(x,y)){ toggleMute(); invalidate(); return true; }
                  if(score>=500 || moves<=0){ moves=28; score=0; initGrid(); invalidate(); return true; }
                  downX=x; downY=y; downR=(int)((y-gridY)/cellH); downC=(int)((x-gridX)/cellW);
                  if(downR>=0&&downR<ROWS&&downC>=0&&downC<COLS){ selR=downR; selC=downC; invalidate(); }
                }
                if(e.getAction()==MotionEvent.ACTION_UP){
                  float x=e.getX(), y=e.getY(); float dx=x-downX, dy=y-downY; int r=downR, c=downC; if(r<0||r>=ROWS||c<0||c>=COLS){ selR=-1; selC=-1; invalidate(); return true; }
                  if(Math.abs(dx)<15 && Math.abs(dy)<15) return true;
                  if(Math.abs(dx)>Math.abs(dy)){ int nc=c+ (dx>0?1:-1); if(nc>=0&&nc<COLS){ int tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[r][nc]; grid[r][nc]=tmp; } else { moves--; } } } else { int nr=r+ (dy>0?1:-1); if(nr>=0&&nr<ROWS){ int tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; if(!check()){ tmp=grid[r][c]; grid[r][c]=grid[nr][c]; grid[nr][c]=tmp; } else { moves--; } } }
                  selR=-1; selC=-1; invalidate();
                }
                return true;
              }
            }
          }
          JAVAEOF
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rians.jajancrush'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rians.jajancrush"
                  minSdk 21
                  targetSdk 34
                  versionCode 7
                  versionName "5.2 Final Cantik Jackpot"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {}
          GRADLE
          cat > build.gradle << 'B'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          B
          cat > settings.gradle << 'SET'
          include ':app'
          SET
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush V5" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANIFEST
      - name: Build APK
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jajan-crush-v52-final-cantik-jackpot
          path: app/build/outputs/apk/debug/app-debug.apk
