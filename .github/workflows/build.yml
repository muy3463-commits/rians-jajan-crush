name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Project
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/java/com/rians/jajancrush
          cp bg_desa.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan01.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan02.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan03.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan04.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan05.png app/src/main/res/drawable/ 2>/dev/null || true
          cp jajan06.png app/src/main/res/drawable/ 2>/dev/null || true
          if [ -f splash.png ]; then cp splash.png app/src/main/res/drawable/splash_bg.png; fi
          if [ -f music.mp3 ]; then cp music.mp3 app/src/main/res/raw/music.mp3; fi
          if [ -f icon.png ]; then cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png; cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png; cp icon.png app/src/main/res/drawable/ic_launcher.png; fi

          cat > app/src/main/java/com/rians/jajancrush/SplashActivity.java << 'SPLASH'
          package com.rians.jajancrush;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.*;
          import android.view.*;
          import android.graphics.*;
          public class SplashActivity extends Activity{
            void addEffect(View v){
              v.setOnTouchListener((view, ev)->{
                if(ev.getAction()==MotionEvent.ACTION_DOWN){
                  view.animate().scaleX(0.90f).scaleY(0.90f).setDuration(90).start();
                  view.setAlpha(0.7f);
                } else if(ev.getAction()==MotionEvent.ACTION_UP || ev.getAction()==MotionEvent.ACTION_CANCEL){
                  view.animate().scaleX(1f).scaleY(1f).setDuration(120).start();
                  view.setAlpha(1f);
                }
                return false;
              });
            }
            protected void onCreate(Bundle b){
              super.onCreate(b);
              FrameLayout root=new FrameLayout(this);
              ImageView bg=new ImageView(this);
              try{ int id=getResources().getIdentifier("splash_bg","drawable",getPackageName()); if(id!=0) bg.setImageResource(id);}catch(Exception e){}
              bg.setScaleType(ImageView.ScaleType.CENTER_CROP);
              root.addView(bg, new FrameLayout.LayoutParams(-1,-1));
              Typeface tf = Typeface.create("serif", Typeface.BOLD);
              Button play=new Button(this);
              play.setText("PLAY");
              play.setTypeface(tf);
              play.getPaint().setFakeBoldText(true);
              play.setTextColor(Color.parseColor("#FFEFAF"));
              play.setTextSize(26);
              play.setAllCaps(false);
              play.setShadowLayer(12, 4, 4, Color.parseColor("#3E2723"));
              play.setBackgroundColor(Color.TRANSPARENT);
              play.setGravity(Gravity.CENTER);
              addEffect(play);
              play.setOnClickListener(v->{ startActivity(new Intent(SplashActivity.this, MainActivity.class)); finish(); });
              Button exit=new Button(this);
              exit.setText("EXIT");
              exit.setTypeface(tf);
              exit.getPaint().setFakeBoldText(true);
              exit.setTextColor(Color.parseColor("#FFEFAF"));
              exit.setTextSize(26);
              exit.setAllCaps(false);
              exit.setShadowLayer(12, 4, 4, Color.parseColor("#3E2723"));
              exit.setBackgroundColor(Color.TRANSPARENT);
              exit.setGravity(Gravity.CENTER);
              addEffect(exit);
              exit.setOnClickListener(v-> finishAffinity());
              root.addView(play);
              root.addView(exit);
              root.getViewTreeObserver().addOnGlobalLayoutListener(new android.view.ViewTreeObserver.OnGlobalLayoutListener(){
                public void onGlobalLayout(){
                  int w=root.getWidth(), h=root.getHeight();
                  if(w==0) return;
                  int pw=(int)(w*0.395f);
                  int ph=(int)(h*0.072f);
                  int topY=(int)(h*0.708f);
                  int leftPlay=(int)(w*0.057f);
                  int leftExit=(int)(w*0.545f);
                  FrameLayout.LayoutParams lpPlay=new FrameLayout.LayoutParams(pw, ph);
                  lpPlay.leftMargin=leftPlay;
                  lpPlay.topMargin=topY;
                  play.setLayoutParams(lpPlay);
                  FrameLayout.LayoutParams lpExit=new FrameLayout.LayoutParams(pw, ph);
                  lpExit.leftMargin=leftExit;
                  lpExit.topMargin=topY;
                  exit.setLayoutParams(lpExit);
                }
              });
              setContentView(root);
            }
          }
          SPLASH
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.*;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.*;
          import java.util.ArrayList;
          public class MainActivity extends Activity{
            SharedPreferences prefs; MediaPlayer bgMusic; boolean isMuted=false;
            protected void onCreate(Bundle b){ super.onCreate(b); prefs=getSharedPreferences("jajan",0); isMuted=prefs.getBoolean("mute",false); try{ int mid=getResources().getIdentifier("music","raw",getPackageName()); if(mid!=0){ bgMusic=MediaPlayer.create(this,mid); bgMusic.setLooping(true); if(!isMuted) bgMusic.start(); } }catch(Exception e){} setContentView(new GameView(this)); }
            protected void onPause(){ super.onPause(); try{ if(bgMusic!=null) bgMusic.pause(); }catch(Exception e){} }
            protected void onResume(){ super.onResume(); if(!isMuted) try{ if(bgMusic!=null) bgMusic.start(); }catch(Exception e){} }
            class Particle{ float x,y,vx,vy,r,alpha; int col; float rot,vr; }
            class FloatText{ float x,y,vy,alpha; String txt; int col; float scale; }
            class GameView extends View{
              int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS];
              float cellW, cellH, gridX, gridY;
              RectF boxLevel, boxScore, boxMoves, boxMute, btnRestart;
              int level=1, score=0, moves=28, target=500;
              float downX, downY; int downR, downC; int selR=-1, selC=-1;
              Bitmap[] jajanBmp=new Bitmap[6]; Bitmap bg;
              ArrayList<Particle> parts=new ArrayList<>();
              ArrayList<FloatText> floatTexts=new ArrayList<>();
              int levelUpTimer=0; boolean showLevelUp=false;
              int jackpotR=-1, jackpotC=-1; boolean jackpotReady=false; int jackpotAnim=0; int failCount=0; boolean showJackpot=false; int jackpotPopup=0;
              boolean isGameOver=false; String overReason=""; int overAnim=0;
              int[] jajanColors=new int[]{Color.parseColor("#4CAF50"), Color.parseColor("#FFEB3B"), Color.parseColor("#E0E0E0"), Color.parseColor("#FF5722"), Color.parseColor("#81C784"), Color.parseColor("#E91E63")};
              public GameView(Context c){ super(c); try{ int bgId=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(bgId!=0) bg=BitmapFactory.decodeResource(getResources(),bgId); for(int i=0;i<6;i++){ int id=getResources().getIdentifier("jajan0"+(i+1),"drawable",getPackageName()); if(id!=0) jajanBmp[i]=BitmapFactory.decodeResource(getResources(),id); } }catch(Exception e){} }
              void saveGame(){ try{ SharedPreferences.Editor ed=prefs.edit(); ed.putInt("level",level); ed.putInt("score",score); ed.putInt("moves",moves); ed.putInt("target",target); ed.putInt("fail",failCount); StringBuilder sb=new StringBuilder(); for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) sb.append(grid[r][cc]).append(","); ed.putString("grid",sb.toString()); ed.apply(); }catch(Exception e){} }
              boolean loadGame(){ try{ if(!prefs.contains("grid")) return false; level=prefs.getInt("level",1); score=prefs.getInt("score",0); moves=prefs.getInt("moves",28); target=prefs.getInt("target",500); failCount=prefs.getInt("fail",0); String s=prefs.getString("grid",""); if(s.length()<10) return false; String[] ar=s.split(","); int idx=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ if(idx<ar.length) grid[r][cc]=Integer.parseInt(ar[idx]); idx++; } return true; }catch(Exception e){} return false; }
              void toggleMute(){ isMuted=!isMuted; try{ prefs.edit().putBoolean("mute",isMuted).apply(); }catch(Exception e){} try{ if(isMuted){ if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.pause(); } else { if(((MainActivity)getContext()).bgMusic!=null) ((MainActivity)getContext()).bgMusic.start(); } }catch(Exception e){} }
              void initGridSameLevel(){ int types=Math.min(5+level/2,6); for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int v; do{ v=(int)(Math.random()*types); grid[r][cc]=v; }while((r>=2 && grid[r][cc]==grid[r-1][cc] && grid[r][cc]==grid[r-2][cc])||(cc>=2 && grid[r][cc]==grid[r][cc-1] && grid[r][cc]==grid[r][cc-2])); } int tries=0; while(!hasPossibleMoves()&&tries<50){ shuffleGrid(); tries++; } score=0; moves=Math.max(28-(level-1)*2,12); failCount=0; jackpotReady=false; selR=-1; selC=-1; isGameOver=false; saveGame(); }
              void initGrid(){ target=500+(level-1)*150; initGridSameLevel(); }
              void shuffleGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) grid[r][cc]=(int)(Math.random()*Math.min(5+level/2,6)); }
              boolean hasMatchAtBoard(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ if(r<ROWS-2 && grid[r][cc]==grid[r+1][cc] && grid[r][cc]==grid[r+2][cc]) return true; if(cc<COLS-2 && grid[r][cc]==grid[r][cc+1] && grid[r][cc]==grid[r][cc+2]) return true; } return false; }
              boolean hasPossibleMoves(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ if(cc+1<COLS){ int t=grid[r][cc]; grid[r][cc]=grid[r][cc+1]; grid[r][cc+1]=t; if(hasMatchAtBoard()){ t=grid[r][cc]; grid[r][cc]=grid[r][cc+1]; grid[r][cc+1]=t; return true; } t=grid[r][cc]; grid[r][cc]=grid[r][cc+1]; grid[r][cc+1]=t; } if(r+1<ROWS){ int t=grid[r][cc]; grid[r][cc]=grid[r+1][cc]; grid[r+1][cc]=t; if(hasMatchAtBoard()){ t=grid[r][cc]; grid[r][cc]=grid[r+1][cc]; grid[r+1][cc]=t; return true; } t=grid[r][cc]; grid[r][cc]=grid[r+1][cc]; grid[r+1][cc]=t; } } return false; }
              void setGameOver(String reason){ isGameOver=true; overReason=reason; overAnim=0; }
              void spawnWah(float x,float y,int type,boolean isJackpot){ int count=isJackpot?50:25; int baseCol=type>=0&&type<6?jajanColors[type]:Color.YELLOW; for(int i=0;i<count;i++){ Particle p=new Particle(); p.x=x; p.y=y; float ang=(float)(Math.random()*Math.PI*2); float spd=(float)(Math.random()*(isJackpot?14:10)+2); p.vx=(float)Math.cos(ang)*spd; p.vy=(float)Math.sin(ang)*spd-(isJackpot?5:2); p.r=(float)(Math.random()*(isJackpot?10:6)+3); p.alpha=255; p.col=baseCol; if(isJackpot && Math.random()>0.5) p.col=Color.YELLOW; p.rot=(float)(Math.random()*360); p.vr=(float)(Math.random()*16-8); parts.add(p); } FloatText ft=new FloatText(); ft.x=x; ft.y=y; ft.vy=isJackpot?-3.5f:-2f; ft.alpha=255; ft.txt=isJackpot?"+500 JACKPOT!":"+20"; ft.col=isJackpot?Color.YELLOW:Color.WHITE; ft.scale=isJackpot?1.6f:1.1f; floatTexts.add(ft); }
              boolean check(){ boolean[][] del=new boolean[ROWS][COLS]; boolean found=false; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ if(r<ROWS-2 && grid[r][cc]==grid[r+1][cc] && grid[r][cc]==grid[r+2][cc]){ del[r][cc]=del[r+1][cc]=del[r+2][cc]=true; found=true; } if(cc<COLS-2 && grid[r][cc]==grid[r][cc+1] && grid[r][cc]==grid[r][cc+2]){ del[r][cc]=del[r][cc+1]=del[r][cc+2]=true; found=true; } } if(found){ boolean gotJack=false; if(jackpotReady && del[jackpotR][jackpotC]){ gotJack=true; score+=500; showJackpot=true; jackpotPopup=0; spawnWah(gridX+jackpotC*cellW+cellW/2, gridY+jackpotR*cellH+cellH/2, grid[jackpotR][jackpotC], true); jackpotReady=false; failCount=0; } for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(del[r][cc]){ if(!(gotJack && r==jackpotR && cc==jackpotC)){ spawnWah(gridX+cc*cellW+cellW/2, gridY+r*cellH+cellH/2, grid[r][cc], false); } score+=20; grid[r][cc]=-1; } for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=(int)(Math.random()*Math.min(5+level/2,6)); } if(score>=target){ level++; showLevelUp=true; levelUpTimer=0; score=0; target=500+(level-1)*150; moves=Math.max(28-(level-1)*2,12); } saveGame(); if(moves<=0 && score<target) setGameOver("MOVES HABIS!"); else if(!hasPossibleMoves()) setGameOver("GAK ADA LANGKAH!"); return true; } failCount++; if(failCount>10 &&!jackpotReady){ if(Math.random()>0.35){ jackpotReady=true; jackpotR=(int)(Math.random()*ROWS); jackpotC=(int)(Math.random()*COLS); } } if(moves<=0 && score<target) setGameOver("MOVES HABIS!"); else if(!hasPossibleMoves()) setGameOver("GAK ADA LANGKAH!"); saveGame(); return false; }
              protected void onDraw(Canvas canvas){
                try{
                  int w=getWidth(), h=getHeight(); if(w==0||h==0) return;
                  if(cellW==0){
                    gridX=w*0.032f; gridY=h*0.392f; cellW=(w-gridX*2)/COLS; cellH=cellW*0.98f;
                    float bw=w*0.225f, bh=h*0.05f; float muteS=w*0.11f;
                    boxLevel=new RectF(w*0.032f, h*0.035f, w*0.032f+bw, h*0.035f+bh);
                    boxScore=new RectF(w*0.968f-bw, h*0.035f, w*0.968f, h*0.035f+bh);
                    boxMoves=new RectF(w*0.032f, h*0.108f, w*0.032f+bw, h*0.108f+bh);
                    boxMute=new RectF(w*0.968f-bw/2-muteS/2, h*0.108f, w*0.968f-bw/2+muteS/2, h*0.108f+muteS);
                    btnRestart=new RectF(w*0.25f, h*0.58f, w*0.75f, h*0.65f);
                    if(!loadGame()){ initGrid(); } else { if(!hasPossibleMoves()) initGridSameLevel(); }
                  }
                  if(bg!=null) canvas.drawBitmap(bg,null,new Rect(0,0,w,h),null); else canvas.drawColor(Color.parseColor("#5D4037"));
                  Paint boxBg=new Paint(Paint.ANTI_ALIAS_FLAG); boxBg.setColor(Color.parseColor("#3E2723"));
                  Paint boxBd=new Paint(Paint.ANTI_ALIAS_FLAG); boxBd.setColor(Color.parseColor("#FFCA28")); boxBd.setStyle(Paint.Style.STROKE); boxBd.setStrokeWidth(2);
                  Paint lbl=new Paint(Paint.ANTI_ALIAS_FLAG); lbl.setColor(Color.parseColor("#FFCA28")); lbl.setTextAlign(Paint.Align.CENTER); lbl.setTextSize(w*0.025f); lbl.setFakeBoldText(true);
                  Paint val=new Paint(Paint.ANTI_ALIAS_FLAG); val.setColor(Color.WHITE); val.setTextAlign(Paint.Align.CENTER); val.setFakeBoldText(true);
                  if(boxLevel!=null){ canvas.drawRoundRect(boxLevel,8,8,boxBg); canvas.drawRoundRect(boxLevel,8,8,boxBd); canvas.drawText("LEVEL", boxLevel.centerX(), boxLevel.top+w*0.03f, lbl); val.setTextSize(w*0.045f); canvas.drawText(String.valueOf(level), boxLevel.centerX(), boxLevel.centerY()+w*0.03f, val); }
                  if(boxMoves!=null){ canvas.drawRoundRect(boxMoves,8,8,boxBg); canvas.drawRoundRect(boxMoves,8,8,boxBd); canvas.drawText("MOVES", boxMoves.centerX(), boxMoves.top+w*0.03f, lbl); val.setTextSize(w*0.045f); canvas.drawText(String.valueOf(moves), boxMoves.centerX(), boxMoves.centerY()+w*0.03f, val); }
                  if(boxScore!=null){ canvas.drawRoundRect(boxScore,8,8,boxBg); canvas.drawRoundRect(boxScore,8,8,boxBd); canvas.drawText("SCORE", boxScore.centerX(), boxScore.top+w*0.03f, lbl); val.setTextSize(w*0.032f); canvas.drawText(score+"/"+target, boxScore.centerX(), boxScore.centerY()+w*0.028f, val); }
