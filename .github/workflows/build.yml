name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Project
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/java/com/rians/jajancrush

          cp bg_desa.png app/src/main/res/drawable/
          cp jajan01.png app/src/main/res/drawable/
          cp jajan02.png app/src/main/res/drawable/
          cp jajan03.png app/src/main/res/drawable/
          cp jajan04.png app/src/main/res/drawable/
          cp jajan05.png app/src/main/res/drawable/
          cp jajan06.png app/src/main/res/drawable/
          cp bg_menu_kayu.png app/src/main/res/drawable/
          cp bg_menu_final.png app/src/main/res/drawable/
          cp char_cowok_salam.png app/src/main/res/drawable/
          cp char_cewek_salam.png app/src/main/res/drawable/

          if [ -f music.mp3 ]; then cp music.mp3 app/src/main/res/raw/; fi
          if [ -f icon.png ]; then cp icon.png app/src/main/res/drawable/; fi

          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.*;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.*;
          import java.util.ArrayList;
          import java.util.Random;

          public class MainActivity extends Activity {
            SharedPreferences prefs; MediaPlayer mp; boolean isMuted=false;
            protected void onCreate(Bundle b){ super.onCreate(b);
              prefs=getSharedPreferences("jajan",0);
              isMuted=prefs.getBoolean("mute",false);
              GameView gv=new GameView(this); setContentView(gv);
              try{ if(!isMuted){ mp=MediaPlayer.create(this, R.raw.music); mp.setLooping(true); mp.start(); } }catch(Exception e){}
            }
            protected void onPause(){ super.onPause(); if(mp!=null) mp.pause(); }
            protected void onResume(){ super.onResume(); if(mp!=null &&!isMuted) mp.start(); }

            class Particle{ float x,y,vx,vy,life; int col; Particle(float x,float y,int c){ this.x=x; this.y=y; col=c; vx=(float)(Math.random()*10-5); vy=(float)(Math.random()*-12-2); life=1f; } boolean upd(){ x+=vx; y+=vy; vy+=0.4f; life-=0.03f; return life>0; } }
            class FloatText{ float x,y,vy,alpha; String txt; FloatText(float x,float y,String t){ this.x=x; this.y=y; txt=t; vy=-2.5f; alpha=1f; } boolean upd(){ y+=vy; alpha-=0.025f; return alpha>0; } }

            class GameView extends View{
              int ROWS=6, COLS=5; int[][] grid=new int[ROWS][COLS];
              float cellW, cellH, gridX, gridY, gridW, gridH;
              RectF boxLevel, boxScore, boxMoves, boxMute, btnRestart, btnPlay;
              int level=1, score=0, moves=28, target=500;
              float downX, downY; int downR=-1, downC=-1;
              Bitmap[] jajanBmp=new Bitmap[6];
              Bitmap bgDesa, bgMenuKayu, charCowok, charCewek;
              ArrayList<Particle> parts=new ArrayList<>();
              ArrayList<FloatText> floatTexts=new ArrayList<>();
              int levelUpTimer=0; boolean showLevelUp=false;
              int jackpotR=-1, jackpotC=-1; int jackpotTimer=0; boolean showJackpot=false;
              boolean isGameOver=false; String overReason="";
              boolean showMenu=true; float menuAnim=0; long menuStart;
              int[] jajanColors=new int[]{Color.parseColor("#FF6B6B"),Color.parseColor("#4ECDC4"),Color.parseColor("#FFE66D"),Color.parseColor("#6A4C93"),Color.parseColor("#FF8E53"),Color.parseColor("#2EC4B6")};

              public GameView(Context c){ super(c);
                jajanBmp[0]=BitmapFactory.decodeResource(getResources(), R.drawable.jajan01);
                jajanBmp[1]=BitmapFactory.decodeResource(getResources(), R.drawable.jajan02);
                jajanBmp[2]=BitmapFactory.decodeResource(getResources(), R.drawable.jajan03);
                jajanBmp[3]=BitmapFactory.decodeResource(getResources(), R.drawable.jajan04);
                jajanBmp[4]=BitmapFactory.decodeResource(getResources(), R.drawable.jajan05);
                jajanBmp[5]=BitmapFactory.decodeResource(getResources(), R.drawable.jajan06);
                try{ bgDesa=BitmapFactory.decodeResource(getResources(), R.drawable.bg_desa); }catch(Exception e){}
                try{ bgMenuKayu=BitmapFactory.decodeResource(getResources(), R.drawable.bg_menu_kayu); }catch(Exception e){ bgMenuKayu=bgDesa; }
                try{ charCowok=BitmapFactory.decodeResource(getResources(), R.drawable.char_cowok_salam); }catch(Exception e){}
                try{ charCewek=BitmapFactory.decodeResource(getResources(), R.drawable.char_cewek_salam); }catch(Exception e){}
                menuStart=System.currentTimeMillis();
                if(!loadGame()){ initGrid(); }
              }

              void saveGame(){ try{ SharedPreferences.Editor ed=prefs.edit(); ed.putInt("lv",level); ed.putInt("sc",score); ed.putInt("mv",moves); ed.putInt("tg",target); for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) ed.putInt("g"+r+cc,grid[r][cc]); ed.apply(); }catch(Exception e){} }
              boolean loadGame(){ try{ if(!prefs.contains("lv")) return false; level=prefs.getInt("lv",1); score=prefs.getInt("sc",0); moves=prefs.getInt("mv",28); target=prefs.getInt("tg",500); for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) grid[r][cc]=prefs.getInt("g"+r+cc, new Random().nextInt(6)); return true; }catch(Exception e){ return false; } }
              void toggleMute(){ isMuted=!isMuted; prefs.edit().putBoolean("mute",isMuted).apply(); if(isMuted){ if(mp!=null) mp.pause(); }else{ if(mp!=null) mp.start(); } }
              void initGridSameLevel(){ Random rd=new Random(); for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) grid[r][cc]=rd.nextInt(6); moves=28+level*2; isGameOver=false; saveGame(); }
              void initGrid(){ target=500+(level-1)*300; Random rd=new Random(); for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) grid[r][cc]=rd.nextInt(6); moves=28+level*2; isGameOver=false; while(hasMatchAtBoard() ||!hasPossibleMoves()) shuffleGrid(); saveGame(); }
              void shuffleGrid(){ Random rd=new Random(); for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) grid[r][cc]=rd.nextInt(6); }
              boolean hasMatchAtBoard(){ for(int r=0;r<ROWS;r++) for(int c=0;c<COLS-2;c++) if(grid[r][c]==grid[r][c+1] && grid[r][c]==grid[r][c+2]) return true; for(int r=0;r<ROWS-2;r++) for(int c=0;c<COLS;c++) if(grid[r][c]==grid[r+1][c] && grid[r][c]==grid[r+2][c]) return true; return false; }
              boolean hasPossibleMoves(){ for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++) for(int dr=-1;dr<=1;dr++) for(int dc=-1;dc<=1;dc++) if(Math.abs(dr)+Math.abs(dc)==1){ int nr=r+dr,nc=c+dc; if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){ int tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; boolean m=hasMatchAtBoard(); tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; if(m) return true; } } return false; }
              void setGameOver(String reason){ isGameOver=true; overReason=reason; }
              void spawnWah(float x,float y,int col){ for(int i=0;i<12;i++) parts.add(new Particle(x,y,col)); floatTexts.add(new FloatText(x,y,"WAH!")); }

              boolean check(){ boolean[][] del=new boolean[ROWS][COLS]; boolean found=false;
                for(int r=0;r<ROWS;r++) for(int c=0;c<COLS-2;c++) if(grid[r][c]==grid[r][c+1]&&grid[r][c]==grid[r][c+2]){ del[r][c]=del[r][c+1]=del[r][c+2]=true; found=true; }
                for(int r=0;r<ROWS-2;r++) for(int c=0;c<COLS;c++) if(grid[r][c]==grid[r+1][c]&&grid[r][c]==grid[r+2][c]){ del[r][c]=del[r+1][c]=del[r+2][c]=true; found=true; }
                if(!found) return false;
                int cnt=0; for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++) if(del[r][c]){ spawnWah(gridX+c*cellW+cellW/2, gridY+r*cellH+cellH/2, jajanColors[grid[r][c]]); grid[r][c]=-1; cnt++; }
                score+=cnt*10*level; if(jackpotR>=0&&del[jackpotR][jackpotC]){ score+=500; showJackpot=true; jackpotTimer=60; }
                for(int c=0;c<COLS;c++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][c]!=-1){ grid[write][c]=grid[r][c]; write--; } for(int r=write;r>=0;r--) grid[r][c]=new Random().nextInt(6); }
                moves--; saveGame(); if(score>=target){ level++; levelUpTimer=60; showLevelUp=true; initGrid(); } else if(moves<=0){ setGameOver("Moves Habis!"); } else if(!hasPossibleMoves()){ shuffleGrid(); }
                return true;
              }

              protected void onDraw(Canvas canvas){
                try{
                  int w=getWidth(), h=getHeight();
                  if(cellW==0){
                    gridX=w*0.032f; gridY=h*0.22f; gridW=w*0.936f; gridH=h*0.56f;
                    cellW=gridW/COLS; cellH=gridH/ROWS;
                    float bw=w*0.225f, bh=h*0.08f;
                    boxLevel=new RectF(w*0.032f, h*0.02f, w*0.032f+bw, h*0.02f+bh);
                    boxScore=new RectF(w*0.285f, h*0.02f, w*0.285f+bw, h*0.02f+bh);
                    boxMoves=new RectF(w*0.538f, h*0.02f, w*0.538f+bw, h*0.02f+bh);
                    boxMute=new RectF(w*0.82f, h*0.02f, w*0.98f, h*0.10f);
                    btnRestart=new RectF(w*0.32f, h*0.82f, w*0.68f, h*0.88f);
                    btnPlay=new RectF(w*0.25f, h*0.70f, w*0.75f, h*0.78f);
                    if(!loadGame()){ initGrid(); }
                  }

                  // BACKGROUND DESA
                  if(bgDesa!=null) canvas.drawBitmap(bgDesa, null, new RectF(0,0,w,h), null); else { canvas.drawColor(Color.parseColor("#8BC34A")); }

                  // MENU SALAM OPENING - VIDEO BOING
                  if(showMenu){
                    long elapsed=System.currentTimeMillis()-menuStart;
                    float t=Math.min(1f, elapsed/700f);
                    float bounce=(float)(1 - Math.pow(2, -10*t) * Math.cos(t*12));
                    if(bounce>1) bounce=1;
                    if(bgMenuKayu!=null) canvas.drawBitmap(bgMenuKayu, null, new RectF(0,0,w,h), null);
                    Paint p=new Paint(); p.setAntiAlias(true);
                    float charH=h*0.42f, charW=charH*0.5f;
                    float yCowok=h*0.32f + (1-bounce)*h*0.6f;
                    float yCewek=h*0.32f + (1-bounce)*h*0.6f;
                    if(elapsed>120) yCewek=h*0.32f + (1-Math.min(1f,(elapsed-120)/700f))*h*0.6f;
                    if(charCowok!=null) canvas.drawBitmap(charCowok, null, new RectF(w*0.08f, yCowok, w*0.08f+charW, yCowok+charH), null);
                    if(charCewek!=null) canvas.drawBitmap(charCewek, null, new RectF(w*0.92f-charW, yCewek, w*0.92f, yCewek+charH), null);
                    Paint txtP=new Paint(); txtP.setColor(Color.WHITE); txtP.setTextSize(w*0.065f); txtP.setFakeBoldText(true); txtP.setShadowLayer(6,3,3,Color.BLACK); txtP.setTextAlign(Paint.Align.CENTER);
                    canvas.drawText("RIANS JAJAN CRUSH", w/2f, h*0.18f, txtP);
                    txtP.setTextSize(w*0.04f); canvas.drawText("V17.2 Menu Salam - No Geter", w/2f, h*0.23f, txtP);
                    Paint btnP=new Paint(); btnP.setColor(Color.parseColor("#FF5722")); btnP.setAntiAlias(true);
                    canvas.drawRoundRect(btnPlay, 20,20,btnP);
                    txtP.setColor(Color.WHITE); txtP.setTextSize(w*0.055f); canvas.drawText("MAIN ▶", w/2f, h*0.755f, txtP);
                    postInvalidateDelayed(16); return;
                  }

                  // DRAW GRID - NO GETER V5
                  Paint pp=new Paint(Paint.ANTI_ALIAS_FLAG);
                  pp.setColor(Color.argb(120,0,0,0)); canvas.drawRoundRect(new RectF(gridX-8, gridY-8, gridX+gridW+8, gridY+gridH+8), 20,20, pp);
                  for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){
                    float x=gridX+c*cellW, y=gridY+r*cellH;
                    int idx=grid[r][c]; if(idx<0||idx>=6) continue;
                    if(jajanBmp[idx]!=null) canvas.drawBitmap(jajanBmp[idx], null, new RectF(x+4,y+4,x+cellW-4,y+cellH-4), null);
                    else { pp.setColor(jajanColors[idx]); canvas.drawRoundRect(new RectF(x+4,y+4,x+cellW-4,y+cellH-4),12,12,pp); }
                    if(r==jackpotR && c==jackpotC){ Paint jp=new Paint(); jp.setStyle(Paint.Style.STROKE); jp.setStrokeWidth(6); jp.setColor(Color.YELLOW); canvas.drawRoundRect(new RectF(x,y,x+cellW,y+cellH),12,12,jp); }
                  }
                  for(int i=parts.size()-1;i>=0;i--){ Particle pt=parts.get(i); if(!pt.upd()) parts.remove(i); else { pp.setColor(pt.col); pp.setAlpha((int)(pt.life*255)); canvas.drawCircle(pt.x,pt.y,10*pt.life,pp); } }
                  Paint ftPaint=new Paint(Paint.ANTI_ALIAS_FLAG); ftPaint.setColor(Color.YELLOW); ftPaint.setTextSize(cellW*0.5f); ftPaint.setFakeBoldText(true);
                  for(int i=floatTexts.size()-1;i>=0;i--){ FloatText ft=floatTexts.get(i); if(!ft.upd()) floatTexts.remove(i); else { ftPaint.setAlpha((int)(ft.alpha*255)); canvas.drawText(ft.txt, ft.x, ft.y, ftPaint); } }
                  if(parts.size()>0 || floatTexts.size()>0) postInvalidate();

                  if(showLevelUp){ Paint lu=new Paint(); lu.setColor(Color.WHITE); lu.setTextSize(w*0.12f); lu.setFakeBoldText(true); lu.setTextAlign(Paint.Align.CENTER); lu.setShadowLayer(10,4,4,Color.BLACK); canvas.drawText("LEVEL "+level+"!", w/2f, h/2f, lu); levelUpTimer--; if(levelUpTimer<=0) showLevelUp=false; postInvalidateDelayed(100); }
                  if(showJackpot){ Paint jT=new Paint(); jT.setColor(Color.YELLOW); jT.setTextSize(w*0.09f); jT.setFakeBoldText(true); jT.setTextAlign(Paint.Align.CENTER); jT.setShadowLayer(10,4,4,Color.RED); canvas.drawText("JACKPOT +500!", w/2f, h*0.45f, jT); jackpotTimer--; if(jackpotTimer<=0) showJackpot=false; postInvalidateDelayed(100); }
                  if(isGameOver){ Paint over=new Paint(); over.setColor(Color.argb(200,0,0,0)); canvas.drawRect(0,0,w,h,over); over.setColor(Color.WHITE); over.setTextSize(w*0.08f); over.setTextAlign(Paint.Align.CENTER); over.setFakeBoldText(true); canvas.drawText("GAME OVER", w/2f, h*0.4f, over); over.setTextSize(w*0.045f); canvas.drawText(overReason, w/2f, h*0.47f, over); Paint rp=new Paint(); rp.setColor(Color.parseColor("#4CAF50")); canvas.drawRoundRect(btnRestart,20,20,rp); over.setColor(Color.WHITE); over.setTextSize(w*0.05f); canvas.drawText("RESTART", w/2f, h*0.86f, over); }

                  // TOP HUD
                  Paint hud=new Paint(); hud.setColor(Color.argb(200,255,255,255)); hud.setAntiAlias(true);
                  canvas.drawRoundRect(boxLevel,15,15,hud); canvas.drawRoundRect(boxScore,15,15,hud); canvas.drawRoundRect(boxMoves,15,15,hud);
                  Paint ht=new Paint(); ht.setColor(Color.BLACK); ht.setTextSize(w*0.035f); ht.setFakeBoldText(true); ht.setTextAlign(Paint.Align.CENTER);
                  canvas.drawText("LVL "+level, boxLevel.centerX(), boxLevel.centerY()+10, ht);
                  canvas.drawText(score+"/"+target, boxScore.centerX(), boxScore.centerY()+10, ht);
                  canvas.drawText(moves+" MOVE", boxMoves.centerX(), boxMoves.centerY()+10, ht);
                  ht.setTextSize(w*0.06f); canvas.drawText(isMuted?"🔇":"🔊", boxMute.centerX(), boxMute.centerY()+15, ht);

                }catch(Exception e){}
              }
              public boolean onTouchEvent(MotionEvent e){
                if(e.getAction()==MotionEvent.ACTION_DOWN){
                  float x=e.getX(), y=e.getY();
                  if(showMenu){ if(btnPlay.contains(x,y)){ showMenu=false; return true; } return true; }
                  if(boxMute.contains(x,y)){ toggleMute(); invalidate(); return true; }
                  if(isGameOver){ if(btnRestart.contains(x,y)){ level=1; score=0; initGrid(); invalidate(); return true; } return true; }
                  if(y>gridY && y<gridY+gridH && x>gridX && x<gridX+gridW){ downX=x; downY=y; downR=(int)((y-gridY)/cellH); downC=(int)((x-gridX)/cellW); return true; }
                }
                if(e.getAction()==MotionEvent.ACTION_UP){
                  if(downR==-1) return true;
                  float x=e.getX(), y=e.getY(); int nr=(int)((y-gridY)/cellH), nc=(int)((x-gridX)/cellW);
                  if(Math.abs(nr-downR)+Math.abs(nc-downC)==1 && nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){ int tmp=grid[downR][downC]; grid[downR][downC]=grid[nr][nc]; grid[nr][nc]=tmp; if(!hasMatchAtBoard()){ tmp=grid[downR][downC]; grid[downR][downC]=grid[nr][nc]; grid[nr][nc]=tmp; } else { check(); } invalidate(); } downR=-1; downC=-1; return true;
                }
                return true;
              }
            }
          }
          JAVAEOF

          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rians.jajancrush'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rians.jajancrush"
                  minSdk 21
                  targetSdk 34
                  versionCode 21
                  versionName "17.2 Menu Salam No Geter"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {}
          GRADLE

          cat > build.gradle << 'B'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          B

          cat > settings.gradle << 'SET'
          include ':app'
          SET

          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Rians Jajan Crush" android:icon="@drawable/icon" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

      - name: Build APK
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=/tmp/gradle-8.4/bin:$PATH
          cd $GITHUB_WORKSPACE
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jajan-crush-v17.2-menu-salam-no-geter
          path: app/build/outputs/apk/debug/app-debug.apk
