name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
      - name: Make project
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          printf "pluginManagement {\n repositories {\n google()\n mavenCentral()\n gradlePluginPortal()\n }\n}\ninclude ':app'\n" > settings.gradle
          echo " " > build.gradle
          printf "plugins { id 'com.android.application' version '8.1.0' }\nandroid { namespace 'com.rians.jajancrush'\n compileSdk 34\n defaultConfig { applicationId 'com.rians.jajancrush'\n minSdk 21\n targetSdk 34\n versionCode 1\n versionName '1.0' } }\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Rians"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf "package com.rians.jajancrush;\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.widget.TextView;\npublic class MainActivity extends Activity {\n protected void onCreate(Bundle b){\n super.onCreate(b);\n TextView tv=new TextView(this);\n tv.setText(\"Rians Jajan Crush OK\");\n setContentView(tv);\n }\n}\n" > app/src/main/java/com/rians/jajancrush/MainActivity.java
      - name: Build
        run: |
          ./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Rian-Jajan-Crush-APK
          path: app/build/outputs/apk/debug/*.apk
