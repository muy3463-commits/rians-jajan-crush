name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Make Project
        run: |
          mkdir -p app/src/main/java/com/rian/jajancrush
          mkdir -p app/src/main/res/drawable
          cp *.png app/src/main/res/drawable/ || true
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.rian.jajancrush'
            compileSdk 33
            defaultConfig {
              applicationId "com.rian.jajancrush"
              minSdk 24
              targetSdk 33
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Jajan Crush" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/rian/jajancrush/MainActivity.java << 'EOF'
          package com.rian.jajancrush;
          import android.os.Bundle; import android.widget.*; import android.view.Gravity; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setBackgroundColor(0xFF8D6E63); root.setPadding(20,20,20,20); root.setGravity(17);
              TextView tv=new TextView(this); tv.setText("Rian Jajan Crush Sukses!"); tv.setTextColor(-1); tv.setTextSize(24); tv.setGravity(17);
              ImageView iv=new ImageView(this); try{ iv.setImageResource(getResources().getIdentifier("pria_kiri","drawable",getPackageName())); }catch(Exception e){} iv.setAdjustViewBounds(true);
              root.addView(tv); root.addView(iv); setContentView(root);
            }
          }
          EOF
      - name: Build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
         ./gradle-8.0/bin/gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-Jajan-Crush-APK
          path: app/build/outputs/apk/debug/*.apk
