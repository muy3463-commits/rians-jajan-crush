name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
      - name: Prepare Assets
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          if [ -f "icon.png" ]; then for D in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do cp icon.png app/src/main/res/$D/ic_launcher.png; cp icon.png app/src/main/res/$D/ic_launcher_round.png; done; fi
          if [ -f "bg_desa.png" ]; then cp bg_desa.png app/src/main/res/drawable/bg_desa.png; fi
          if [ -f "pria_kiri.png" ]; then cp pria_kiri.png app/src/main/res/drawable/pria_kiri.png; fi
          if [ -f "wanita_kanan.png" ]; then cp wanita_kanan.png app/src/main/res/drawable/wanita_kanan.png; fi
      - name: Make Game Animasi
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories { google(); mavenCentral() } }\ninclude ':app'\n" > settings.gradle
          echo " " > build.gradle
          printf "plugins { id 'com.android.application' version '8.1.0' }\nandroid { namespace 'com.rians.jajancrush'\n compileSdk 34\n defaultConfig { applicationId 'com.rians.jajancrush'\n minSdk 21\n targetSdk 34\n versionCode 10\n versionName '10.0-animasi' } }\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.content.Context; import android.graphics.*; import android.view.*; import java.util.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){ super.onCreate(b); setContentView(new GameView(this)); }
              class GameView extends View {
                  int ROWS=5, COLS=5; int[][] grid=new int[ROWS][COLS]; int score=0, moves=25, level=1; Random rnd=new Random();
                  int cell, boardX, boardY, boardSize; float downX, downY;
                  Paint paint, textPaint; Bitmap[] jajanBmp=new Bitmap[4]; Bitmap bgBitmap, priaBmp, wanitaBmp;
                  RectF[] tileRects=new RectF[25];
                  int emotion=0; // 0 netral, 1 senyum, 2 sedih
                  long emotionTime=0; float animScale=1f;
                  public GameView(Context c){ super(c);
                      paint=new Paint(Paint.ANTI_ALIAS_FLAG); textPaint=new Paint(Paint.ANTI_ALIAS_FLAG); textPaint.setColor(Color.WHITE); textPaint.setFakeBoldText(true);
                      try{ int id=getResources().getIdentifier("bg_desa","drawable",getPackageName()); if(id!=0) bgBitmap=BitmapFactory.decodeResource(getResources(), id);
                           int id2=getResources().getIdentifier("pria_kiri","drawable",getPackageName()); if(id2!=0) priaBmp=BitmapFactory.decodeResource(getResources(), id2);
                           int id3=getResources().getIdentifier("wanita_kanan","drawable",getPackageName()); if(id3!=0) wanitaBmp=BitmapFactory.decodeResource(getResources(), id3);
                      }catch(Exception e){}
                      initGrid();
                  }
                  void setEmotion(int e){ emotion=e; emotionTime=System.currentTimeMillis(); }
                  void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int t; int tr=0; do{ t=rnd.nextInt(4); grid[r][cc]=t; tr++; }while(isMatchAt(r,cc)&&tr<20); } }
                  boolean isMatchAt(int r,int c){ int t=grid[r][c]; if(c>=2&&grid[r][c-1]==t&&grid[r][c-2]==t) return true; if(r>=2&&grid[r-1][c]==t&&grid[r-2][c]==t) return true; return false; }
                  void createBmps(int size){
                      if(jajanBmp[0]!=null) return; int s=size-14;
                      for(int i=0;i<4;i++){ jajanBmp[i]=Bitmap.createBitmap(s,s,Bitmap.Config.ARGB_8888); Canvas cv=new Canvas(jajanBmp[i]); Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                          if(i==0){ p.setColor(Color.parseColor("#4CAF50")); cv.drawCircle(s/2f,s/2f,s/2.3f,p); p.setColor(Color.WHITE); for(int k=0;k<10;k++){ float ang=k*36; float rx=(float)(s/2f+Math.cos(Math.toRadians(ang))*s/3.5f); float ry=(float)(s/2f+Math.sin(Math.toRadians(ang))*s/3.5f); cv.drawCircle(rx,ry,s/18f,p);} }
                          else if(i==1){ p.setColor(Color.parseColor("#5D4037")); cv.drawRoundRect(new RectF(4,4,s-4,s-4),10,10,p); for(int ly=0;ly<4;ly++){ p.setColor(ly%2==0?Color.parseColor("#8D6E63"):Color.parseColor("#D7CCC8")); cv.drawRect(6, 6+ly*s/4, s-6, 6+(ly+1)*s/4, p);} }
                          else if(i==2){ p.setColor(Color.parseColor("#FBC02D")); cv.drawCircle(s/2f,s/2f,s/2.3f,p); p.setColor(Color.parseColor("#795548")); for(int k=0;k<8;k++){ float ang=k*45; float rx=(float)(s/2f+Math.cos(Math.toRadians(ang))*s/3f); float ry=(float)(s/2f+Math.sin(Math.toRadians(ang))*s/3f); cv.drawCircle(rx,ry,s/26f,p);} }
                          else { p.setColor(Color.parseColor("#D32F2F")); cv.drawRoundRect(new RectF(2,2,s-2,s-2),18,18,p); p.setColor(Color.parseColor("#FFAB91")); cv.drawCircle(s*0.35f,s*0.45f,s*0.14f,p); cv.drawCircle(s*0.7f,s*0.55f,s*0.18f,p); p.setColor(Color.YELLOW); p.setTextSize(s*0.4f); p.setTextAlign(Paint.Align.CENTER); cv.drawText("!", s/2f, s*0.65f, p); }
                      }
                  }
                  protected void onSizeChanged(int w,int h,int ow,int oh){ boardSize=(int)(Math.min(w*0.72, h*0.52)); cell=boardSize/COLS; boardX=(w-boardSize)/2; boardY=(int)(h*0.26); createBmps(cell); for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){ int idx=r*COLS+c; tileRects[idx]=new RectF(boardX+c*cell+3, boardY+r*cell+3, boardX+(c+1)*cell-3, boardY+(r+1)*cell-3); } }
                  protected void onDraw(Canvas canvas){
                      if(bgBitmap!=null){ canvas.drawBitmap(bgBitmap, null, new Rect(0,0,getWidth(),getHeight()), null); Paint dim=new Paint(); dim.setColor(Color.BLACK); dim.setAlpha(50); canvas.drawRect(0,0,getWidth(),getHeight(),dim); } else { canvas.drawColor(Color.parseColor("#6D4C41")); }
                      // Top
                      Paint wood=new Paint(); wood.setColor(Color.parseColor("#5D4037")); RectF topRect=new RectF(10,10,getWidth()-10, boardY-18); canvas.drawRoundRect(topRect, 20,20, wood);
                      Paint border=new Paint(); border.setColor(Color.parseColor("#D7A76F")); border.setStyle(Paint.Style.STROKE); border.setStrokeWidth(5); canvas.drawRoundRect(topRect,20,20,border);
                      textPaint.setTextSize(30); textPaint.setColor(Color.parseColor("#FFD54F")); textPaint.setShadowLayer(4,2,2,Color.BLACK); textPaint.setTextAlign(Paint.Align.CENTER); canvas.drawText("Rian's Jajan Crush", getWidth()/2f, 54, textPaint);
                      textPaint.setTextSize(16); textPaint.setColor(Color.WHITE); textPaint.setShadowLayer(0,0,0,0);
                      int bw=(getWidth()-60)/3; Paint box=new Paint(); box.setColor(Color.parseColor("#3E2723")); Paint boxStroke=new Paint(); boxStroke.setColor(Color.parseColor("#D7A76F")); boxStroke.setStyle(Paint.Style.STROKE); boxStroke.setStrokeWidth(3);
                      for(int i=0;i<3;i++){ RectF r=new RectF(20+i*(bw+10), 68, 20+i*(bw+10)+bw, 106); canvas.drawRoundRect(r,10,10,box); canvas.drawRoundRect(r,10,10,boxStroke); String txt=i==0?"Level "+level : i==1?"Score "+score : "Moves "+moves; canvas.drawText(txt, r.centerX(), r.centerY()+5, textPaint); }
                      // Board
                      Paint boardBg=new Paint(); boardBg.setColor(Color.parseColor("#8D6E63")); RectF boardFrame=new RectF(boardX-10, boardY-10, boardX+boardSize+10, boardY+boardSize+10); canvas.drawRoundRect(boardFrame, 18,18, boardBg); canvas.drawRoundRect(boardFrame,18,18,border);
                      for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){ int idx=r*COLS+c; Paint tileP=new Paint(); tileP.setColor(Color.parseColor("#EFEBE9")); tileP.setAlpha(235); canvas.drawRoundRect(tileRects[idx], 12,12, tileP); if(grid[r][c]!=-1 && jajanBmp[grid[r][c]]!=null) canvas.drawBitmap(jajanBmp[grid[r][c]], boardX+c*cell+7, boardY+r*cell+7, null); }
                      // Characters with emotion
                      long now=System.currentTimeMillis(); float elapsed=(now-emotionTime)/1000f;
                      if(emotion==1 && elapsed<1.2f){ animScale=1f + (float)Math.sin(elapsed*12)*0.12f; } else if(emotion==2){ animScale=0.9f; } else { animScale=1f; if(emotion!=0 && elapsed>1.5f) emotion=0; }
                      int charW= (int)(getWidth()*0.22); int charH= (int)(charW*1.6);
                      if(priaBmp!=null){ int left=4; int top=boardY+boardSize - charH/2; int right=left+(int)(charW*animScale); int bottom=top+(int)(charH*animScale); canvas.drawBitmap(priaBmp, null, new Rect(left, top, right, bottom), null);
                          // Emotion bubble
                          Paint bub=new Paint(Paint.ANTI_ALIAS_FLAG); bub.setColor(Color.WHITE); RectF bRect=new RectF(left+charW*0.6f, top-18, left+charW*1.2f, top+22); canvas.drawRoundRect(bRect,14,14,bub);
                          Paint emoText=new Paint(Paint.ANTI_ALIAS_FLAG); emoText.setTextSize(24); emoText.setTextAlign(Paint.Align.CENTER);
                          if(emotion==1) { emoText.setColor(Color.BLACK); canvas.drawText("😄", bRect.centerX(), bRect.centerY()+8, emoText); }
                          else if(emotion==2){ emoText.setColor(Color.BLACK); canvas.drawText("😢", bRect.centerX(), bRect.centerY()+8, emoText); }
                          else if(moves<5){ emoText.setColor(Color.BLACK); canvas.drawText("😟", bRect.centerX(), bRect.centerY()+8, emoText); }
                      }
                      if(wanitaBmp!=null){ int right=getWidth()-4; int left=right-(int)(charW*animScale); int top=boardY+boardSize - charH/2; int bottom=top+(int)(charH*animScale); canvas.drawBitmap(wanitaBmp, null, new Rect(left, top, right, bottom), null);
                          Paint bub=new Paint(Paint.ANTI_ALIAS_FLAG); bub.setColor(Color.WHITE); RectF bRect=new RectF(left-charW*0.2f, top-18, left+charW*0.4f, top+22); canvas.drawRoundRect(bRect,14,14,bub);
                          Paint emoText=new Paint(Paint.ANTI_ALIAS_FLAG); emoText.setTextSize(24); emoText.setTextAlign(Paint.Align.CENTER);
                          if(emotion==1) { canvas.drawText("🥰", bRect.centerX(), bRect.centerY()+8, emoText); }
                          else if(emotion==2){ canvas.drawText("😭", bRect.centerX(), bRect.centerY()+8, emoText); }
                      }
                      textPaint.setTextSize(15); textPaint.setColor(Color.WHITE); canvas.drawText(moves<=0?"KALAH! Tap untuk main lagi": emotion==1?"MANTAP LUR! + PECAH!": "GESER JAJAN BUAT PECAH 3!", getWidth()/2f, boardY+boardSize+28, textPaint);
                      if(moves<=0){ Paint over=new Paint(); over.setColor(Color.BLACK); over.setAlpha(160); canvas.drawRect(0,0,getWidth(),getHeight(),over); textPaint.setTextSize(42); textPaint.setColor(Color.YELLOW); canvas.drawText("GAME OVER", getWidth()/2f, getHeight()/2f-20, textPaint); textPaint.setTextSize(22); textPaint.setColor(Color.WHITE); canvas.drawText("Skor: "+score+" Tap untuk ulang", getWidth()/2f, getHeight()/2f+20, textPaint); }
                      if(emotion==1) postDelayed(new Runnable(){ public void run(){ invalidate(); }}, 40);
                  }
                  public boolean onTouchEvent(MotionEvent e){
                      if(moves<=0 && e.getAction()==MotionEvent.ACTION_UP){ score=0; moves=25; initGrid(); emotion=0; invalidate(); return true; }
                      if(e.getAction()==MotionEvent.ACTION_DOWN){ downX=e.getX(); downY=e.getY(); return true; }
                      if(e.getAction()==MotionEvent.ACTION_UP){
                          float upX=e.getX(), upY=e.getY(); float dx=upX-downX, dy=upY-downY;
                          int c=(int)((downX-boardX)/cell); int r=(int)((downY-boardY)/cell);
                          if(r<0||r>=ROWS||c<0||c>=COLS) return true; int nr=r,nc=c;
                          if(Math.abs(dx)>Math.abs(dy)){ if(Math.abs(dx)>cell*0.25f) nc=c+(dx>0?1:-1); } else { if(Math.abs(dy)>cell*0.25f) nr=r+(dy>0?1:-1); }
                          if(nr<0||nr>=ROWS||nc<0||nc>=COLS||(nr==r&&nc==c)) return true;
                          int tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp;
                          if(!checkAndRemove()){ tmp=grid[r][c]; grid[r][c]=grid[nr][nc]; grid[nr][nc]=tmp; } else { moves--; }
                          if(moves<=0){ setEmotion(2); } invalidate(); return true;
                      } return true;
                  }
                  boolean checkAndRemove(){ boolean[][] mark=new boolean[ROWS][COLS]; boolean found=false;
                      for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS-2;cc++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r][cc+1]==t&&grid[r][cc+2]==t){ int k=cc; while(k<COLS&&grid[r][k]==t){ mark[r][k]=true; k++; found=true; } } }
                      for(int cc=0;cc<COLS;cc++) for(int r=0;r<ROWS-2;r++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r+1][cc]==t&&grid[r+2][cc]==t){ int k=r; while(k<ROWS&&grid[k][cc]==t){ mark[k][cc]=true; k++; found=true; } } }
                      if(!found) return false; int cnt=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(mark[r][cc]){ grid[r][cc]=-1; cnt++; }
                      score+=cnt*25; setEmotion(1); drop(); postDelayed(new Runnable(){ public void run(){ if(checkAndRemove()) invalidate(); }}, 220); return true; }
                  void drop(){ for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=rnd.nextInt(4); } }
              }
          }
          JAVAEOF
      - name: Build
        run: ./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Jajan-Crush-Animasi-Senyum
          path: app/build/outputs/apk/debug/*.apk
