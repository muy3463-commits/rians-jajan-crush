name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
      - name: Create Icon from YOUR image
        run: |
          pip3 install pillow -q
          python3 << 'PY'
          from PIL import Image
          import os
          src="icon.png"
          if not os.path.exists(src):
              for f in ["icon.jpg","Icon.png","ICON.PNG","bg_desa.png"]:
                  if os.path.exists(f): src=f; break
          def make_icons(img):
              for sz, folder in [(192,"mipmap-xxxhdpi"),(144,"mipmap-xxhdpi"),(96,"mipmap-xhdpi"),(72,"mipmap-hdpi"),(48,"mipmap-mdpi")]:
                  os.makedirs(f"app/src/main/res/{folder}", exist_ok=True)
                  im=img.resize((sz,sz), Image.LANCZOS)
                  im.save(f"app/src/main/res/{folder}/ic_launcher.png")
                  im.save(f"app/src/main/res/{folder}/ic_launcher_round.png")
          if os.path.exists(src):
              print(f"Pakai icon: {src}")
              img=Image.open(src).convert("RGBA")
              w,h=img.size; s=min(w,h)
              img=img.crop(((w-s)//2,(h-s)//2,(w+s)//2,(h+s)//2))
              make_icons(img)
          PY
      - name: Make Game
        run: |
          mkdir -p app/src/main/java/com/rians/jajancrush
          printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories { google(); mavenCentral() } }\ninclude ':app'\n" > settings.gradle
          echo " " > build.gradle
          printf "plugins { id 'com.android.application' version '8.1.0' }\nandroid { namespace 'com.rians.jajancrush'\n compileSdk 34\n defaultConfig { applicationId 'com.rians.jajancrush'\n minSdk 21\n targetSdk 34\n versionCode 4\n versionName '4.0' } }\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Jajan Crush" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/rians/jajancrush/MainActivity.java << 'JAVAEOF'
          package com.rians.jajancrush;
          import android.app.Activity; import android.os.Bundle; import android.content.Context; import android.graphics.*; import android.view.*; import java.util.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){ super.onCreate(b); setContentView(new GameView(this)); }
              class GameView extends View {
                  int ROWS=8, COLS=8; int[][] grid=new int[ROWS][COLS]; int selR=-1,selC=-1; int score=0; Random rnd=new Random();
                  Paint[] paints=new Paint[6]; String[] names={"KLEPON","ONDE","DADAR","LAPIS","CENIL","LUPIS"};
                  int[] colors={Color.parseColor("#4CAF50"), Color.parseColor("#FFEB3B"), Color.parseColor("#8D6E63"), Color.parseColor("#F48FB1"), Color.parseColor("#F44336"), Color.parseColor("#FFFFFF")};
                  int cell, offX, offY; Paint textPaint, scorePaint, selPaint, bgPaint;
                  public GameView(Context c){ super(c);
                      for(int i=0;i<6;i++){ paints[i]=new Paint(); paints[i].setColor(colors[i]); paints[i].setAntiAlias(true); }
                      textPaint=new Paint(); textPaint.setColor(Color.BLACK); textPaint.setAntiAlias(true); textPaint.setTextAlign(Paint.Align.CENTER); textPaint.setFakeBoldText(true);
                      scorePaint=new Paint(); scorePaint.setColor(Color.WHITE); scorePaint.setAntiAlias(true); scorePaint.setFakeBoldText(true);
                      selPaint=new Paint(); selPaint.setColor(Color.YELLOW); selPaint.setStyle(Paint.Style.STROKE); selPaint.setStrokeWidth(8);
                      bgPaint=new Paint(); bgPaint.setColor(Color.parseColor("#3E2723")); initGrid();
                  }
                  void initGrid(){ for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int t; do{ t=rnd.nextInt(6); grid[r][cc]=t; }while(isMatchAt(r,cc)); } score=0; }
                  boolean isMatchAt(int r,int c){ int t=grid[r][c]; if(c>=2&&grid[r][c-1]==t&&grid[r][c-2]==t) return true; if(r>=2&&grid[r-1][c]==t&&grid[r-2][c]==t) return true; return false; }
                  protected void onSizeChanged(int w,int h,int ow,int oh){ cell=Math.min(w/COLS,(h-200)/ROWS); offX=(w-cell*COLS)/2; offY=160; }
                  protected void onDraw(Canvas canvas){ canvas.drawColor(Color.parseColor("#5D4037")); scorePaint.setTextSize(60); canvas.drawText("JAJAN CRUSH", getWidth()/2,70,scorePaint); scorePaint.setTextSize(42); canvas.drawText("Skor: "+score, getWidth()/2,130,scorePaint);
                      for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++){ int x=offX+cc*cell; int y=offY+r*cell; canvas.drawRect(x+2,y+2,x+cell-2,y+cell-2,bgPaint); canvas.drawCircle(x+cell/2f,y+cell/2f,cell*0.38f,paints[grid[r][cc]]); textPaint.setTextSize(cell*0.22f); canvas.drawText(names[grid[r][cc]].substring(0,2), x+cell/2f, y+cell/2f+8, textPaint); if(r==selR&&cc==selC) canvas.drawRect(x+2,y+2,x+cell-2,y+cell-2,selPaint); } }
                  public boolean onTouchEvent(MotionEvent e){ if(e.getAction()!=MotionEvent.ACTION_DOWN) return true; int c=(int)((e.getX()-offX)/cell); int r=(int)((e.getY()-offY)/cell); if(r<0||r>=ROWS||c<0||c>=COLS) return true; if(selR==-1){ selR=r; selC=c; } else { if(Math.abs(selR-r)+Math.abs(selC-c)==1){ int tmp=grid[selR][selC]; grid[selR][selC]=grid[r][c]; grid[r][c]=tmp; if(!checkAndRemove()){ tmp=grid[selR][selC]; grid[selR][selC]=grid[r][c]; grid[r][c]=tmp; } } selR=-1; selC=-1; } invalidate(); return true; }
                  boolean checkAndRemove(){ boolean[][] mark=new boolean[ROWS][COLS]; boolean found=false; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS-2;cc++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r][cc+1]==t&&grid[r][cc+2]==t){ int k=cc; while(k<COLS&&grid[r][k]==t){ mark[r][k]=true; k++; found=true; } } } for(int cc=0;cc<COLS;cc++) for(int r=0;r<ROWS-2;r++){ int t=grid[r][cc]; if(t==-1) continue; if(grid[r+1][cc]==t&&grid[r+2][cc]==t){ int k=r; while(k<ROWS&&grid[k][cc]==t){ mark[k][cc]=true; k++; found=true; } } } if(!found) return false; int cnt=0; for(int r=0;r<ROWS;r++) for(int cc=0;cc<COLS;cc++) if(mark[r][cc]){ grid[r][cc]=-1; cnt++; } score+=cnt*10; drop(); postDelayed(new Runnable(){ public void run(){ if(checkAndRemove()) invalidate(); }},300); return true; }
                  void drop(){ for(int cc=0;cc<COLS;cc++){ int write=ROWS-1; for(int r=ROWS-1;r>=0;r--) if(grid[r][cc]!=-1){ grid[write][cc]=grid[r][cc]; write--; } for(int r=write;r>=0;r--) grid[r][cc]=rnd.nextInt(6); } }
              }
          }
          JAVAEOF
      - name: Build
       run: ./gradle-8.0/bin/gradle assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Jajan-Crush-Custom-Icon
          path: app/build/outputs/apk/debug/*.apk
